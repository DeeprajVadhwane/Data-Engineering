<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600"><defs></defs><rect width="1200" height="600" rx="16" fill="#FAF8F5"/><text x="40" y="54" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="30" font-weight="bold" fill="#0B2026" text-anchor="start">Lakehouse = Data Warehouse + Data Lake</text><rect x="40" y="64" width="64" height="5" rx="2.5" fill="#FF5F46"/><text x="40" y="98" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="17" font-weight="normal" fill="#5F7281" text-anchor="start">The best of both worlds on one platform.</text><rect x="40" y="130" width="330" height="340" rx="14" fill="#FFFFFF" stroke="#2272B4" stroke-width="2"/><path d="M40,170 L40,144 Q40,130 54,130 L356,130 Q370,130 370,144 L370,170 Z" fill="#2272B4"/><text x="205.0" y="156.3" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="18" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Data Warehouse</text><path d="M165,199.2 L205.0,180 L245,199.2 Z" fill="#2272B4" stroke="#0B2026" stroke-width="2.5" stroke-linejoin="round"/><rect x="169" y="199.2" width="72" height="44.8" rx="2" fill="#FFFFFF" stroke="#0B2026" stroke-width="2.5"/><rect x="185.0" y="212.0" width="40.0" height="32.0" rx="2" fill="#DCEBF7" stroke="#0B2026" stroke-width="2"/><line x1="185.0" y1="220.0" x2="225.0" y2="220.0" stroke="#0B2026" stroke-width="1.5" stroke-linecap="round"/><line x1="185.0" y1="228.0" x2="225.0" y2="228.0" stroke="#0B2026" stroke-width="1.5" stroke-linecap="round"/><line x1="185.0" y1="236.0" x2="225.0" y2="236.0" stroke="#0B2026" stroke-width="1.5" stroke-linecap="round"/><path d="M61,292 L67.3,299.2 L79,284.8" fill="none" stroke="#1B8A5A" stroke-width="5" stroke-linejoin="round"/><text x="94" y="298" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="17" font-weight="normal" fill="#1B3139" text-anchor="start">Reliable, fast SQL</text><line x1="61" y1="327" x2="79" y2="345" stroke="#D93A25" stroke-width="5" stroke-linecap="round"/><line x1="61" y1="345" x2="79" y2="327" stroke="#D93A25" stroke-width="5" stroke-linecap="round"/><text x="94" y="342" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="17" font-weight="normal" fill="#1B3139" text-anchor="start">Expensive</text><line x1="61" y1="371" x2="79" y2="389" stroke="#D93A25" stroke-width="5" stroke-linecap="round"/><line x1="61" y1="389" x2="79" y2="371" stroke="#D93A25" stroke-width="5" stroke-linecap="round"/><text x="94" y="386" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="17" font-weight="normal" fill="#1B3139" text-anchor="start">Structured data only</text><line x1="61" y1="415" x2="79" y2="433" stroke="#D93A25" stroke-width="5" stroke-linecap="round"/><line x1="61" y1="433" x2="79" y2="415" stroke="#D93A25" stroke-width="5" stroke-linecap="round"/><text x="94" y="430" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="17" font-weight="normal" fill="#1B3139" text-anchor="start">Weak for ML</text><text x="405" y="305" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="56" font-weight="bold" fill="#0B2026" text-anchor="middle">+</text><rect x="440" y="130" width="330" height="340" rx="14" fill="#FFFFFF" stroke="#1B8A5A" stroke-width="2"/><path d="M440,170 L440,144 Q440,130 454,130 L756,130 Q770,130 770,144 L770,170 Z" fill="#1B8A5A"/><text x="605.0" y="156.3" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="18" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Data Lake</text><g fill="#DDF1E7" stroke="#0B2026" stroke-width="2"><ellipse cx="589.0" cy="217.2" rx="20.0" ry="19.2"/><ellipse cx="606.6" cy="204.0" rx="20.8" ry="22.8"/><ellipse cx="622.6" cy="217.2" rx="20.8" ry="19.2"/></g><rect x="589.0" y="213.0" width="33.6" height="24.0" fill="#DDF1E7"/><ellipse cx="605.0" cy="213.0" rx="24.0" ry="9.0" fill="#DDF1E7"/><path d="M461,292 L467.3,299.2 L479,284.8" fill="none" stroke="#1B8A5A" stroke-width="5" stroke-linejoin="round"/><text x="494" y="298" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="17" font-weight="normal" fill="#1B3139" text-anchor="start">Cheap storage</text><path d="M461,336 L467.3,343.2 L479,328.8" fill="none" stroke="#1B8A5A" stroke-width="5" stroke-linejoin="round"/><text x="494" y="342" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="17" font-weight="normal" fill="#1B3139" text-anchor="start">Any kind of data</text><path d="M461,380 L467.3,387.2 L479,372.8" fill="none" stroke="#1B8A5A" stroke-width="5" stroke-linejoin="round"/><text x="494" y="386" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="17" font-weight="normal" fill="#1B3139" text-anchor="start">Good for ML</text><line x1="461" y1="415" x2="479" y2="433" stroke="#D93A25" stroke-width="5" stroke-linecap="round"/><line x1="461" y1="433" x2="479" y2="415" stroke="#D93A25" stroke-width="5" stroke-linecap="round"/><text x="494" y="430" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="17" font-weight="normal" fill="#1B3139" text-anchor="start">No reliability (ACID)</text><text x="805" y="305" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="56" font-weight="bold" fill="#0B2026" text-anchor="middle">=</text><rect x="840" y="130" width="320" height="340" rx="14" fill="#FFFFFF" stroke="#FF5F46" stroke-width="2"/><path d="M840,170 L840,144 Q840,130 854,130 L1146,130 Q1160,130 1160,144 L1160,170 Z" fill="#FF5F46"/><text x="1000.0" y="156.3" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="18" font-weight="bold" fill="#FFFFFF" text-anchor="middle">LAKEHOUSE</text><g fill="#FFE6E0" stroke="#0B2026" stroke-width="2"><ellipse cx="984.0" cy="217.2" rx="20.0" ry="19.2"/><ellipse cx="1001.6" cy="204.0" rx="20.8" ry="22.8"/><ellipse cx="1017.6" cy="217.2" rx="20.8" ry="19.2"/></g><rect x="984.0" y="213.0" width="33.6" height="24.0" fill="#FFE6E0"/><ellipse cx="1000.0" cy="213.0" rx="24.0" ry="9.0" fill="#FFE6E0"/><path d="M861,292 L867.3,299.2 L879,284.8" fill="none" stroke="#1B8A5A" stroke-width="5" stroke-linejoin="round"/><text x="894" y="298" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="17" font-weight="bold" fill="#0B2026" text-anchor="start">Cheap, open storage</text><path d="M861,336 L867.3,343.2 L879,328.8" fill="none" stroke="#1B8A5A" stroke-width="5" stroke-linejoin="round"/><text x="894" y="342" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="17" font-weight="bold" fill="#0B2026" text-anchor="start">Any kind of data</text><path d="M861,380 L867.3,387.2 L879,372.8" fill="none" stroke="#1B8A5A" stroke-width="5" stroke-linejoin="round"/><text x="894" y="386" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="17" font-weight="bold" fill="#0B2026" text-anchor="start">Reliable (ACID) + fast SQL</text><path d="M861,424 L867.3,431.2 L879,416.8" fill="none" stroke="#1B8A5A" stroke-width="5" stroke-linejoin="round"/><text x="894" y="430" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="17" font-weight="bold" fill="#0B2026" text-anchor="start">Great for ML and AI</text><rect x="40" y="495" width="1120" height="70" rx="14" fill="#0B2026"/><text x="600" y="538" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="19" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Databricks is a lakehouse platform: Delta Lake adds the warehouse-style reliability on top of the lake.</text></svg>