t-weight="bold" fill="#FFFFFF" text-anchor="middle">Consume</text><text x="1056" y="226" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="17" font-weight="bold" fill="#0B2026" text-anchor="middle">Put it to use</text><text x="1056" y="306" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="11" font-weight="bold" fill="#D93A25" text-anchor="middle">EXAMPLES</text><text x="1056" y="328" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="15" font-weight="normal" fill="#5F7281" text-anchor="middle">Dashboards, ML, apps</text><rect x="40" y="410" width="1120" height="46" rx="12" fill="#0B2026"/><text x="600" y="440" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="17" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Orchestration: runs the steps in the right order, on schedule, with retries</text><rect x="40" y="470" width="1120" height="46" rx="12" fill="#5F7281"/><text x="600" y="500" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="17" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Data quality &amp; monitoring: catches bad data and broken jobs early</text><rect x="40" y="530" width="1120" height="46" rx="12" fill="#9AA8B4"/><text x="600" y="560" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="17" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Security &amp; governance: who can see what, and where data came from</text></svg>