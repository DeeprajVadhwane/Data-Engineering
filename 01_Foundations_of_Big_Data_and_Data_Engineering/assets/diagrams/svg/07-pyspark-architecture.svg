<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="1200" height="640"><defs><marker id="ah9AA8B4" markerWidth="12" markerHeight="12" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L12,6 L0,12 z" fill="#9AA8B4"/></marker><marker id="ah0B2026" markerWidth="12" markerHeight="12" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L12,6 L0,12 z" fill="#0B2026"/></marker></defs><rect width="1200" height="640" rx="16" fill="#FAF8F5"/><text x="40" y="54" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="30" font-weight="bold" fill="#0B2026" text-anchor="start">How PySpark Works</text><rect x="40" y="64" width="64" height="5" rx="2.5" fill="#FF5F46"/><text x="40" y="98" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="17" font-weight="normal" fill="#5F7281" text-anchor="start">Your Python code is a remote control. The real work runs in the JVM on the cluster.</text><rect x="40" y="150" width="255" height="190" rx="16" fill="#FFFFFF" stroke="#2272B4" stroke-width="3"/><rect x="40" y="150" width="255" height="52" rx="16" fill="#2272B4"/><rect x="40" y="180" width="255" height="22" rx="0" fill="#2272B4"/><circle cx="70" cy="176" r="14" fill="#FFFFFF"/><text x="70" y="182" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="18" font-weight="bold" fill="#FFFFFF" text-anchor="middle">1</text><text x="70" y="182" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="15" font-weight="bold" fill="#2272B4" text-anchor="middle">1</text><text x="190" y="183" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="17" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Your Python code</text><text x="167" y="250" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="16" font-weight="normal" fill="#0B2026" text-anchor="middle">df.filter(...) then</text><text x="167" y="272" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="16" font-weight="normal" fill="#0B2026" text-anchor="middle">.groupBy(...)</text><line x1="297" y1="245" x2="323" y2="245" stroke="#0B2026" stroke-width="3" stroke-linecap="round" marker-end="url(#ah0B2026)"/><rect x="325" y="150" width="255" height="190" rx="16" fill="#FFFFFF" stroke="#6C4FBF" stroke-width="3"/><rect x="325" y="150" width="255" height="52" rx="16" fill="#6C4FBF"/><rect x="325" y="180" width="255" height="22" rx="0" fill="#6C4FBF"/><circle cx="355" cy="176" r="14" fill="#FFFFFF"/><text x="355" y="182" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="18" font-weight="bold" fill="#FFFFFF" text-anchor="middle">2</text><text x="355" y="182" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="15" font-weight="bold" fill="#6C4FBF" text-anchor="middle">2</text><text x="475" y="183" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="17" font-weight="bold" fill="#FFFFFF" text-anchor="middle">PySpark API + Py4J</text><text x="452" y="250" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="16" font-weight="normal" fill="#0B2026" text-anchor="middle">translates calls into</text><text x="452" y="272" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="16" font-weight="normal" fill="#0B2026" text-anchor="middle">JVM calls</text><line x1="582" y1="245" x2="608" y2="245" stroke="#0B2026" stroke-width="3" stroke-linecap="round" marker-end="url(#ah0B2026)"/><rect x="610" y="150" width="255" height="190" rx="16" fill="#FFFFFF" stroke="#FF5F46" stroke-width="3"/><rect x="610" y="150" width="255" height="52" rx="16" fill="#FF5F46"/><rect x="610" y="180" width="255" height="22" rx="0" fill="#FF5F46"/><circle cx="640" cy="176" r="14" fill="#FFFFFF"/><text x="640" y="182" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="18" font-weight="bold" fill="#FFFFFF" text-anchor="middle">3</text><text x="640" y="182" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="15" font-weight="bold" fill="#FF5F46" text-anchor="middle">3</text><text x="760" y="183" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="17" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Spark driver (JVM)</text><text x="737" y="250" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="16" font-weight="normal" fill="#0B2026" text-anchor="middle">optimises plan, builds</text><text x="737" y="272" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="16" font-weight="normal" fill="#0B2026" text-anchor="middle">DAG</text><line x1="867" y1="245" x2="893" y2="245" stroke="#0B2026" stroke-width="3" stroke-linecap="round" marker-end="url(#ah0B2026)"/><rect x="895" y="150" width="255" height="190" rx="16" fill="#FFFFFF" stroke="#1B8A5A" stroke-width="3"/><rect x="895" y="150" width="255" height="52" rx="16" fill="#1B8A5A"/><rect x="895" y="180" width="255" height="22" rx="0" fill="#1B8A5A"/><circle cx="925" cy="176" r="14" fill="#FFFFFF"/><text x="925" y="182" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="18" font-weight="bold" fill="#FFFFFF" text-anchor="middle">4</text><text x="925" y="182" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="15" font-weight="bold" fill="#1B8A5A" text-anchor="middle">4</text><text x="1045" y="183" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="17" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Executors (JVM)</text><text x="1022" y="250" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="16" font-weight="normal" fill="#0B2026" text-anchor="middle">run tasks on partitions</text><text x="167" y="310" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="13" font-weight="bold" fill="#2272B4" text-anchor="middle">runs in Python</text><text x="452" y="310" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="13" font-weight="bold" fill="#6C4FBF" text-anchor="middle">the bridge</text><text x="737" y="310" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="13" font-weight="bold" fill="#FF5F46" text-anchor="middle">runs in the JVM</text><text x="1022" y="310" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="13" font-weight="bold" fill="#1B8A5A" text-anchor="middle">runs in the JVM</text><rect x="780" y="370" width="380" height="90" rx="12" fill="#E8ECEF" stroke="#9AA8B4" stroke-width="2" stroke-dasharray="8 5"/><text x="970" y="402" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="15" font-weight="bold" fill="#0B2026" text-anchor="middle">Python workers (only when needed)</text><text x="970" y="428" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="14" font-weight="normal" fill="#5F7281" text-anchor="middle">used by Python UDFs; data is copied</text><text x="970" y="448" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="14" font-weight="normal" fill="#5F7281" text-anchor="middle">between the JVM and Python</text><line x1="1022" y1="342" x2="1000" y2="366" stroke="#9AA8B4" stroke-width="2.5" stroke-dasharray="6 4" stroke-linecap="round" marker-end="url(#ah9AA8B4)"/><rect x="40" y="370" width="700" height="90" rx="12" fill="#DDF1E7" stroke="#1B8A5A" stroke-width="2"/><text x="60" y="404" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="16" font-weight="bold" fill="#0B2026" text-anchor="start">Built-in DataFrame operations run entirely in the JVM:</text><text x="60" y="430" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="16" font-weight="normal" fill="#0B2026" text-anchor="start">PySpark speed is close to Scala for these. Python only describes the work.</text><rect x="40" y="495" width="1120" height="110" rx="14" fill="#0B2026"/><text x="70" y="535" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="19" font-weight="bold" fill="#FFFFFF" text-anchor="start">Practical rules</text><text x="70" y="565" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="15" font-weight="normal" fill="#C8D6E0" text-anchor="start">Prefer built-in functions over Python UDFs  ·  Avoid collect() on big data  ·  Use pandas UDFs when you need Python logic</text><text x="70" y="590" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="15" font-weight="normal" fill="#C8D6E0" text-anchor="start">Install locally with  pip install pyspark  (needs Java).</text></svg>