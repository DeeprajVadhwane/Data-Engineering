<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="1200" height="640"><defs><marker id="ah0B2026" markerWidth="12" markerHeight="12" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L12,6 L0,12 z" fill="#0B2026"/></marker></defs><rect width="1200" height="640" rx="16" fill="#FAF8F5"/><text x="40" y="54" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="30" font-weight="bold" fill="#0B2026" text-anchor="start">Batch vs Streaming</text><rect x="40" y="64" width="64" height="5" rx="2.5" fill="#FF5F46"/><text x="40" y="98" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="17" font-weight="normal" fill="#5F7281" text-anchor="start">When do you process the data: in chunks on a schedule, or continuously as it arrives?</text><rect x="40" y="120" width="1120" height="215" rx="14" fill="#FFFFFF" stroke="#2272B4" stroke-width="2"/><path d="M40,160 L40,134 Q40,120 54,120 L1146,120 Q1160,120 1160,134 L1160,160 Z" fill="#2272B4"/><text x="600.0" y="145.95" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="17" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Batch: collect first, process later</text><rect x="70" y="180" width="200" height="80" rx="10" fill="#DCEBF7" stroke="#2272B4" stroke-width="2"/><circle cx="88" cy="202" r="6" fill="#2272B4"/><circle cx="115" cy="202" r="6" fill="#2272B4"/><circle cx="142" cy="202" r="6" fill="#2272B4"/><circle cx="169" cy="202" r="6" fill="#2272B4"/><circle cx="196" cy="202" r="6" fill="#2272B4"/><circle cx="223" cy="202" r="6" fill="#2272B4"/><circle cx="250" cy="202" r="6" fill="#2272B4"/><circle cx="88" cy="232" r="6" fill="#2272B4"/><circle cx="115" cy="232" r="6" fill="#2272B4"/><circle cx="142" cy="232" r="6" fill="#2272B4"/><circle cx="169" cy="232" r="6" fill="#2272B4"/><circle cx="196" cy="232" r="6" fill="#2272B4"/><circle cx="223" cy="232" r="6" fill="#2272B4"/><circle cx="250" cy="232" r="6" fill="#2272B4"/><text x="170" y="282" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="14" font-weight="bold" fill="#5F7281" text-anchor="middle">0:00 – 1:00</text><line x1="274" y1="220" x2="306" y2="220" stroke="#0B2026" stroke-width="3" stroke-linecap="round" marker-end="url(#ah0B2026)"/><rect x="310" y="206" width="56" height="28" rx="14.0" fill="#2272B4"/><text x="338.0" y="224.9" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">job</text><rect x="370" y="180" width="200" height="80" rx="10" fill="#DCEBF7" stroke="#2272B4" stroke-width="2"/><circle cx="388" cy="202" r="6" fill="#2272B4"/><circle cx="415" cy="202" r="6" fill="#2272B4"/><circle cx="442" cy="202" r="6" fill="#2272B4"/><circle cx="469" cy="202" r="6" fill="#2272B4"/><circle cx="496" cy="202" r="6" fill="#2272B4"/><circle cx="523" cy="202" r="6" fill="#2272B4"/><circle cx="550" cy="202" r="6" fill="#2272B4"/><circle cx="388" cy="232" r="6" fill="#2272B4"/><circle cx="415" cy="232" r="6" fill="#2272B4"/><circle cx="442" cy="232" r="6" fill="#2272B4"/><circle cx="469" cy="232" r="6" fill="#2272B4"/><circle cx="496" cy="232" r="6" fill="#2272B4"/><circle cx="523" cy="232" r="6" fill="#2272B4"/><circle cx="550" cy="232" r="6" fill="#2272B4"/><text x="470" y="282" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="14" font-weight="bold" fill="#5F7281" text-anchor="middle">1:00 – 2:00</text><line x1="574" y1="220" x2="606" y2="220" stroke="#0B2026" stroke-width="3" stroke-linecap="round" marker-end="url(#ah0B2026)"/><rect x="610" y="206" width="56" height="28" rx="14.0" fill="#2272B4"/><text x="638.0" y="224.9" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">job</text><rect x="670" y="180" width="200" height="80" rx="10" fill="#DCEBF7" stroke="#2272B4" stroke-width="2"/><circle cx="688" cy="202" r="6" fill="#2272B4"/><circle cx="715" cy="202" r="6" fill="#2272B4"/><circle cx="742" cy="202" r="6" fill="#2272B4"/><circle cx="769" cy="202" r="6" fill="#2272B4"/><circle cx="796" cy="202" r="6" fill="#2272B4"/><circle cx="823" cy="202" r="6" fill="#2272B4"/><circle cx="850" cy="202" r="6" fill="#2272B4"/><circle cx="688" cy="232" r="6" fill="#2272B4"/><circle cx="715" cy="232" r="6" fill="#2272B4"/><circle cx="742" cy="232" r="6" fill="#2272B4"/><circle cx="769" cy="232" r="6" fill="#2272B4"/><circle cx="796" cy="232" r="6" fill="#2272B4"/><circle cx="823" cy="232" r="6" fill="#2272B4"/><circle cx="850" cy="232" r="6" fill="#2272B4"/><text x="770" y="282" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="14" font-weight="bold" fill="#5F7281" text-anchor="middle">2:00 – 3:00</text><line x1="874" y1="220" x2="906" y2="220" stroke="#0B2026" stroke-width="3" stroke-linecap="round" marker-end="url(#ah0B2026)"/><rect x="910" y="206" width="56" height="28" rx="14.0" fill="#2272B4"/><text x="938.0" y="224.9" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">job</text><text x="700" y="312" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="16" font-weight="bold" fill="#0B2026" text-anchor="middle">Latency: minutes to hours.  Example: the nightly sales report.</text><rect x="40" y="355" width="1120" height="215" rx="14" fill="#FFFFFF" stroke="#FF5F46" stroke-width="2"/><path d="M40,395 L40,369 Q40,355 54,355 L1146,355 Q1160,355 1160,369 L1160,395 Z" fill="#FF5F46"/><text x="600.0" y="380.95" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="17" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Streaming: process each event as it arrives</text><rect x="70" y="435" width="1060" height="60" rx="30" fill="#FFE6E0" stroke="#FF5F46" stroke-width="2"/><circle cx="90" cy="465" r="7" fill="#FF5F46"/><circle cx="118" cy="465" r="7" fill="#FF5F46"/><circle cx="146" cy="465" r="7" fill="#FF5F46"/><circle cx="174" cy="465" r="7" fill="#FF5F46"/><circle cx="202" cy="465" r="7" fill="#FF5F46"/><circle cx="230" cy="465" r="7" fill="#FF5F46"/><circle cx="258" cy="465" r="7" fill="#FF5F46"/><circle cx="286" cy="465" r="7" fill="#FF5F46"/><circle cx="314" cy="465" r="7" fill="#FF5F46"/><circle cx="342" cy="465" r="7" fill="#FF5F46"/><circle cx="370" cy="465" r="7" fill="#FF5F46"/><circle cx="398" cy="465" r="7" fill="#FF5F46"/><circle cx="426" cy="465" r="7" fill="#FF5F46"/><circle cx="454" cy="465" r="7" fill="#FF5F46"/><circle cx="482" cy="465" r="7" fill="#FF5F46"/><circle cx="510" cy="465" r="7" fill="#FF5F46"/><circle cx="538" cy="465" r="7" fill="#FF5F46"/><circle cx="566" cy="465" r="7" fill="#FF5F46"/><rect x="700" y="425" width="150" height="80" rx="12" fill="#FF5F46"/><text x="775" y="470" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="17" font-weight="bold" fill="#FFFFFF" text-anchor="middle">process</text><line x1="860" y1="465" x2="905" y2="465" stroke="#0B2026" stroke-width="2.5" stroke-linecap="round" marker-end="url(#ah0B2026)"/><line x1="914" y1="465" x2="959" y2="465" stroke="#0B2026" stroke-width="2.5" stroke-linecap="round" marker-end="url(#ah0B2026)"/><line x1="968" y1="465" x2="1013" y2="465" stroke="#0B2026" stroke-width="2.5" stroke-linecap="round" marker-end="url(#ah0B2026)"/><line x1="1022" y1="465" x2="1067" y2="465" stroke="#0B2026" stroke-width="2.5" stroke-linecap="round" marker-end="url(#ah0B2026)"/><line x1="1076" y1="465" x2="1121" y2="465" stroke="#0B2026" stroke-width="2.5" stroke-linecap="round" marker-end="url(#ah0B2026)"/><text x="600" y="548" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="16" font-weight="bold" fill="#0B2026" text-anchor="middle">Latency: milliseconds to seconds.  Example: card-fraud detection.</text><rect x="40" y="585" width="1120" height="40" rx="12" fill="#0B2026"/><text x="600" y="612" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="17" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Many platforms use both: streaming for what is urgent, batch for what is big.</text></svg>