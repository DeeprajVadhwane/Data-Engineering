<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" width="1200" height="720"><defs></defs><rect width="1200" height="720" rx="16" fill="#FAF8F5"/><text x="40" y="54" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="30" font-weight="bold" fill="#0B2026" text-anchor="start">The Data Scale Ladder</text><rect x="40" y="64" width="64" height="5" rx="2.5" fill="#FF5F46"/><text x="40" y="98" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="17" font-weight="normal" fill="#5F7281" text-anchor="start">A rough guide to where each class of tool starts to struggle.</text><rect x="60" y="530" width="160" height="70" rx="10" fill="#9AA8B4"/><text x="140" y="572" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="30" font-weight="bold" fill="#FFFFFF" text-anchor="middle">KB</text><text x="140" y="632" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="15" font-weight="normal" fill="#0B2026" text-anchor="middle">an email</text><rect x="245" y="482" width="160" height="118" rx="10" fill="#9AA8B4"/><text x="325" y="524" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="30" font-weight="bold" fill="#FFFFFF" text-anchor="middle">MB</text><text x="325" y="632" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="15" font-weight="normal" fill="#0B2026" text-anchor="middle">a photo or song</text><rect x="430" y="434" width="160" height="166" rx="10" fill="#2272B4"/><text x="510" y="476" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="30" font-weight="bold" fill="#FFFFFF" text-anchor="middle">GB</text><text x="510" y="632" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="15" font-weight="normal" fill="#0B2026" text-anchor="middle">a feature film</text><rect x="615" y="386" width="160" height="214" rx="10" fill="#2272B4"/><text x="695" y="428" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="30" font-weight="bold" fill="#FFFFFF" text-anchor="middle">TB</text><text x="695" y="632" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="15" font-weight="normal" fill="#0B2026" text-anchor="middle">100,000s of photos</text><rect x="800" y="338" width="160" height="262" rx="10" fill="#FF5F46"/><text x="880" y="380" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="30" font-weight="bold" fill="#FFFFFF" text-anchor="middle">PB</text><text x="880" y="632" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="15" font-weight="normal" fill="#0B2026" text-anchor="middle">1,000 TB: large platforms</text><rect x="985" y="290" width="160" height="310" rx="10" fill="#FF5F46"/><text x="1065" y="332" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="30" font-weight="bold" fill="#FFFFFF" text-anchor="middle">EB</text><text x="1065" y="632" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="15" font-weight="normal" fill="#0B2026" text-anchor="middle">global internet services</text><rect x="60" y="128" width="345" height="34" rx="17" fill="#1B8A5A"/><text x="232" y="151" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="15" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Spreadsheet: up to ~1M rows</text><rect x="245" y="172" width="530" height="34" rx="17" fill="#2272B4"/><text x="510" y="195" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="15" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Single-server database: MBs to low TBs</text><rect x="615" y="216" width="545" height="34" rx="17" fill="#FF5F46"/><text x="887" y="239" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="15" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Distributed systems: TBs to PBs and beyond</text><text x="600" y="680" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="19" font-weight="bold" fill="#0B2026" text-anchor="middle">Our scenario, 100 GB a day, is about 36 TB a year: firmly in distributed territory.</text></svg>