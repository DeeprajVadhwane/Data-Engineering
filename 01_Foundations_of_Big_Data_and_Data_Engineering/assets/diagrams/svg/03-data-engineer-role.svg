<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="1200" height="640"><defs><marker id="ah5F7281" markerWidth="12" markerHeight="12" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L12,6 L0,12 z" fill="#5F7281"/></marker><marker id="ah2272B4" markerWidth="12" markerHeight="12" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L12,6 L0,12 z" fill="#2272B4"/></marker></defs><rect width="1200" height="640" rx="16" fill="#FAF8F5"/><text x="40" y="54" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="30" font-weight="bold" fill="#0B2026" text-anchor="start">What a Data Engineer Does</text><rect x="40" y="64" width="64" height="5" rx="2.5" fill="#FF5F46"/><text x="40" y="98" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="17" font-weight="normal" fill="#5F7281" text-anchor="start">Builds and runs the data highway between raw sources and the people who use data.</text><text x="40" y="150" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="14" font-weight="bold" fill="#5F7281" text-anchor="start">SOURCES</text><rect x="40" y="166" width="190" height="44" rx="22.0" fill="#E8ECEF" stroke="#9AA8B4" stroke-width="1.5"/><text x="135.0" y="193.6" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="16" font-weight="bold" fill="#0B2026" text-anchor="middle">Apps &amp; websites</text><line x1="234" y1="188" x2="300" y2="300" stroke="#5F7281" stroke-width="2" stroke-linecap="round" marker-end="url(#ah5F7281)"/><rect x="40" y="228" width="190" height="44" rx="22.0" fill="#E8ECEF" stroke="#9AA8B4" stroke-width="1.5"/><text x="135.0" y="255.6" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="16" font-weight="bold" fill="#0B2026" text-anchor="middle">Databases</text><line x1="234" y1="250" x2="300" y2="300" stroke="#5F7281" stroke-width="2" stroke-linecap="round" marker-end="url(#ah5F7281)"/><rect x="40" y="290" width="190" height="44" rx="22.0" fill="#E8ECEF" stroke="#9AA8B4" stroke-width="1.5"/><text x="135.0" y="317.6" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="16" font-weight="bold" fill="#0B2026" text-anchor="middle">IoT sensors</text><line x1="234" y1="312" x2="300" y2="300" stroke="#5F7281" stroke-width="2" stroke-linecap="round" marker-end="url(#ah5F7281)"/><rect x="40" y="352" width="190" height="44" rx="22.0" fill="#E8ECEF" stroke="#9AA8B4" stroke-width="1.5"/><text x="135.0" y="379.6" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="16" font-weight="bold" fill="#0B2026" text-anchor="middle">Logs &amp; events</text><line x1="234" y1="374" x2="300" y2="300" stroke="#5F7281" stroke-width="2" stroke-linecap="round" marker-end="url(#ah5F7281)"/><rect x="40" y="414" width="190" height="44" rx="22.0" fill="#E8ECEF" stroke="#9AA8B4" stroke-width="1.5"/><text x="135.0" y="441.6" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="16" font-weight="bold" fill="#0B2026" text-anchor="middle">SaaS tools</text><line x1="234" y1="436" x2="300" y2="300" stroke="#5F7281" stroke-width="2" stroke-linecap="round" marker-end="url(#ah5F7281)"/><rect x="300" y="130" width="600" height="330" rx="18" fill="#DCEBF7" stroke="#2272B4" stroke-width="3"/><text x="600" y="166" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="15" font-weight="bold" fill="#2272B4" text-anchor="middle">THE DATA ENGINEER BUILDS AND RUNS</text><rect x="322" y="210" width="124" height="120" rx="12" fill="#FFFFFF" stroke="#2272B4" stroke-width="2.5"/><circle cx="384" cy="240" r="15" fill="#2272B4"/><text x="384" y="246" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="18" font-weight="bold" fill="#FFFFFF" text-anchor="middle">1</text><text x="384" y="285" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="18" font-weight="bold" fill="#0B2026" text-anchor="middle">Ingest</text><text x="384" y="308" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="13" font-weight="normal" fill="#5F7281" text-anchor="middle">collect</text><line x1="448" y1="270" x2="464" y2="270" stroke="#2272B4" stroke-width="3" stroke-linecap="round" marker-end="url(#ah2272B4)"/><rect x="466" y="210" width="124" height="120" rx="12" fill="#FFFFFF" stroke="#2272B4" stroke-width="2.5"/><circle cx="528" cy="240" r="15" fill="#2272B4"/><text x="528" y="246" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="18" font-weight="bold" fill="#FFFFFF" text-anchor="middle">2</text><text x="528" y="285" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="18" font-weight="bold" fill="#0B2026" text-anchor="middle">Clean</text><text x="528" y="308" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="13" font-weight="normal" fill="#5F7281" text-anchor="middle">fix &amp; validate</text><line x1="592" y1="270" x2="608" y2="270" stroke="#2272B4" stroke-width="3" stroke-linecap="round" marker-end="url(#ah2272B4)"/><rect x="610" y="210" width="124" height="120" rx="12" fill="#FFFFFF" stroke="#2272B4" stroke-width="2.5"/><circle cx="672" cy="240" r="15" fill="#2272B4"/><text x="672" y="246" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="18" font-weight="bold" fill="#FFFFFF" text-anchor="middle">3</text><text x="672" y="285" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="18" font-weight="bold" fill="#0B2026" text-anchor="middle">Transform</text><text x="672" y="308" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="13" font-weight="normal" fill="#5F7281" text-anchor="middle">join &amp; shape</text><line x1="736" y1="270" x2="752" y2="270" stroke="#2272B4" stroke-width="3" stroke-linecap="round" marker-end="url(#ah2272B4)"/><rect x="754" y="210" width="124" height="120" rx="12" fill="#FFFFFF" stroke="#2272B4" stroke-width="2.5"/><circle cx="816" cy="240" r="15" fill="#2272B4"/><text x="816" y="246" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="18" font-weight="bold" fill="#FFFFFF" text-anchor="middle">4</text><text x="816" y="285" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="18" font-weight="bold" fill="#0B2026" text-anchor="middle">Store</text><text x="816" y="308" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="13" font-weight="normal" fill="#5F7281" text-anchor="middle">organise &amp; secure</text><rect x="322" y="360" width="556" height="80" rx="10" fill="#FFFFFF" stroke="#E8ECEF" stroke-width="1.5"/><text x="600" y="390" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="15" font-weight="normal" fill="#0B2026" text-anchor="middle">Reliable  ·  Scalable  ·  Automated  ·  Monitored</text><text x="600" y="414" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="15" font-weight="normal" fill="#0B2026" text-anchor="middle">Pipelines that run every day without anyone babysitting them</text><text x="1000" y="150" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="14" font-weight="bold" fill="#5F7281" text-anchor="start">CONSUMERS</text><rect x="970" y="166" width="190" height="44" rx="22.0" fill="#E8ECEF" stroke="#9AA8B4" stroke-width="1.5"/><text x="1065.0" y="193.6" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="16" font-weight="bold" fill="#0B2026" text-anchor="middle">Data analysts</text><line x1="900" y1="300" x2="966" y2="188" stroke="#5F7281" stroke-width="2" stroke-linecap="round" marker-end="url(#ah5F7281)"/><rect x="970" y="228" width="190" height="44" rx="22.0" fill="#E8ECEF" stroke="#9AA8B4" stroke-width="1.5"/><text x="1065.0" y="255.6" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="16" font-weight="bold" fill="#0B2026" text-anchor="middle">Data scientists</text><line x1="900" y1="300" x2="966" y2="250" stroke="#5F7281" stroke-width="2" stroke-linecap="round" marker-end="url(#ah5F7281)"/><rect x="970" y="290" width="190" height="44" rx="22.0" fill="#E8ECEF" stroke="#9AA8B4" stroke-width="1.5"/><text x="1065.0" y="317.6" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="16" font-weight="bold" fill="#0B2026" text-anchor="middle">Dashboards</text><line x1="900" y1="300" x2="966" y2="312" stroke="#5F7281" stroke-width="2" stroke-linecap="round" marker-end="url(#ah5F7281)"/><rect x="970" y="352" width="190" height="44" rx="22.0" fill="#E8ECEF" stroke="#9AA8B4" stroke-width="1.5"/><text x="1065.0" y="379.6" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="16" font-weight="bold" fill="#0B2026" text-anchor="middle">ML models</text><line x1="900" y1="300" x2="966" y2="374" stroke="#5F7281" stroke-width="2" stroke-linecap="round" marker-end="url(#ah5F7281)"/><rect x="40" y="500" width="1120" height="110" rx="14" fill="#0B2026"/><text x="70" y="540" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="18" font-weight="bold" fill="#FF9E8E" text-anchor="start">Without data engineering:</text><text x="70" y="566" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="17" font-weight="normal" fill="#FFFFFF" text-anchor="start">data is scattered, late, duplicated and untrusted.</text><text x="640" y="540" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="18" font-weight="bold" fill="#7CD6A5" text-anchor="start">With data engineering:</text><text x="640" y="566" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="17" font-weight="normal" fill="#FFFFFF" text-anchor="start">data is reliable, available and fast, so others can do their jobs.</text></svg>