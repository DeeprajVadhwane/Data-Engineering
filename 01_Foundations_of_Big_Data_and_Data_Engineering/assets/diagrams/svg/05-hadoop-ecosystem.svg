<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700"><defs></defs><rect width="1200" height="700" rx="16" fill="#FAF8F5"/><text x="40" y="54" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="30" font-weight="bold" fill="#0B2026" text-anchor="start">The Hadoop Ecosystem</text><rect x="40" y="64" width="64" height="5" rx="2.5" fill="#FF5F46"/><text x="40" y="98" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="17" font-weight="normal" fill="#5F7281" text-anchor="start">Three core components, plus a family of tools built on top.</text><rect x="40" y="540" width="760" height="90" rx="14" fill="#2272B4"/><text x="420" y="578" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="28" font-weight="bold" fill="#FFFFFF" text-anchor="middle">HDFS</text><text x="420" y="608" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="16" font-weight="normal" fill="#DCEBF7" text-anchor="middle">storage: distributed, replicated file system</text><rect x="40" y="440" width="760" height="84" rx="14" fill="#1B8A5A"/><text x="420" y="476" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="28" font-weight="bold" fill="#FFFFFF" text-anchor="middle">YARN</text><text x="420" y="504" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="16" font-weight="normal" fill="#DDF1E7" text-anchor="middle">resource management: decides which machine runs which task</text><rect x="40" y="340" width="244" height="84" rx="14" fill="#FF5F46"/><text x="162" y="376" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="22" font-weight="bold" fill="#FFFFFF" text-anchor="middle">MapReduce</text><text x="162" y="402" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="14" font-weight="normal" fill="#FFF1EE" text-anchor="middle">batch processing</text><rect x="298" y="340" width="244" height="84" rx="14" fill="#D93A25"/><text x="420" y="376" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="22" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Spark</text><text x="420" y="402" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="14" font-weight="normal" fill="#FFF1EE" text-anchor="middle">fast in-memory processing</text><rect x="556" y="340" width="244" height="84" rx="14" fill="#FF5F46"/><text x="678" y="376" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="22" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Tez</text><text x="678" y="402" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="14" font-weight="normal" fill="#FFF1EE" text-anchor="middle">optimised batch DAGs</text><rect x="40" y="230" width="244" height="90" rx="14" fill="#6C4FBF"/><text x="162" y="268" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="22" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Hive</text><text x="162" y="296" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="14" font-weight="normal" fill="#E8E0FA" text-anchor="middle">SQL on Hadoop</text><rect x="298" y="230" width="244" height="90" rx="14" fill="#6C4FBF"/><text x="420" y="268" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="22" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Pig</text><text x="420" y="296" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="14" font-weight="normal" fill="#E8E0FA" text-anchor="middle">dataflow scripts</text><rect x="556" y="230" width="244" height="90" rx="14" fill="#6C4FBF"/><text x="678" y="268" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="22" font-weight="bold" fill="#FFFFFF" text-anchor="middle">HBase</text><text x="678" y="296" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="14" font-weight="normal" fill="#E8E0FA" text-anchor="middle">NoSQL on HDFS</text><text x="40" y="214" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="13" font-weight="bold" fill="#6C4FBF" text-anchor="start">TOOLS FOR USERS</text><text x="40" y="328" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="1" font-weight="normal" fill="#1B3139" text-anchor="start"></text><rect x="850" y="130" width="310" height="500" rx="16" fill="#FFFFFF" stroke="#5F7281" stroke-width="2.5"/><text x="1005" y="164" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="19" font-weight="bold" fill="#0B2026" text-anchor="middle">Around the stack</text><rect x="870" y="190" width="270" height="70" rx="12" fill="#E8ECEF"/><text x="1005" y="220" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="18" font-weight="bold" fill="#0B2026" text-anchor="middle">Sqoop</text><text x="1005" y="244" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="14" font-weight="normal" fill="#5F7281" text-anchor="middle">import from SQL databases</text><rect x="870" y="276" width="270" height="70" rx="12" fill="#E8ECEF"/><text x="1005" y="306" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="18" font-weight="bold" fill="#0B2026" text-anchor="middle">Flume / Kafka</text><text x="1005" y="330" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="14" font-weight="normal" fill="#5F7281" text-anchor="middle">ingest logs and streams</text><rect x="870" y="362" width="270" height="70" rx="12" fill="#E8ECEF"/><text x="1005" y="392" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="18" font-weight="bold" fill="#0B2026" text-anchor="middle">Oozie</text><text x="1005" y="416" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="14" font-weight="normal" fill="#5F7281" text-anchor="middle">schedule workflows</text><rect x="870" y="448" width="270" height="70" rx="12" fill="#E8ECEF"/><text x="1005" y="478" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="18" font-weight="bold" fill="#0B2026" text-anchor="middle">ZooKeeper</text><text x="1005" y="502" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="14" font-weight="normal" fill="#5F7281" text-anchor="middle">coordinate the cluster</text><rect x="870" y="534" width="270" height="70" rx="12" fill="#E8ECEF"/><text x="1005" y="564" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="18" font-weight="bold" fill="#0B2026" text-anchor="middle">Ranger / Kerberos</text><text x="1005" y="588" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="14" font-weight="normal" fill="#5F7281" text-anchor="middle">security</text><text x="40" y="150" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="16" font-weight="bold" fill="#0B2026" text-anchor="start">Spark can run on YARN and read from HDFS:</text><text x="40" y="174" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="16" font-weight="normal" fill="#0B2026" text-anchor="start">the ecosystem is a toolbox, not a single product.</text></svg>