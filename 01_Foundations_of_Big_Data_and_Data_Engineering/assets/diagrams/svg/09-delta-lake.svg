<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600"><defs></defs><rect width="1200" height="600" rx="16" fill="#FAF8F5"/><text x="40" y="54" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="30" font-weight="bold" fill="#0B2026" text-anchor="start">Delta Lake: Parquet Files + a Transaction Log</text><rect x="40" y="64" width="64" height="5" rx="2.5" fill="#FF5F46"/><text x="40" y="98" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="17" font-weight="normal" fill="#5F7281" text-anchor="start">A Delta table is just a folder. The _delta_log makes it reliable.</text><rect x="40" y="130" width="480" height="250" rx="14" fill="#FFFFFF" stroke="#5F7281" stroke-width="2"/><path d="M40,170 L40,144 Q40,130 54,130 L506,130 Q520,130 520,144 L520,170 Z" fill="#5F7281"/><text x="280.0" y="156.3" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="18" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Plain Parquet files</text><rect x="70" y="190" width="190" height="56" rx="8" fill="#E8ECEF" stroke="#5F7281" stroke-width="2"/><text x="165" y="224" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="15" font-weight="normal" fill="#0B2026" text-anchor="middle">part-00000.parquet</text><rect x="280" y="190" width="190" height="56" rx="8" fill="#E8ECEF" stroke="#5F7281" stroke-width="2"/><text x="375" y="224" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="15" font-weight="normal" fill="#0B2026" text-anchor="middle">part-00001.parquet</text><rect x="70" y="270" width="190" height="56" rx="8" fill="#E8ECEF" stroke="#5F7281" stroke-width="2"/><text x="165" y="304" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="15" font-weight="normal" fill="#0B2026" text-anchor="middle">part-00002.parquet</text><rect x="280" y="270" width="190" height="56" rx="8" fill="#E8ECEF" stroke="#5F7281" stroke-width="2"/><text x="375" y="304" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="15" font-weight="normal" fill="#0B2026" text-anchor="middle">part-00003.parquet</text><text x="280" y="365" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="16" font-weight="bold" fill="#5F7281" text-anchor="middle">Just files. No guarantees.</text><text x="560" y="262" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="50" font-weight="bold" fill="#0B2026" text-anchor="middle">+</text><rect x="600" y="130" width="560" height="250" rx="14" fill="#FFFFFF" stroke="#FF5F46" stroke-width="2"/><path d="M600,170 L600,144 Q600,130 614,130 L1146,130 Q1160,130 1160,144 L1160,170 Z" fill="#FF5F46"/><text x="880.0" y="156.3" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="18" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Delta table (a folder)</text><rect x="625" y="190" width="210" height="52" rx="8" fill="#E8ECEF" stroke="#5F7281" stroke-width="2"/><text x="730" y="222" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="15" font-weight="normal" fill="#0B2026" text-anchor="middle">part-00000.parquet</text><rect x="625" y="256" width="210" height="52" rx="8" fill="#E8ECEF" stroke="#5F7281" stroke-width="2"/><text x="730" y="288" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="15" font-weight="normal" fill="#0B2026" text-anchor="middle">part-00001.parquet</text><rect x="860" y="190" width="275" height="168" rx="10" fill="#FFE6E0" stroke="#FF5F46" stroke-width="2.5"/><text x="997" y="218" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="18" font-weight="bold" fill="#FF5F46" text-anchor="middle">_delta_log/</text><text x="880" y="252" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="15" font-weight="normal" fill="#0B2026" text-anchor="start">000.json  create table</text><text x="880" y="282" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="15" font-weight="normal" fill="#0B2026" text-anchor="start">001.json  add files</text><text x="880" y="312" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="15" font-weight="normal" fill="#0B2026" text-anchor="start">002.json  update rows</text><text x="997" y="345" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="14" font-weight="bold" fill="#5F7281" text-anchor="middle">every change = a new version</text><text x="40" y="430" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="20" font-weight="bold" fill="#0B2026" text-anchor="start">What the log gives you</text><rect x="40" y="450" width="262" height="120" rx="12" fill="#FFFFFF" stroke="#1B8A5A" stroke-width="2.5"/><rect x="40" y="450" width="262" height="8" rx="4" fill="#1B8A5A"/><text x="171" y="495" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="17" font-weight="bold" fill="#1B8A5A" text-anchor="middle">ACID transactions</text><text x="171" y="525" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="14" font-weight="normal" fill="#0B2026" text-anchor="middle">a failed write never leaves</text><text x="171" y="545" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="14" font-weight="normal" fill="#0B2026" text-anchor="middle">half-written data</text><rect x="322" y="450" width="262" height="120" rx="12" fill="#FFFFFF" stroke="#2272B4" stroke-width="2.5"/><rect x="322" y="450" width="262" height="8" rx="4" fill="#2272B4"/><text x="453" y="495" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="17" font-weight="bold" fill="#2272B4" text-anchor="middle">Time travel</text><text x="453" y="525" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="14" font-weight="normal" fill="#0B2026" text-anchor="middle">query or restore an</text><text x="453" y="545" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="14" font-weight="normal" fill="#0B2026" text-anchor="middle">older version</text><rect x="604" y="450" width="262" height="120" rx="12" fill="#FFFFFF" stroke="#6C4FBF" stroke-width="2.5"/><rect x="604" y="450" width="262" height="8" rx="4" fill="#6C4FBF"/><text x="735" y="495" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="17" font-weight="bold" fill="#6C4FBF" text-anchor="middle">Schema enforcement</text><text x="735" y="525" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="14" font-weight="normal" fill="#0B2026" text-anchor="middle">bad data is rejected</text><text x="735" y="545" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="14" font-weight="normal" fill="#0B2026" text-anchor="middle">before it gets in</text><rect x="886" y="450" width="262" height="120" rx="12" fill="#FFFFFF" stroke="#FF5F46" stroke-width="2.5"/><rect x="886" y="450" width="262" height="8" rx="4" fill="#FF5F46"/><text x="1017" y="495" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="17" font-weight="bold" fill="#FF5F46" text-anchor="middle">MERGE / UPDATE / DELETE</text><text x="1017" y="525" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="14" font-weight="normal" fill="#0B2026" text-anchor="middle">change rows in a</text><text x="1017" y="545" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="14" font-weight="normal" fill="#0B2026" text-anchor="middle">data lake</text></svg>