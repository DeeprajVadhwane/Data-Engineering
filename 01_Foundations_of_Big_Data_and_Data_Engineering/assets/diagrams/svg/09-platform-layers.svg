<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 780" width="1200" height="780"><defs></defs><rect width="1200" height="780" rx="16" fill="#FAF8F5"/><text x="40" y="54" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="30" font-weight="bold" fill="#0B2026" text-anchor="start">The Databricks Platform: One Platform, Every Workload</text><rect x="40" y="64" width="64" height="5" rx="2.5" fill="#FF5F46"/><text x="40" y="98" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="17" font-weight="normal" fill="#5F7281" text-anchor="start">Read it from the bottom up: data first, then governance, then the engine, then what you do with it.</text><text x="40" y="150" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="14" font-weight="bold" fill="#5F7281" text-anchor="start">WHAT YOU DO</text><rect x="40" y="162" width="206" height="100" rx="14" fill="#6C4FBF"/><text x="143" y="208" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="19" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Business</text><text x="143" y="233" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="19" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Intelligence</text><rect x="266" y="162" width="206" height="100" rx="14" fill="#2272B4"/><text x="369" y="208" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="19" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Data</text><text x="369" y="233" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="19" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Warehousing</text><rect x="492" y="162" width="206" height="100" rx="14" fill="#FF5F46"/><text x="595" y="208" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="19" font-weight="bold" fill="#FFFFFF" text-anchor="middle">AI &amp;</text><text x="595" y="233" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="19" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Data Science</text><rect x="718" y="162" width="206" height="100" rx="14" fill="#1B8A5A"/><text x="821" y="208" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="19" font-weight="bold" fill="#FFFFFF" text-anchor="middle">ETL &amp; Real-Time</text><text x="821" y="233" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="19" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Analytics</text><rect x="944" y="162" width="206" height="100" rx="14" fill="#E8A317"/><text x="1047" y="218" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="19" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Orchestration</text><rect x="40" y="282" width="1120" height="92" rx="14" fill="#0B2026"/><text x="600" y="322" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="24" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Data Intelligence Engine</text><text x="600" y="352" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="16" font-weight="normal" fill="#C8D6E0" text-anchor="middle">the compute that runs your code: Spark + Photon, serverless or clusters</text><rect x="40" y="394" width="1120" height="84" rx="14" fill="#D93A25"/><text x="600" y="432" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="24" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Unified Governance  ·  Unity Catalog</text><text x="600" y="460" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="16" font-weight="normal" fill="#FFE0DA" text-anchor="middle">who can see what · where data came from · auditing · discovery</text><rect x="40" y="498" width="1120" height="84" rx="14" fill="#FF5F46"/><text x="600" y="536" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="24" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Unified Data  ·  Delta Lake</text><text x="600" y="564" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="16" font-weight="normal" fill="#FFF1EE" text-anchor="middle">structured + semi-structured + unstructured data, all in one place</text><rect x="40" y="602" width="1120" height="84" rx="14" fill="#DCEBF7" stroke="#2272B4" stroke-width="2.5" stroke-dasharray="10 6"/><text x="600" y="640" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="24" font-weight="bold" fill="#0B2026" text-anchor="middle">Open Data Lake</text><text x="600" y="668" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="16" font-weight="normal" fill="#5F7281" text-anchor="middle">cheap cloud storage (S3, ADLS, GCS) in open formats (Parquet, Delta)</text><rect x="40" y="706" width="1120" height="50" rx="12" fill="#FFF3D6"/><text x="600" y="738" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="17" font-weight="bold" fill="#0B2026" text-anchor="middle">Unified = one platform for every role.   Open = open formats, no lock-in.   At scale = GBs to PBs.</text></svg>