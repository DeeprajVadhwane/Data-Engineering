<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" width="1200" height="620"><defs></defs><rect width="1200" height="620" rx="16" fill="#FAF8F5"/><text x="40" y="54" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="30" font-weight="bold" fill="#0B2026" text-anchor="start">Three Shapes of Data</text><rect x="40" y="64" width="64" height="5" rx="2.5" fill="#FF5F46"/><text x="40" y="98" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="17" font-weight="normal" fill="#5F7281" text-anchor="start">The shape decides how you store it and how you query it.</text><rect x="40" y="120" width="360" height="420" rx="14" fill="#FFFFFF" stroke="#2272B4" stroke-width="2"/><path d="M40,160 L40,134 Q40,120 54,120 L386,120 Q400,120 400,134 L400,160 Z" fill="#2272B4"/><text x="220.0" y="146.3" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="18" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Structured</text><rect x="150" y="180" width="140" height="90" rx="4" fill="#FFFFFF" stroke="#0B2026" stroke-width="2"/><line x1="150" y1="202.5" x2="290" y2="202.5" stroke="#9AA8B4" stroke-width="1.5" stroke-linecap="round"/><line x1="150" y1="225.0" x2="290" y2="225.0" stroke="#9AA8B4" stroke-width="1.5" stroke-linecap="round"/><line x1="150" y1="247.5" x2="290" y2="247.5" stroke="#9AA8B4" stroke-width="1.5" stroke-linecap="round"/><line x1="196.66666666666666" y1="180" x2="196.66666666666666" y2="270" stroke="#9AA8B4" stroke-width="1.5" stroke-linecap="round"/><line x1="243.33333333333331" y1="180" x2="243.33333333333331" y2="270" stroke="#9AA8B4" stroke-width="1.5" stroke-linecap="round"/><rect x="150" y="180" width="140" height="90" rx="4" fill="none" stroke="#0B2026" stroke-width="2"/><text x="173" y="202" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="11" font-weight="bold" fill="#0B2026" text-anchor="middle">id</text><text x="220" y="202" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="11" font-weight="bold" fill="#0B2026" text-anchor="middle">item</text><text x="267" y="202" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="11" font-weight="bold" fill="#0B2026" text-anchor="middle">qty</text><text x="220" y="312" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="16" font-weight="normal" fill="#5F7281" text-anchor="middle">Fixed columns, every row the same</text><text x="220" y="334" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="16" font-weight="normal" fill="#5F7281" text-anchor="middle">shape</text><text x="64" y="372" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="14" font-weight="bold" fill="#2272B4" text-anchor="start">Examples</text><circle cx="72" cy="391" r="4" fill="#2272B4"/><text x="86" y="396" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="17" font-weight="normal" fill="#0B2026" text-anchor="start">Sales table</text><circle cx="72" cy="419" r="4" fill="#2272B4"/><text x="86" y="424" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="17" font-weight="normal" fill="#0B2026" text-anchor="start">Bank transactions</text><circle cx="72" cy="447" r="4" fill="#2272B4"/><text x="86" y="452" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="17" font-weight="normal" fill="#0B2026" text-anchor="start">Customer records</text><rect x="60" y="486" width="320" height="38" rx="10" fill="#E8ECEF"/><text x="220" y="511" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="15" font-weight="bold" fill="#0B2026" text-anchor="middle">SQL works directly</text><rect x="420" y="120" width="360" height="420" rx="14" fill="#FFFFFF" stroke="#1B8A5A" stroke-width="2"/><path d="M420,160 L420,134 Q420,120 434,120 L766,120 Q780,120 780,134 L780,160 Z" fill="#1B8A5A"/><text x="600.0" y="146.3" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="18" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Semi-structured</text><rect x="490" y="176" width="220" height="100" rx="8" fill="#0B2026"/><text x="504" y="202" font-family="'DejaVu Sans Mono', 'Courier New', monospace" font-size="14" font-weight="bold" xml:space="preserve" fill="#FFFFFF"><tspan fill="#FFFFFF">{ </tspan><tspan fill="#7CD6A5">"user"</tspan><tspan fill="#FFFFFF">: 42,</tspan></text><text x="504" y="226" font-family="'DejaVu Sans Mono', 'Courier New', monospace" font-size="14" font-weight="bold" xml:space="preserve" fill="#FFFFFF"><tspan fill="#7CD6A5">  "event"</tspan><tspan fill="#FFFFFF">: "click",</tspan></text><text x="504" y="250" font-family="'DejaVu Sans Mono', 'Courier New', monospace" font-size="14" font-weight="bold" xml:space="preserve" fill="#FFFFFF"><tspan fill="#7CD6A5">  "tags"</tspan><tspan fill="#FFFFFF">: ["new"] }</tspan></text><text x="600" y="312" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="16" font-weight="normal" fill="#5F7281" text-anchor="middle">Has structure, but flexible and</text><text x="600" y="334" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="16" font-weight="normal" fill="#5F7281" text-anchor="middle">nested</text><text x="444" y="372" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="14" font-weight="bold" fill="#1B8A5A" text-anchor="start">Examples</text><circle cx="452" cy="391" r="4" fill="#1B8A5A"/><text x="466" y="396" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="17" font-weight="normal" fill="#0B2026" text-anchor="start">JSON events</text><circle cx="452" cy="419" r="4" fill="#1B8A5A"/><text x="466" y="424" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="17" font-weight="normal" fill="#0B2026" text-anchor="start">XML, logs</text><circle cx="452" cy="447" r="4" fill="#1B8A5A"/><text x="466" y="452" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="17" font-weight="normal" fill="#0B2026" text-anchor="start">API responses</text><rect x="440" y="486" width="320" height="38" rx="10" fill="#E8ECEF"/><text x="600" y="511" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="15" font-weight="bold" fill="#0B2026" text-anchor="middle">Parse, then SQL / DataFrames</text><rect x="800" y="120" width="360" height="420" rx="14" fill="#FFFFFF" stroke="#FF5F46" stroke-width="2"/><path d="M800,160 L800,134 Q800,120 814,120 L1146,120 Q1160,120 1160,134 L1160,160 Z" fill="#FF5F46"/><text x="980.0" y="146.3" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="18" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Unstructured</text><rect x="870" y="190" width="90" height="66" rx="6" fill="#DCEBF7" stroke="#0B2026" stroke-width="2.5"/><circle cx="937.5" cy="209.8" r="7.26" fill="#E8A317"/><path d="M874,252 L901.5,213.1 L924.0,236.2 L937.5,226.3 L956,252 Z" fill="#1B8A5A" stroke-linejoin="round"/><path d="M990,182 L1040,182 L1054,196 L1054,262 L990,262 Z" fill="#FFFFFF" stroke="#0B2026" stroke-width="2.5" stroke-linejoin="round"/><path d="M1040,182 L1040,196 L1054,196" fill="none" stroke="#0B2026" stroke-width="2" stroke-linejoin="round"/><line x1="999" y1="208" x2="1045" y2="208" stroke="#2272B4" stroke-width="3" stroke-linecap="round"/><line x1="999" y1="217" x2="1045" y2="217" stroke="#2272B4" stroke-width="3" stroke-linecap="round"/><line x1="999" y1="226" x2="1045" y2="226" stroke="#2272B4" stroke-width="3" stroke-linecap="round"/><line x1="999" y1="235" x2="1045" y2="235" stroke="#2272B4" stroke-width="3" stroke-linecap="round"/><text x="980" y="312" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="16" font-weight="normal" fill="#5F7281" text-anchor="middle">No predefined structure</text><text x="824" y="372" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="14" font-weight="bold" fill="#FF5F46" text-anchor="start">Examples</text><circle cx="832" cy="391" r="4" fill="#FF5F46"/><text x="846" y="396" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="17" font-weight="normal" fill="#0B2026" text-anchor="start">Images, video, audio</text><circle cx="832" cy="419" r="4" fill="#FF5F46"/><text x="846" y="424" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="17" font-weight="normal" fill="#0B2026" text-anchor="start">PDFs, emails</text><circle cx="832" cy="447" r="4" fill="#FF5F46"/><text x="846" y="452" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="17" font-weight="normal" fill="#0B2026" text-anchor="start">Free text</text><rect x="820" y="486" width="320" height="38" rx="10" fill="#E8ECEF"/><text x="980" y="511" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="15" font-weight="bold" fill="#0B2026" text-anchor="middle">Needs ML or text processing</text><text x="600" y="580" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="19" font-weight="bold" fill="#0B2026" text-anchor="middle">Big data platforms must handle all three, often in the same pipeline.</text></svg>