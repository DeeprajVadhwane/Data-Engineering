<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="1200" height="520"><defs><marker id="ah0B2026" markerWidth="12" markerHeight="12" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L12,6 L0,12 z" fill="#0B2026"/></marker></defs><rect width="1200" height="520" rx="16" fill="#FAF8F5"/><text x="40" y="54" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="30" font-weight="bold" fill="#0B2026" text-anchor="start">From raw feed to trusted tables</text><rect x="40" y="64" width="64" height="5" rx="2.5" fill="#FF5F46"/><text x="40" y="98" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="17" font-weight="normal" fill="#5F7281" text-anchor="start">Standardise, deduplicate, validate, and never lose a row silently</text><rect x="40" y="170" width="190" height="110" rx="12" fill="#FFE6E0" stroke="#FF5F46" stroke-width="2"/><text x="135.0" y="219.05" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="17" font-weight="bold" fill="#1B3139" text-anchor="middle">raw_orders_stage</text><text x="135.0" y="242.0" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="17" font-weight="normal" fill="#1B3139" text-anchor="middle">10 messy rows</text><line x1="235" y1="225" x2="285" y2="225" stroke="#0B2026" stroke-width="3" stroke-linecap="round" marker-end="url(#ah0B2026)"/><rect x="290" y="190" width="170" height="70" rx="12" fill="#DCEBF7" stroke="#2272B4" stroke-width="2"/><text x="375.0" y="230.94" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="18" font-weight="bold" fill="#1B3139" text-anchor="middle">Standardise</text><line x1="450" y1="225" x2="500" y2="225" stroke="#0B2026" stroke-width="3" stroke-linecap="round" marker-end="url(#ah0B2026)"/><rect x="505" y="190" width="170" height="70" rx="12" fill="#DCEBF7" stroke="#2272B4" stroke-width="2"/><text x="590.0" y="230.94" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="18" font-weight="bold" fill="#1B3139" text-anchor="middle">Deduplicate</text><line x1="665" y1="225" x2="715" y2="225" stroke="#0B2026" stroke-width="3" stroke-linecap="round" marker-end="url(#ah0B2026)"/><rect x="720" y="190" width="170" height="70" rx="12" fill="#DCEBF7" stroke="#2272B4" stroke-width="2"/><text x="805.0" y="230.94" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="18" font-weight="bold" fill="#1B3139" text-anchor="middle">Validate</text><line x1="895" y1="225" x2="945" y2="225" stroke="#0B2026" stroke-width="3" stroke-linecap="round" marker-end="url(#ah0B2026)"/><rect x="950" y="140" width="210" height="80" rx="12" fill="#DDF1E7" stroke="#1B8A5A" stroke-width="2"/><text x="1055.0" y="185.94" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="18" font-weight="bold" fill="#1B3139" text-anchor="middle">orders_clean</text><rect x="950" y="260" width="210" height="80" rx="12" fill="#FFE6E0" stroke="#D93A25" stroke-width="2"/><text x="1055.0" y="294.05" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="17" font-weight="bold" fill="#1B3139" text-anchor="middle">orders_rejected</text><text x="1055.0" y="317.0" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="17" font-weight="normal" fill="#1B3139" text-anchor="middle">with a reason</text><line x1="895" y1="225" x2="935" y2="180" stroke="#0B2026" stroke-width="3" stroke-linecap="round"/><line x1="895" y1="225" x2="935" y2="300" stroke="#0B2026" stroke-width="3" stroke-linecap="round"/><rect x="40" y="390" width="1120" height="100" rx="14" fill="#FFF3D6" stroke="#E8A317" stroke-width="2"/><path d="M40,424 L40,404 Q40,390 54,390 L1146,390 Q1160,390 1160,404 L1160,424 Z" fill="#E8A317"/><text x="600.0" y="412.95" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="17" font-weight="bold" fill="#0B2026" text-anchor="middle">Quality gate</text><text x="60" y="465" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="16" font-weight="normal" fill="#1B3139" text-anchor="start">Checks return violation counts (zero = pass). Raw = clean + rejected. Any failure stops the run.</text></svg>