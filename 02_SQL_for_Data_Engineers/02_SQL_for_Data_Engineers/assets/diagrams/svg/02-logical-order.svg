<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="1200" height="560"><defs><marker id="ah0B2026" markerWidth="12" markerHeight="12" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L12,6 L0,12 z" fill="#0B2026"/></marker></defs><rect width="1200" height="560" rx="16" fill="#FAF8F5"/><text x="40" y="54" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="30" font-weight="bold" fill="#0B2026" text-anchor="start">Logical order of a query</text><rect x="40" y="64" width="64" height="5" rx="2.5" fill="#FF5F46"/><text x="40" y="98" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="17" font-weight="normal" fill="#5F7281" text-anchor="start">The order you write is not the order the engine reasons in</text><rect x="60" y="130" width="420" height="42" rx="10" fill="#FFFFFF" stroke="#2272B4" stroke-width="2.5"/><circle cx="84" cy="151" r="14" fill="#2272B4"/><text x="84" y="157" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="18" font-weight="bold" fill="#FFFFFF" text-anchor="middle">1</text><text x="112" y="158" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="18" font-weight="bold" fill="#0B2026" text-anchor="start">FROM / JOIN</text><text x="250" y="158" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="15" font-weight="normal" fill="#5F7281" text-anchor="start">Pick and combine tables</text><line x1="270" y1="173" x2="270" y2="181" stroke="#0B2026" stroke-width="2" stroke-linecap="round" marker-end="url(#ah0B2026)"/><rect x="60" y="182" width="420" height="42" rx="10" fill="#FFFFFF" stroke="#2272B4" stroke-width="2.5"/><circle cx="84" cy="203" r="14" fill="#2272B4"/><text x="84" y="209" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="18" font-weight="bold" fill="#FFFFFF" text-anchor="middle">2</text><text x="112" y="210" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="18" font-weight="bold" fill="#0B2026" text-anchor="start">WHERE</text><text x="250" y="210" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="15" font-weight="normal" fill="#5F7281" text-anchor="start">Filter rows</text><line x1="270" y1="225" x2="270" y2="233" stroke="#0B2026" stroke-width="2" stroke-linecap="round" marker-end="url(#ah0B2026)"/><rect x="60" y="234" width="420" height="42" rx="10" fill="#FFFFFF" stroke="#FF5F46" stroke-width="2.5"/><circle cx="84" cy="255" r="14" fill="#FF5F46"/><text x="84" y="261" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="18" font-weight="bold" fill="#FFFFFF" text-anchor="middle">3</text><text x="112" y="262" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="18" font-weight="bold" fill="#0B2026" text-anchor="start">GROUP BY</text><text x="250" y="262" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="15" font-weight="normal" fill="#5F7281" text-anchor="start">Form groups</text><line x1="270" y1="277" x2="270" y2="285" stroke="#0B2026" stroke-width="2" stroke-linecap="round" marker-end="url(#ah0B2026)"/><rect x="60" y="286" width="420" height="42" rx="10" fill="#FFFFFF" stroke="#FF5F46" stroke-width="2.5"/><circle cx="84" cy="307" r="14" fill="#FF5F46"/><text x="84" y="313" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="18" font-weight="bold" fill="#FFFFFF" text-anchor="middle">4</text><text x="112" y="314" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="18" font-weight="bold" fill="#0B2026" text-anchor="start">HAVING</text><text x="250" y="314" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="15" font-weight="normal" fill="#5F7281" text-anchor="start">Filter groups</text><line x1="270" y1="329" x2="270" y2="337" stroke="#0B2026" stroke-width="2" stroke-linecap="round" marker-end="url(#ah0B2026)"/><rect x="60" y="338" width="420" height="42" rx="10" fill="#FFFFFF" stroke="#1B8A5A" stroke-width="2.5"/><circle cx="84" cy="359" r="14" fill="#1B8A5A"/><text x="84" y="365" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="18" font-weight="bold" fill="#FFFFFF" text-anchor="middle">5</text><text x="112" y="366" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="18" font-weight="bold" fill="#0B2026" text-anchor="start">SELECT</text><text x="250" y="366" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="15" font-weight="normal" fill="#5F7281" text-anchor="start">Compute columns, aliases</text><line x1="270" y1="381" x2="270" y2="389" stroke="#0B2026" stroke-width="2" stroke-linecap="round" marker-end="url(#ah0B2026)"/><rect x="60" y="390" width="420" height="42" rx="10" fill="#FFFFFF" stroke="#1B8A5A" stroke-width="2.5"/><circle cx="84" cy="411" r="14" fill="#1B8A5A"/><text x="84" y="417" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="18" font-weight="bold" fill="#FFFFFF" text-anchor="middle">6</text><text x="112" y="418" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="18" font-weight="bold" fill="#0B2026" text-anchor="start">DISTINCT</text><text x="250" y="418" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="15" font-weight="normal" fill="#5F7281" text-anchor="start">Drop duplicate rows</text><line x1="270" y1="433" x2="270" y2="441" stroke="#0B2026" stroke-width="2" stroke-linecap="round" marker-end="url(#ah0B2026)"/><rect x="60" y="442" width="420" height="42" rx="10" fill="#FFFFFF" stroke="#5F7281" stroke-width="2.5"/><circle cx="84" cy="463" r="14" fill="#5F7281"/><text x="84" y="469" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="18" font-weight="bold" fill="#FFFFFF" text-anchor="middle">7</text><text x="112" y="470" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="18" font-weight="bold" fill="#0B2026" text-anchor="start">ORDER BY</text><text x="250" y="470" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="15" font-weight="normal" fill="#5F7281" text-anchor="start">Sort</text><line x1="270" y1="485" x2="270" y2="493" stroke="#0B2026" stroke-width="2" stroke-linecap="round" marker-end="url(#ah0B2026)"/><rect x="60" y="494" width="420" height="42" rx="10" fill="#FFFFFF" stroke="#5F7281" stroke-width="2.5"/><circle cx="84" cy="515" r="14" fill="#5F7281"/><text x="84" y="521" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="18" font-weight="bold" fill="#FFFFFF" text-anchor="middle">8</text><text x="112" y="522" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="18" font-weight="bold" fill="#0B2026" text-anchor="start">LIMIT</text><text x="250" y="522" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="15" font-weight="normal" fill="#5F7281" text-anchor="start">Keep first N rows</text><rect x="560" y="140" width="580" height="150" rx="14" fill="#FFF3D6" stroke="#E8A317" stroke-width="2"/><path d="M560,180 L560,154 Q560,140 574,140 L1126,140 Q1140,140 1140,154 L1140,180 Z" fill="#E8A317"/><text x="850.0" y="166.3" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="18" font-weight="bold" fill="#0B2026" text-anchor="middle">What follows from the order</text><text x="580" y="205.0" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="16" font-weight="normal" fill="#1B3139" text-anchor="start">WHERE cannot use a SELECT alias: it runs earlier</text><text x="580" y="226.6" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="16" font-weight="normal" fill="#1B3139" text-anchor="start">HAVING can filter aggregates, WHERE cannot</text><text x="580" y="248.2" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="16" font-weight="normal" fill="#1B3139" text-anchor="start">Window functions run after HAVING: filter them</text><text x="580" y="269.8" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="16" font-weight="normal" fill="#1B3139" text-anchor="start">in an outer query or CTE, not in WHERE</text><rect x="560" y="320" width="580" height="150" rx="14" fill="#DCEBF7" stroke="#2272B4" stroke-width="2"/><path d="M560,360 L560,334 Q560,320 574,320 L1126,320 Q1140,320 1140,334 L1140,360 Z" fill="#2272B4"/><text x="850.0" y="346.3" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="18" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Aggregates versus rows</text><text x="580" y="385.0" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="16" font-weight="normal" fill="#1B3139" text-anchor="start">WHERE removes rows before groups exist</text><text x="580" y="406.6" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="16" font-weight="normal" fill="#1B3139" text-anchor="start">HAVING removes groups after they are computed</text><text x="580" y="428.2" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="16" font-weight="normal" fill="#1B3139" text-anchor="start">ORDER BY may use aliases: it runs after SELECT</text></svg>