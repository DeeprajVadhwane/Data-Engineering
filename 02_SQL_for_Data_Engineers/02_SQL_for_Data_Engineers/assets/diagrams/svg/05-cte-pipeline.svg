<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400"><defs><marker id="ah0B2026" markerWidth="12" markerHeight="12" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L12,6 L0,12 z" fill="#0B2026"/></marker></defs><rect width="1200" height="400" rx="16" fill="#FAF8F5"/><text x="40" y="54" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="30" font-weight="bold" fill="#0B2026" text-anchor="start">A query as a pipeline of named steps</text><rect x="40" y="64" width="64" height="5" rx="2.5" fill="#FF5F46"/><text x="40" y="98" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="17" font-weight="normal" fill="#5F7281" text-anchor="start">Each CTE is one readable stage; the final SELECT reads the last one</text><rect x="50" y="150" width="240" height="120" rx="14" fill="#FFFFFF" stroke="#2272B4" stroke-width="2"/><path d="M50,190 L50,164 Q50,150 64,150 L276,150 Q290,150 290,164 L290,190 Z" fill="#2272B4"/><text x="170.0" y="176.3" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="18" font-weight="bold" fill="#FFFFFF" text-anchor="middle">quarterly</text><text x="170" y="218.0" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="15" font-weight="normal" fill="#1B3139" text-anchor="middle">Revenue by region and quarter</text><line x1="292" y1="210" x2="333" y2="210" stroke="#0B2026" stroke-width="3" stroke-linecap="round" marker-end="url(#ah0B2026)"/><rect x="335" y="150" width="240" height="120" rx="14" fill="#FFFFFF" stroke="#2272B4" stroke-width="2"/><path d="M335,190 L335,164 Q335,150 349,150 L561,150 Q575,150 575,164 L575,190 Z" fill="#2272B4"/><text x="455.0" y="176.3" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="18" font-weight="bold" fill="#FFFFFF" text-anchor="middle">pivoted</text><text x="455" y="218.0" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="15" font-weight="normal" fill="#1B3139" text-anchor="middle">Q3 and Q4 side by side</text><line x1="577" y1="210" x2="618" y2="210" stroke="#0B2026" stroke-width="3" stroke-linecap="round" marker-end="url(#ah0B2026)"/><rect x="620" y="150" width="240" height="120" rx="14" fill="#FFFFFF" stroke="#FF5F46" stroke-width="2"/><path d="M620,190 L620,164 Q620,150 634,150 L846,150 Q860,150 860,164 L860,190 Z" fill="#FF5F46"/><text x="740.0" y="176.3" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="18" font-weight="bold" fill="#FFFFFF" text-anchor="middle">growth</text><text x="740" y="218.0" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="15" font-weight="normal" fill="#1B3139" text-anchor="middle">Percent change</text><line x1="862" y1="210" x2="903" y2="210" stroke="#0B2026" stroke-width="3" stroke-linecap="round" marker-end="url(#ah0B2026)"/><rect x="905" y="150" width="240" height="120" rx="14" fill="#FFFFFF" stroke="#1B8A5A" stroke-width="2"/><path d="M905,190 L905,164 Q905,150 919,150 L1131,150 Q1145,150 1145,164 L1145,190 Z" fill="#1B8A5A"/><text x="1025.0" y="176.3" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="18" font-weight="bold" fill="#FFFFFF" text-anchor="middle">final SELECT</text><text x="1025" y="218.0" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="15" font-weight="normal" fill="#1B3139" text-anchor="middle">Rank and present</text><text x="50" y="330" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="17" font-weight="normal" fill="#5F7281" text-anchor="start">WITH quarterly AS (...), pivoted AS (...), growth AS (...)</text><text x="50" y="358" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="17" font-weight="normal" fill="#5F7281" text-anchor="start">SELECT ... FROM growth ORDER BY growth_pct DESC;</text></svg>