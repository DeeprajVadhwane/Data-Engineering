<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="1200" height="380"><defs><marker id="ah0B2026" markerWidth="12" markerHeight="12" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L12,6 L0,12 z" fill="#0B2026"/></marker><marker id="ahFF5F46" markerWidth="12" markerHeight="12" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L12,6 L0,12 z" fill="#FF5F46"/></marker></defs><rect width="1200" height="380" rx="16" fill="#FAF8F5"/><text x="40" y="54" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="30" font-weight="bold" fill="#0B2026" text-anchor="start">Life of a query</text><rect x="40" y="64" width="64" height="5" rx="2.5" fill="#FF5F46"/><text x="40" y="98" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="17" font-weight="normal" fill="#5F7281" text-anchor="start">SQL says what. The optimiser decides how</text><rect x="40" y="140" width="190" height="110" rx="14" fill="#FFFFFF" stroke="#2272B4" stroke-width="2"/><path d="M40,180 L40,154 Q40,140 54,140 L216,140 Q230,140 230,154 L230,180 Z" fill="#2272B4"/><text x="135.0" y="166.3" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="18" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Parse</text><text x="135" y="215" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="15" font-weight="normal" fill="#1B3139" text-anchor="middle">syntax to tree</text><line x1="232" y1="195" x2="268" y2="195" stroke="#0B2026" stroke-width="3" stroke-linecap="round" marker-end="url(#ah0B2026)"/><rect x="270" y="140" width="190" height="110" rx="14" fill="#FFFFFF" stroke="#2272B4" stroke-width="2"/><path d="M270,180 L270,154 Q270,140 284,140 L446,140 Q460,140 460,154 L460,180 Z" fill="#2272B4"/><text x="365.0" y="166.3" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="18" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Analyse</text><text x="365" y="215" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="15" font-weight="normal" fill="#1B3139" text-anchor="middle">names and types</text><line x1="462" y1="195" x2="498" y2="195" stroke="#0B2026" stroke-width="3" stroke-linecap="round" marker-end="url(#ah0B2026)"/><rect x="500" y="140" width="190" height="110" rx="14" fill="#FFFFFF" stroke="#FF5F46" stroke-width="2"/><path d="M500,180 L500,154 Q500,140 514,140 L676,140 Q690,140 690,154 L690,180 Z" fill="#FF5F46"/><text x="595.0" y="166.3" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="18" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Optimise</text><text x="595" y="215" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="15" font-weight="normal" fill="#1B3139" text-anchor="middle">pick cheapest plan</text><line x1="692" y1="195" x2="728" y2="195" stroke="#0B2026" stroke-width="3" stroke-linecap="round" marker-end="url(#ah0B2026)"/><rect x="730" y="140" width="190" height="110" rx="14" fill="#FFFFFF" stroke="#1B8A5A" stroke-width="2"/><path d="M730,180 L730,154 Q730,140 744,140 L906,140 Q920,140 920,154 L920,180 Z" fill="#1B8A5A"/><text x="825.0" y="166.3" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="18" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Execute</text><text x="825" y="215" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="15" font-weight="normal" fill="#1B3139" text-anchor="middle">scan, join, aggregate</text><line x1="922" y1="195" x2="958" y2="195" stroke="#0B2026" stroke-width="3" stroke-linecap="round" marker-end="url(#ah0B2026)"/><rect x="960" y="140" width="190" height="110" rx="14" fill="#FFFFFF" stroke="#E8A317" stroke-width="2"/><path d="M960,180 L960,154 Q960,140 974,140 L1136,140 Q1150,140 1150,154 L1150,180 Z" fill="#E8A317"/><text x="1055.0" y="166.3" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="18" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Result</text><text x="1055" y="215" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="15" font-weight="normal" fill="#1B3139" text-anchor="middle">rows returned</text><rect x="450" y="275" width="190" height="30" rx="15.0" fill="#FF5F46"/><text x="545.0" y="294.9" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">statistics + indexes</text><line x1="545" y1="273" x2="545" y2="252" stroke="#FF5F46" stroke-width="2.5" stroke-linecap="round" marker-end="url(#ahFF5F46)"/><text x="40" y="345" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="17" font-weight="normal" fill="#5F7281" text-anchor="start">EXPLAIN shows the plan the optimiser chose.</text></svg>