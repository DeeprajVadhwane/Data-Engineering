<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="1200" height="520"><defs></defs><rect width="1200" height="520" rx="16" fill="#FAF8F5"/><text x="40" y="54" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="30" font-weight="bold" fill="#0B2026" text-anchor="start">Join types</text><rect x="40" y="64" width="64" height="5" rx="2.5" fill="#FF5F46"/><text x="40" y="98" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="17" font-weight="normal" fill="#5F7281" text-anchor="start">A = customers, B = orders. Shaded area is what the result keeps</text><circle cx="135" cy="270" r="70" fill="#FFFFFF" stroke="#2272B4" stroke-width="3"/><circle cx="205" cy="270" r="70" fill="#FFFFFF" stroke="#FF5F46" stroke-width="3"/><clipPath id="c0"><circle cx="135" cy="270" r="70"/></clipPath><circle clip-path="url(#c0)" cx="205" cy="270" r="70" fill="#1B8A5A" opacity="0.85"/><circle cx="135" cy="270" r="70" fill="none" stroke="#2272B4" stroke-width="3"/><circle cx="205" cy="270" r="70" fill="none" stroke="#FF5F46" stroke-width="3"/><text x="100" y="276" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="20" font-weight="bold" fill="#0B2026" text-anchor="middle">A</text><text x="240" y="276" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="20" font-weight="bold" fill="#0B2026" text-anchor="middle">B</text><text x="170" y="388" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="20" font-weight="bold" fill="#0B2026" text-anchor="middle">INNER JOIN</text><text x="170" y="414" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="15" font-weight="normal" fill="#5F7281" text-anchor="middle">matches only</text><circle cx="415" cy="270" r="70" fill="#DCEBF7" stroke="#2272B4" stroke-width="3"/><circle cx="485" cy="270" r="70" fill="#FFFFFF" stroke="#FF5F46" stroke-width="3"/><clipPath id="c1"><circle cx="415" cy="270" r="70"/></clipPath><circle clip-path="url(#c1)" cx="485" cy="270" r="70" fill="#1B8A5A" opacity="0.85"/><circle cx="415" cy="270" r="70" fill="none" stroke="#2272B4" stroke-width="3"/><circle cx="485" cy="270" r="70" fill="none" stroke="#FF5F46" stroke-width="3"/><text x="380" y="276" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="20" font-weight="bold" fill="#0B2026" text-anchor="middle">A</text><text x="520" y="276" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="20" font-weight="bold" fill="#0B2026" text-anchor="middle">B</text><text x="450" y="388" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="20" font-weight="bold" fill="#0B2026" text-anchor="middle">LEFT JOIN</text><text x="450" y="414" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="15" font-weight="normal" fill="#5F7281" text-anchor="middle">all A + matches</text><circle cx="695" cy="270" r="70" fill="#FFFFFF" stroke="#2272B4" stroke-width="3"/><circle cx="765" cy="270" r="70" fill="#FFE6E0" stroke="#FF5F46" stroke-width="3"/><clipPath id="c2"><circle cx="695" cy="270" r="70"/></clipPath><circle clip-path="url(#c2)" cx="765" cy="270" r="70" fill="#1B8A5A" opacity="0.85"/><circle cx="695" cy="270" r="70" fill="none" stroke="#2272B4" stroke-width="3"/><circle cx="765" cy="270" r="70" fill="none" stroke="#FF5F46" stroke-width="3"/><text x="660" y="276" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="20" font-weight="bold" fill="#0B2026" text-anchor="middle">A</text><text x="800" y="276" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="20" font-weight="bold" fill="#0B2026" text-anchor="middle">B</text><text x="730" y="388" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="20" font-weight="bold" fill="#0B2026" text-anchor="middle">RIGHT JOIN</text><text x="730" y="414" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="15" font-weight="normal" fill="#5F7281" text-anchor="middle">all B + matches</text><circle cx="975" cy="270" r="70" fill="#DCEBF7" stroke="#2272B4" stroke-width="3"/><circle cx="1045" cy="270" r="70" fill="#FFE6E0" stroke="#FF5F46" stroke-width="3"/><clipPath id="c3"><circle cx="975" cy="270" r="70"/></clipPath><circle clip-path="url(#c3)" cx="1045" cy="270" r="70" fill="#1B8A5A" opacity="0.85"/><circle cx="975" cy="270" r="70" fill="none" stroke="#2272B4" stroke-width="3"/><circle cx="1045" cy="270" r="70" fill="none" stroke="#FF5F46" stroke-width="3"/><text x="940" y="276" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="20" font-weight="bold" fill="#0B2026" text-anchor="middle">A</text><text x="1080" y="276" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="20" font-weight="bold" fill="#0B2026" text-anchor="middle">B</text><text x="1010" y="388" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="20" font-weight="bold" fill="#0B2026" text-anchor="middle">FULL JOIN</text><text x="1010" y="414" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="15" font-weight="normal" fill="#5F7281" text-anchor="middle">everything</text><text x="60" y="475" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="16" font-weight="normal" fill="#5F7281" text-anchor="start">Unmatched columns are filled with NULL. Anti-join: LEFT JOIN ... WHERE B.key IS NULL.</text></svg>