<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 440" width="1200" height="440"><defs><marker id="ah0B2026" markerWidth="12" markerHeight="12" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L12,6 L0,12 z" fill="#0B2026"/></marker></defs><rect width="1200" height="440" rx="16" fill="#FAF8F5"/><text x="40" y="54" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="30" font-weight="bold" fill="#0B2026" text-anchor="start">Where Python sits in a data platform</text><rect x="40" y="64" width="64" height="5" rx="2.5" fill="#FF5F46"/><text x="40" y="98" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="17" font-weight="normal" fill="#5F7281" text-anchor="start">Python connects, controls and checks. SQL engines do the heavy transformation</text><rect x="40" y="130" width="1120" height="250" rx="18" fill="#DCEBF7" stroke="#2272B4" stroke-width="2"/><text x="60" y="158" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="18" font-weight="bold" fill="#2272B4" text-anchor="start">Python: fetch, validate, orchestrate, retry, log, alert</text><rect x="60" y="190" width="175" height="110" rx="12" fill="#E8ECEF" stroke="#5F7281" stroke-width="2"/><text x="147.5" y="227.49" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="17" font-weight="bold" fill="#1B3139" text-anchor="middle">Sources</text><text x="147.5" y="250.44" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="17" font-weight="normal" fill="#1B3139" text-anchor="middle">files, APIs,</text><text x="147.5" y="273.39" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="17" font-weight="normal" fill="#1B3139" text-anchor="middle">databases</text><line x1="237" y1="245.0" x2="273" y2="245.0" stroke="#0B2026" stroke-width="3" stroke-linecap="round" marker-end="url(#ah0B2026)"/><rect x="275" y="190" width="175" height="110" rx="12" fill="#FFFFFF" stroke="#2272B4" stroke-width="2"/><text x="362.5" y="227.49" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="17" font-weight="bold" fill="#1B3139" text-anchor="middle">Ingest</text><text x="362.5" y="250.44" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="17" font-weight="normal" fill="#1B3139" text-anchor="middle">Python reads</text><text x="362.5" y="273.39" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="17" font-weight="normal" fill="#1B3139" text-anchor="middle">and checks</text><line x1="452" y1="245.0" x2="488" y2="245.0" stroke="#0B2026" stroke-width="3" stroke-linecap="round" marker-end="url(#ah0B2026)"/><rect x="490" y="190" width="175" height="110" rx="12" fill="#FFE6E0" stroke="#FF5F46" stroke-width="2"/><text x="577.5" y="227.49" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="17" font-weight="bold" fill="#1B3139" text-anchor="middle">Transform</text><text x="577.5" y="250.44" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="17" font-weight="normal" fill="#1B3139" text-anchor="middle">SQL / Spark</text><text x="577.5" y="273.39" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="17" font-weight="normal" fill="#1B3139" text-anchor="middle">engine</text><line x1="667" y1="245.0" x2="703" y2="245.0" stroke="#0B2026" stroke-width="3" stroke-linecap="round" marker-end="url(#ah0B2026)"/><rect x="705" y="190" width="175" height="110" rx="12" fill="#DDF1E7" stroke="#1B8A5A" stroke-width="2"/><text x="792.5" y="239.05" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="17" font-weight="bold" fill="#1B3139" text-anchor="middle">Gold tables</text><text x="792.5" y="262.0" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="17" font-weight="normal" fill="#1B3139" text-anchor="middle">clean, modelled</text><line x1="882" y1="245.0" x2="918" y2="245.0" stroke="#0B2026" stroke-width="3" stroke-linecap="round" marker-end="url(#ah0B2026)"/><rect x="920" y="190" width="175" height="110" rx="12" fill="#FFF3D6" stroke="#E8A317" stroke-width="2"/><text x="1007.5" y="227.49" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="17" font-weight="bold" fill="#1B3139" text-anchor="middle">Consumers</text><text x="1007.5" y="250.44" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="17" font-weight="normal" fill="#1B3139" text-anchor="middle">dashboards,</text><text x="1007.5" y="273.39" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="17" font-weight="normal" fill="#1B3139" text-anchor="middle">Streamlit</text><text x="60" y="345" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="16" font-weight="normal" fill="#1B3139" text-anchor="start">Same job, two tools: SQL for set-based work inside the engine, Python for everything around it.</text></svg>