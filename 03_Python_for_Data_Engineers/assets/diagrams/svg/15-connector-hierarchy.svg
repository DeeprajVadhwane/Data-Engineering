<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 460" width="1200" height="460"><defs><marker id="ah0B2026" markerWidth="12" markerHeight="12" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L12,6 L0,12 z" fill="#0B2026"/></marker></defs><rect width="1200" height="460" rx="16" fill="#FAF8F5"/><text x="40" y="54" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="30" font-weight="bold" fill="#0B2026" text-anchor="start">Inheritance with abstraction</text><rect x="40" y="64" width="64" height="5" rx="2.5" fill="#FF5F46"/><text x="40" y="98" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="17" font-weight="normal" fill="#5F7281" text-anchor="start">The pipeline depends on the base class. Each source supplies its own read()</text><rect x="400" y="120" width="400" height="110" rx="12" fill="#ECE6FA" stroke="#6C4FBF" stroke-width="2"/><text x="600.0" y="157.49" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="17" font-weight="bold" fill="#1B3139" text-anchor="middle">DataSource (abstract)</text><text x="600.0" y="180.44" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="17" font-weight="normal" fill="#1B3139" text-anchor="middle">read()  &lt;- must be overridden</text><text x="600.0" y="203.39000000000001" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="17" font-weight="normal" fill="#1B3139" text-anchor="middle">describe()  &lt;- shared</text><rect x="100" y="320" width="300" height="90" rx="12" fill="#DDF1E7" stroke="#1B8A5A" stroke-width="2"/><text x="250.0" y="348.52" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="16" font-weight="bold" fill="#1B3139" text-anchor="middle">CsvSource</text><text x="250.0" y="370.12" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="16" font-weight="normal" fill="#1B3139" text-anchor="middle">read from a CSV file</text><text x="250.0" y="391.71999999999997" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="16" font-weight="normal" fill="#1B3139" text-anchor="middle">overrides read()</text><line x1="600" y1="232" x2="250" y2="318" stroke="#0B2026" stroke-width="2.5" stroke-linecap="round" marker-end="url(#ah0B2026)"/><rect x="440" y="320" width="300" height="90" rx="12" fill="#DDF1E7" stroke="#1B8A5A" stroke-width="2"/><text x="590.0" y="348.52" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="16" font-weight="bold" fill="#1B3139" text-anchor="middle">JsonSource</text><text x="590.0" y="370.12" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="16" font-weight="normal" fill="#1B3139" text-anchor="middle">read from a JSON file</text><text x="590.0" y="391.71999999999997" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="16" font-weight="normal" fill="#1B3139" text-anchor="middle">overrides read()</text><line x1="600" y1="232" x2="590" y2="318" stroke="#0B2026" stroke-width="2.5" stroke-linecap="round" marker-end="url(#ah0B2026)"/><rect x="780" y="320" width="300" height="90" rx="12" fill="#DDF1E7" stroke="#1B8A5A" stroke-width="2"/><text x="930.0" y="348.52" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="16" font-weight="bold" fill="#1B3139" text-anchor="middle">DbSource</text><text x="930.0" y="370.12" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="16" font-weight="normal" fill="#1B3139" text-anchor="middle">read from a database</text><text x="930.0" y="391.71999999999997" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="16" font-weight="normal" fill="#1B3139" text-anchor="middle">overrides read()</text><line x1="600" y1="232" x2="930" y2="318" stroke="#0B2026" stroke-width="2.5" stroke-linecap="round" marker-end="url(#ah0B2026)"/><text x="400" y="275" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="15" font-weight="bold" fill="#5F7281" text-anchor="start">is-a</text></svg>