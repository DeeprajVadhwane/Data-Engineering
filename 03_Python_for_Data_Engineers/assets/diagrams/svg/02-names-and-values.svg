<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 440" width="1200" height="440"><defs><marker id="ah0B2026" markerWidth="12" markerHeight="12" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L12,6 L0,12 z" fill="#0B2026"/></marker></defs><rect width="1200" height="440" rx="16" fill="#FAF8F5"/><text x="40" y="54" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="30" font-weight="bold" fill="#0B2026" text-anchor="start">A name is a label attached to a value</text><rect x="40" y="64" width="64" height="5" rx="2.5" fill="#FF5F46"/><text x="40" y="98" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="17" font-weight="normal" fill="#5F7281" text-anchor="start">Assignment binds a name to an object. It does not put the value inside the name</text><rect x="60" y="140" width="150" height="38" rx="19.0" fill="#2272B4"/><text x="135.0" y="164.95" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="17" font-weight="bold" fill="#FFFFFF" text-anchor="middle">quantity</text><rect x="60" y="202" width="150" height="38" rx="19.0" fill="#2272B4"/><text x="135.0" y="226.95" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="17" font-weight="bold" fill="#FFFFFF" text-anchor="middle">price</text><rect x="60" y="264" width="150" height="38" rx="19.0" fill="#2272B4"/><text x="135.0" y="288.95" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="17" font-weight="bold" fill="#FFFFFF" text-anchor="middle">region</text><rect x="60" y="326" width="150" height="38" rx="19.0" fill="#2272B4"/><text x="135.0" y="350.95" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="17" font-weight="bold" fill="#FFFFFF" text-anchor="middle">city</text><line x1="212" y1="159" x2="480" y2="159" stroke="#0B2026" stroke-width="2.5" stroke-linecap="round" marker-end="url(#ah0B2026)"/><line x1="212" y1="221" x2="480" y2="221" stroke="#0B2026" stroke-width="2.5" stroke-linecap="round" marker-end="url(#ah0B2026)"/><line x1="212" y1="283" x2="480" y2="283" stroke="#0B2026" stroke-width="2.5" stroke-linecap="round" marker-end="url(#ah0B2026)"/><line x1="212" y1="345" x2="480" y2="296" stroke="#0B2026" stroke-width="2.5" stroke-linecap="round" marker-end="url(#ah0B2026)"/><rect x="485" y="134" width="200" height="50" rx="12" fill="#DDF1E7" stroke="#1B8A5A" stroke-width="2"/><text x="585.0" y="153.75" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="15" font-weight="bold" fill="#1B3139" text-anchor="middle">int</text><text x="585.0" y="174.0" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="15" font-weight="normal" fill="#1B3139" text-anchor="middle">10</text><rect x="485" y="196" width="200" height="50" rx="12" fill="#DDF1E7" stroke="#1B8A5A" stroke-width="2"/><text x="585.0" y="215.75" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="15" font-weight="bold" fill="#1B3139" text-anchor="middle">float</text><text x="585.0" y="236.0" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="15" font-weight="normal" fill="#1B3139" text-anchor="middle">499.99</text><rect x="485" y="258" width="200" height="56" rx="12" fill="#DDF1E7" stroke="#1B8A5A" stroke-width="2"/><text x="585.0" y="280.75" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="15" font-weight="bold" fill="#1B3139" text-anchor="middle">str</text><text x="585.0" y="301.0" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="15" font-weight="normal" fill="#1B3139" text-anchor="middle">&#x27;West&#x27;</text><rect x="740" y="140" width="400" height="230" rx="14" fill="#FFF3D6" stroke="#E8A317" stroke-width="2"/><path d="M740,180 L740,154 Q740,140 754,140 L1126,140 Q1140,140 1140,154 L1140,180 Z" fill="#E8A317"/><text x="940.0" y="166.3" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="18" font-weight="bold" fill="#0B2026" text-anchor="middle">Remember</text><text x="760" y="205.0" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="16" font-weight="normal" fill="#1B3139" text-anchor="start">The type belongs to the value, not the name</text><text x="760" y="226.6" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="16" font-weight="normal" fill="#1B3139" text-anchor="start">A name can be rebound: x = 10, then x = &#x27;ten&#x27;</text><text x="760" y="248.2" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="16" font-weight="normal" fill="#1B3139" text-anchor="start">Two names can point at the same object</text><text x="760" y="269.8" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="16" font-weight="normal" fill="#1B3139" text-anchor="start">Names are case sensitive: Total is not total</text></svg>