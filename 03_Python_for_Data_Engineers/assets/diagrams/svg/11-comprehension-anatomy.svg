<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400"><defs></defs><rect width="1200" height="400" rx="16" fill="#FAF8F5"/><text x="40" y="54" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="30" font-weight="bold" fill="#0B2026" text-anchor="start">Anatomy of a comprehension</text><rect x="40" y="64" width="64" height="5" rx="2.5" fill="#FF5F46"/><text x="40" y="98" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="17" font-weight="normal" fill="#5F7281" text-anchor="start">[ expression  for item in iterable  if condition ]</text><rect x="60" y="150" width="240" height="140" rx="14" fill="#FFFFFF" stroke="#1B8A5A" stroke-width="2"/><path d="M60,190 L60,164 Q60,150 74,150 L286,150 Q300,150 300,164 L300,190 Z" fill="#1B8A5A"/><text x="180.0" y="175.95" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="17" font-weight="bold" fill="#FFFFFF" text-anchor="middle">expression</text><text x="180.0" y="225" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="16" font-weight="normal" fill="#1B3139" text-anchor="middle">what to keep</text><text x="180.0" y="260" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="15" font-weight="bold" fill="#1B8A5A" text-anchor="middle">amount * 1.18</text><rect x="340" y="150" width="330" height="140" rx="14" fill="#FFFFFF" stroke="#2272B4" stroke-width="2"/><path d="M340,190 L340,164 Q340,150 354,150 L656,150 Q670,150 670,164 L670,190 Z" fill="#2272B4"/><text x="505.0" y="175.95" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="17" font-weight="bold" fill="#FFFFFF" text-anchor="middle">for item in iterable</text><text x="505.0" y="225" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="16" font-weight="normal" fill="#1B3139" text-anchor="middle">where from</text><text x="505.0" y="260" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="15" font-weight="bold" fill="#2272B4" text-anchor="middle">for amount in amounts</text><rect x="700" y="150" width="250" height="140" rx="14" fill="#FFFFFF" stroke="#FF5F46" stroke-width="2"/><path d="M700,190 L700,164 Q700,150 714,150 L936,150 Q950,150 950,164 L950,190 Z" fill="#FF5F46"/><text x="825.0" y="175.95" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="17" font-weight="bold" fill="#FFFFFF" text-anchor="middle">if condition</text><text x="825.0" y="225" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="16" font-weight="normal" fill="#1B3139" text-anchor="middle">optional filter</text><text x="825.0" y="260" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="15" font-weight="bold" fill="#FF5F46" text-anchor="middle">if amount &gt; 0</text><text x="60" y="345" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="16" font-weight="normal" fill="#5F7281" text-anchor="start">A dict comprehension has the same shape:  { key: value  for item in iterable  if condition }</text></svg>