<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 330" width="1200" height="330"><defs><marker id="ah0B2026" markerWidth="12" markerHeight="12" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L12,6 L0,12 z" fill="#0B2026"/></marker></defs><rect width="1200" height="330" rx="16" fill="#FAF8F5"/><text x="40" y="54" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="30" font-weight="bold" fill="#0B2026" text-anchor="start">How Python runs your code</text><rect x="40" y="64" width="64" height="5" rx="2.5" fill="#FF5F46"/><text x="40" y="98" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="17" font-weight="normal" fill="#5F7281" text-anchor="start">Compile to bytecode once, then the virtual machine executes it</text><rect x="40" y="140" width="185" height="110" rx="12" fill="#DCEBF7" stroke="#2272B4" stroke-width="2"/><text x="132.5" y="177.49" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="17" font-weight="bold" fill="#1B3139" text-anchor="middle">Source code</text><text x="132.5" y="200.44" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="17" font-weight="normal" fill="#1B3139" text-anchor="middle">.py file or</text><text x="132.5" y="223.39000000000001" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="17" font-weight="normal" fill="#1B3139" text-anchor="middle">notebook cell</text><line x1="227" y1="195.0" x2="271" y2="195.0" stroke="#0B2026" stroke-width="3" stroke-linecap="round" marker-end="url(#ah0B2026)"/><rect x="273" y="140" width="185" height="110" rx="12" fill="#FFE6E0" stroke="#FF5F46" stroke-width="2"/><text x="365.5" y="177.49" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="17" font-weight="bold" fill="#1B3139" text-anchor="middle">Compiler</text><text x="365.5" y="200.44" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="17" font-weight="normal" fill="#1B3139" text-anchor="middle">checks syntax,</text><text x="365.5" y="223.39000000000001" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="17" font-weight="normal" fill="#1B3139" text-anchor="middle">makes bytecode</text><line x1="460" y1="195.0" x2="504" y2="195.0" stroke="#0B2026" stroke-width="3" stroke-linecap="round" marker-end="url(#ah0B2026)"/><rect x="506" y="140" width="185" height="110" rx="12" fill="#E8ECEF" stroke="#5F7281" stroke-width="2"/><text x="598.5" y="177.49" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="17" font-weight="bold" fill="#1B3139" text-anchor="middle">Bytecode</text><text x="598.5" y="200.44" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="17" font-weight="normal" fill="#1B3139" text-anchor="middle">compact internal</text><text x="598.5" y="223.39000000000001" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="17" font-weight="normal" fill="#1B3139" text-anchor="middle">instructions</text><line x1="693" y1="195.0" x2="737" y2="195.0" stroke="#0B2026" stroke-width="3" stroke-linecap="round" marker-end="url(#ah0B2026)"/><rect x="739" y="140" width="185" height="110" rx="12" fill="#FFE6E0" stroke="#FF5F46" stroke-width="2"/><text x="831.5" y="177.49" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="17" font-weight="bold" fill="#1B3139" text-anchor="middle">Python VM</text><text x="831.5" y="200.44" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="17" font-weight="normal" fill="#1B3139" text-anchor="middle">runs one</text><text x="831.5" y="223.39000000000001" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="17" font-weight="normal" fill="#1B3139" text-anchor="middle">instruction at a time</text><line x1="926" y1="195.0" x2="970" y2="195.0" stroke="#0B2026" stroke-width="3" stroke-linecap="round" marker-end="url(#ah0B2026)"/><rect x="972" y="140" width="185" height="110" rx="12" fill="#DDF1E7" stroke="#1B8A5A" stroke-width="2"/><text x="1064.5" y="177.49" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="17" font-weight="bold" fill="#1B3139" text-anchor="middle">Output</text><text x="1064.5" y="200.44" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="17" font-weight="normal" fill="#1B3139" text-anchor="middle">results, files,</text><text x="1064.5" y="223.39000000000001" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="17" font-weight="normal" fill="#1B3139" text-anchor="middle">side effects</text><text x="40" y="296" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="16" font-weight="normal" fill="#5F7281" text-anchor="start">CPython is the standard implementation. Heavy numeric work is left to engines such as SQL, Spark and pandas.</text></svg>