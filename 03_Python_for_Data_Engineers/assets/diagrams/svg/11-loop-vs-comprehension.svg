<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 440" width="1200" height="440"><defs><marker id="ah0B2026" markerWidth="12" markerHeight="12" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L12,6 L0,12 z" fill="#0B2026"/></marker></defs><rect width="1200" height="440" rx="16" fill="#FAF8F5"/><text x="40" y="54" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="30" font-weight="bold" fill="#0B2026" text-anchor="start">A comprehension is a loop that builds a collection</text><rect x="40" y="64" width="64" height="5" rx="2.5" fill="#FF5F46"/><text x="40" y="98" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="17" font-weight="normal" fill="#5F7281" text-anchor="start">Same result, one line</text><rect x="40" y="130" width="520" height="270" rx="14" fill="#E8ECEF" stroke="#5F7281" stroke-width="2"/><path d="M40,170 L40,144 Q40,130 54,130 L546,130 Q560,130 560,144 L560,170 Z" fill="#5F7281"/><text x="300.0" y="156.3" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="18" font-weight="bold" fill="#FFFFFF" text-anchor="middle">for loop</text><text x="70" y="205.0" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="17" font-weight="normal" fill="#1B3139" text-anchor="start">totals = []</text><text x="70" y="227.95" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="17" font-weight="normal" fill="#1B3139" text-anchor="start">for amount in amounts:</text><text x="70" y="250.9" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="17" font-weight="normal" fill="#1B3139" text-anchor="start">    if amount &gt; 0:</text><text x="70" y="273.85" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="17" font-weight="normal" fill="#1B3139" text-anchor="start">        totals.append(amount * 1.18)</text><line x1="570" y1="265" x2="640" y2="265" stroke="#0B2026" stroke-width="3" stroke-linecap="round" marker-end="url(#ah0B2026)"/><rect x="650" y="130" width="510" height="270" rx="14" fill="#DDF1E7" stroke="#1B8A5A" stroke-width="2"/><path d="M650,170 L650,144 Q650,130 664,130 L1146,130 Q1160,130 1160,144 L1160,170 Z" fill="#1B8A5A"/><text x="905.0" y="156.3" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="18" font-weight="bold" fill="#FFFFFF" text-anchor="middle">comprehension</text><text x="680" y="245" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="18" font-weight="bold" fill="#0B2026" text-anchor="start">totals = [amount * 1.18</text><text x="680" y="280" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="18" font-weight="bold" fill="#0B2026" text-anchor="start">          for amount in amounts</text><text x="680" y="315" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="18" font-weight="bold" fill="#0B2026" text-anchor="start">          if amount &gt; 0]</text><text x="680" y="372" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="15" font-weight="normal" fill="#5F7281" text-anchor="start">Use it while it stays easy to read</text></svg>