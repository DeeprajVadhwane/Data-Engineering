<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 460" width="1200" height="460"><defs><marker id="ah0B2026" markerWidth="12" markerHeight="12" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L12,6 L0,12 z" fill="#0B2026"/></marker></defs><rect width="1200" height="460" rx="16" fill="#FAF8F5"/><text x="40" y="54" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="30" font-weight="bold" fill="#0B2026" text-anchor="start">The Streamlit rerun model</text><rect x="40" y="64" width="64" height="5" rx="2.5" fill="#FF5F46"/><text x="40" y="98" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="17" font-weight="normal" fill="#5F7281" text-anchor="start">Every interaction runs the whole script again, top to bottom</text><rect x="50" y="130" width="230" height="100" rx="12" fill="#DCEBF7" stroke="#2272B4" stroke-width="2"/><text x="165.0" y="174.05" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="17" font-weight="bold" fill="#1B3139" text-anchor="middle">User</text><text x="165.0" y="197.0" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="17" font-weight="normal" fill="#1B3139" text-anchor="middle">changes a widget</text><line x1="282" y1="180.0" x2="338" y2="180.0" stroke="#0B2026" stroke-width="3" stroke-linecap="round" marker-end="url(#ah0B2026)"/><rect x="340" y="130" width="230" height="100" rx="12" fill="#FFE6E0" stroke="#FF5F46" stroke-width="2"/><text x="455.0" y="174.05" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="17" font-weight="bold" fill="#1B3139" text-anchor="middle">Script reruns</text><text x="455.0" y="197.0" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="17" font-weight="normal" fill="#1B3139" text-anchor="middle">top to bottom</text><line x1="572" y1="180.0" x2="628" y2="180.0" stroke="#0B2026" stroke-width="3" stroke-linecap="round" marker-end="url(#ah0B2026)"/><rect x="630" y="130" width="230" height="100" rx="12" fill="#FFFFFF" stroke="#2272B4" stroke-width="2"/><text x="745.0" y="174.05" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="17" font-weight="bold" fill="#1B3139" text-anchor="middle">Widgets return</text><text x="745.0" y="197.0" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="17" font-weight="normal" fill="#1B3139" text-anchor="middle">their new values</text><line x1="862" y1="180.0" x2="918" y2="180.0" stroke="#0B2026" stroke-width="3" stroke-linecap="round" marker-end="url(#ah0B2026)"/><rect x="920" y="130" width="230" height="100" rx="12" fill="#DDF1E7" stroke="#1B8A5A" stroke-width="2"/><text x="1035.0" y="162.49" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="17" font-weight="bold" fill="#1B3139" text-anchor="middle">Page redraws</text><text x="1035.0" y="185.44" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="17" font-weight="normal" fill="#1B3139" text-anchor="middle">table, chart,</text><text x="1035.0" y="208.39000000000001" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="17" font-weight="normal" fill="#1B3139" text-anchor="middle">metrics</text><line x1="1000" y1="232" x2="1000" y2="290" stroke="#0B2026" stroke-width="2.5" stroke-linecap="round"/><line x1="1000" y1="290" x2="165" y2="290" stroke="#0B2026" stroke-width="2.5" stroke-linecap="round"/><line x1="165" y1="290" x2="165" y2="234" stroke="#0B2026" stroke-width="2.5" stroke-linecap="round" marker-end="url(#ah0B2026)"/><text x="450" y="318" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="15" font-weight="normal" fill="#5F7281" text-anchor="start">next interaction starts another run</text><rect x="50" y="350" width="520" height="90" rx="14" fill="#DDF1E7" stroke="#1B8A5A" stroke-width="2"/><path d="M50,382 L50,364 Q50,350 64,350 L556,350 Q570,350 570,364 L570,382 Z" fill="#1B8A5A"/><text x="310.0" y="371.6" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="16" font-weight="bold" fill="#FFFFFF" text-anchor="middle">@st.cache_data</text><text x="70" y="420" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="15" font-weight="normal" fill="#1B3139" text-anchor="start">expensive loading runs once, answers come from the cache</text><rect x="620" y="350" width="520" height="90" rx="14" fill="#FFF3D6" stroke="#E8A317" stroke-width="2"/><path d="M620,382 L620,364 Q620,350 634,350 L1126,350 Q1140,350 1140,364 L1140,382 Z" fill="#E8A317"/><text x="880.0" y="371.6" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="16" font-weight="bold" fill="#0B2026" text-anchor="middle">st.session_state</text><text x="640" y="420" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="15" font-weight="normal" fill="#1B3139" text-anchor="start">values that must survive between reruns</text></svg>