<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420"><defs></defs><rect width="1200" height="420" rx="16" fill="#FAF8F5"/><text x="40" y="54" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="30" font-weight="bold" fill="#0B2026" text-anchor="start">Parts of a function</text><rect x="40" y="64" width="64" height="5" rx="2.5" fill="#FF5F46"/><text x="40" y="98" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="17" font-weight="normal" fill="#5F7281" text-anchor="start">Definition on top, call below</text><rect x="60" y="130" width="1080" height="100" rx="12" fill="#FFFFFF" stroke="#2272B4" stroke-width="2"/><text x="90" y="190" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="22" font-weight="bold" fill="#0B2026" text-anchor="start">def  apply_tax ( amount ,  rate = 0.18 ) :   return amount * (1 + rate)</text><rect x="80" y="245" width="130" height="30" rx="15.0" fill="#2272B4"/><text x="145.0" y="264.9" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">keyword</text><rect x="215" y="245" width="130" height="30" rx="15.0" fill="#FF5F46"/><text x="280.0" y="264.9" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">name</text><rect x="400" y="245" width="150" height="30" rx="15.0" fill="#1B8A5A"/><text x="475.0" y="264.9" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">parameters</text><rect x="720" y="245" width="150" height="30" rx="15.0" fill="#6C4FBF"/><text x="795.0" y="264.9" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">body / return</text><rect x="60" y="300" width="1080" height="80" rx="12" fill="#FFFFFF" stroke="#1B8A5A" stroke-width="2"/><text x="90" y="3