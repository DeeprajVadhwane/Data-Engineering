<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="1200" height="520"><defs><marker id="ahD93A25" markerWidth="12" markerHeight="12" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L12,6 L0,12 z" fill="#D93A25"/></marker><marker id="ah0B2026" markerWidth="12" markerHeight="12" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L12,6 L0,12 z" fill="#0B2026"/></marker></defs><rect width="1200" height="520" rx="16" fill="#FAF8F5"/><text x="40" y="54" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="30" font-weight="bold" fill="#0B2026" text-anchor="start">A robust file pipeline</text><rect x="40" y="64" width="64" height="5" rx="2.5" fill="#FF5F46"/><text x="40" y="98" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="17" font-weight="normal" fill="#5F7281" text-anchor="start">Read, validate, write. Every failure is handled, counted and logged</text><rect x="50" y="130" width="230" height="100" rx="12" fill="#DCEBF7" stroke="#2272B4" stroke-width="2"/><text x="165.0" y="162.49" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="17" font-weight="bold" fill="#1B3139" text-anchor="middle">Read file</text><text x="165.0" y="185.44" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="17" font-weight="normal" fill="#1B3139" text-anchor="middle">with open(...)</text><text x="165.0" y="208.39000000000001" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="17" font-weight="normal" fill="#1B3139" text-anchor="middle">utf-8</text><line x1="282" y1="180.0" x2="338" y2="180.0" stroke="#0B2026" stroke-width="3" stroke-linecap="round" marker-end="url(#ah0B2026)"/><rect x="340" y="130" width="230" height="100" rx="12" fill="#DCEBF7" stroke="#2272B4" stroke-width="2"/><text x="455.0" y="162.49" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="17" font-weight="bold" fill="#1B3139" text-anchor="middle">Parse rows</text><text x="455.0" y="185.44" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="17" font-weight="normal" fill="#1B3139" text-anchor="middle">csv / json</text><text x="455.0" y="208.39000000000001" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="17" font-weight="normal" fill="#1B3139" text-anchor="middle">module</text><line x1="572" y1="180.0" x2="628" y2="180.0" stroke="#0B2026" stroke-width="3" stroke-linecap="round" marker-end="url(#ah0B2026)"/><rect x="630" y="130" width="230" height="100" rx="12" fill="#FFE6E0" stroke="#FF5F46" stroke-width="2"/><text x="745.0" y="162.49" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="17" font-weight="bold" fill="#1B3139" text-anchor="middle">Validate</text><text x="745.0" y="185.44" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="17" font-weight="normal" fill="#1B3139" text-anchor="middle">try / except</text><text x="745.0" y="208.39000000000001" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="17" font-weight="normal" fill="#1B3139" text-anchor="middle">per row</text><line x1="862" y1="180.0" x2="918" y2="180.0" stroke="#0B2026" stroke-width="3" stroke-linecap="round" marker-end="url(#ah0B2026)"/><rect x="920" y="130" width="230" height="100" rx="12" fill="#DDF1E7" stroke="#1B8A5A" stroke-width="2"/><text x="1035.0" y="162.49" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="17" font-weight="bold" fill="#1B3139" text-anchor="middle">Write</text><text x="1035.0" y="185.44" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="17" font-weight="normal" fill="#1B3139" text-anchor="middle">clean file</text><text x="1035.0" y="208.39000000000001" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="17" font-weight="normal" fill="#1B3139" text-anchor="middle">with open(...)</text><line x1="555" y1="232" x2="555" y2="300" stroke="#D93A25" stroke-width="2.5" stroke-linecap="round" marker-end="url(#ahD93A25)"/><rect x="430" y="303" width="250" height="70" rx="12" fill="#FFE6E0" stroke="#D93A25" stroke-width="2"/><text x="555.0" y="332.4" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="16" font-weight="bold" fill="#1B3139" text-anchor="middle">rejected rows</text><text x="555.0" y="354.0" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="16" font-weight="normal" fill="#1B3139" text-anchor="middle">with a reason</text><rect x="740" y="300" width="400" height="150" rx="14" fill="#FFF3D6" stroke="#E8A317" stroke-width="2"/><path d="M740,334 L740,314 Q740,300 754,300 L1126,300 Q1140,300 1140,314 L1140,334 Z" fill="#E8A317"/><text x="940.0" y="322.6" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="16" font-weight="bold" fill="#0B2026" text-anchor="middle">Around the flow</text><text x="760" y="365.0" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="15" font-weight="normal" fill="#1B3139" text-anchor="start">logging: counts and errors</text><text x="760" y="385.25" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="15" font-weight="normal" fill="#1B3139" text-anchor="start">retry for transient failures</text><text x="760" y="405.5" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="15" font-weight="normal" fill="#1B3139" text-anchor="start">gate: stop if too many rejects</text><text x="50" y="440" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="16" font-weight="normal" fill="#5F7281" text-anchor="start">Files are closed automatically by with, even when an error occurs.</text></svg>