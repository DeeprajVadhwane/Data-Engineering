<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 460" width="1200" height="460"><defs></defs><rect width="1200" height="460" rx="16" fill="#FAF8F5"/><text x="40" y="54" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="30" font-weight="bold" fill="#0B2026" text-anchor="start">Set operations</text><rect x="40" y="64" width="64" height="5" rx="2.5" fill="#FF5F46"/><text x="40" y="98" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="17" font-weight="normal" fill="#5F7281" text-anchor="start">A = customers who ordered in November, B = customers who ordered in December</text><circle cx="330" cy="250" r="120" fill="#DCEBF7" stroke="#2272B4" stroke-width="3"/><circle cx="470" cy="250" r="120" fill="#FFE6E0" stroke="#FF5F46" stroke-width="3"/><clipPath id="cs"><circle cx="330" cy="250" r="120"/></clipPath><circle clip-path="url(#cs)" cx="470" cy="250" r="120" fill="#1B8A5A" opacity="0.8"/><text x="270" y="255" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="18" font-weight="bold" fill="#0B2026" text-anchor="middle">A only</text><text x="530" y="255" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="18" font-weight="bold" fill="#0B2026" text-anchor="middle">B only</text><text x="400" y="255" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="18" font-weight="bold" fill="#FFFFFF" text-anchor="middle">both</text><rect x="700" y="140" width="110" height="40" rx="20.0" fill="#2272B4"/><text x="755.0" y="166.65" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="19" font-weight="bold" fill="#FFFFFF" text-anchor="middle">A | B</text><text x="830" y="167" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="17" font-weight="normal" fill="#1B3139" text-anchor="start">union: in either</text><rect x="700" y="212" width="110" height="40" rx="20.0" fill="#1B8A5A"/><text x="755.0" y="238.65" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="19" font-weight="bold" fill="#FFFFFF" text-anchor="middle">A &amp; B</text><text x="830" y="239" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="17" font-weight="normal" fill="#1B3139" text-anchor="start">intersection: in both</text><rect x="700" y="284" width="110" height="40" rx="20.0" fill="#FF5F46"/><text x="755.0" y="310.65" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="19" font-weight="bold" fill="#FFFFFF" text-anchor="middle">A - B</text><text x="830" y="311" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="17" font-weight="normal" fill="#1B3139" text-anchor="start">difference: in A, not in B</text><rect x="700" y="356" width="110" height="40" rx="20.0" fill="#6C4FBF"/><text x="755.0" y="382.65" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="19" font-weight="bold" fill="#FFFFFF" text-anchor="middle">A ^ B</text><text x="830" y="383" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="17" font-weight="normal" fill="#1B3139" text-anchor="start">symmetric difference: in one only</text><text x="700" y="440" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="15" font-weight="normal" fill="#5F7281" text-anchor="start">Sets also remove duplicates: set([1, 1, 2]) is {1, 2}</text></svg>