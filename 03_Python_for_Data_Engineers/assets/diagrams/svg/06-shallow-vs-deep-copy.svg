<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="1200" height="520"><defs><marker id="ah0B2026" markerWidth="12" markerHeight="12" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L12,6 L0,12 z" fill="#0B2026"/></marker></defs><rect width="1200" height="520" rx="16" fill="#FAF8F5"/><text x="40" y="54" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="30" font-weight="bold" fill="#0B2026" text-anchor="start">Shallow versus deep copy</text><rect x="40" y="64" width="64" height="5" rx="2.5" fill="#FF5F46"/><text x="40" y="98" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="17" font-weight="normal" fill="#5F7281" text-anchor="start">A shallow copy shares nested objects. A deep copy duplicates everything</text><rect x="40" y="130" width="540" height="340" rx="14" fill="#FFE6E0" stroke="#FF5F46" stroke-width="2"/><path d="M40,170 L40,144 Q40,130 54,130 L566,130 Q580,130 580,144 L580,170 Z" fill="#FF5F46"/><text x="310.0" y="156.3" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="18" font-weight="bold" fill="#FFFFFF" text-anchor="middle">copy.copy(a): shared inner list</text><rect x="70" y="200" width="180" height="56" rx="12" fill="#FFFFFF" stroke="#FF5F46" stroke-width="2"/><text x="160.0" y="222.75" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="15" font-weight="bold" fill="#1B3139" text-anchor="middle">a</text><text x="160.0" y="243.0" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="15" font-weight="normal" fill="#1B3139" text-anchor="middle">{&#x27;items&#x27;: *}</text><rect x="70" y="330" width="180" height="56" rx="12" fill="#FFFFFF" stroke="#FF5F46" stroke-width="2"/><text x="160.0" y="352.75" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="15" font-weight="bold" fill="#1B3139" text-anchor="middle">b</text><text x="160.0" y="373.0" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-s