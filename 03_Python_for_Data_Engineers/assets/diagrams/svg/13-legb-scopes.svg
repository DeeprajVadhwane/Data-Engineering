<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="1200" height="520"><defs></defs><rect width="1200" height="520" rx="16" fill="#FAF8F5"/><text x="40" y="54" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="30" font-weight="bold" fill="#0B2026" text-anchor="start">LEGB: how Python finds a name</text><rect x="40" y="64" width="64" height="5" rx="2.5" fill="#FF5F46"/><text x="40" y="98" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="17" font-weight="normal" fill="#5F7281" text-anchor="start">Search from the inside out and stop at the first match</text><rect x="80" y="130" width="1040" height="360" rx="18" fill="#E8ECEF" stroke="#5F7281" stroke-width="3"/><text x="96" y="158" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="17" font-weight="bold" fill="#0B2026" text-anchor="start">Built-in: len, print, sum</text><rect x="130" y="170" width="940" height="300" rx="18" fill="#DCEBF7" stroke="#2272B4" stroke-width="3"/><text x="146" y="198" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="17" font-weight="bold" fill="#0B2026" text-anchor="start">Global: module level</text><rect x="180" y="210" width="840" height="240" rx="18" fill="#FFF3D6" stroke="#E8A317" stroke-width="3"/><text x="196" y="238" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="17" font-weight="bold" fill="#0B2026" text-anchor="start">Enclosing: outer function</text><rect x="230" y="250" width="740" height="180" rx="18" fill="#DDF1E7" stroke="#1B8A5A" stroke-width="3"/><text x="246" y="278" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="17" font-weight="bold" fill="#0B2026" text-anchor="start">Local: current function</text><text x="260" y="340" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="18" font-weight="bold" fill="#0B2026" text-anchor="start">Lookup order:  Local  -&gt;  Enclosing  -&gt;  Global  -&gt;  Built-in</text><text x="260" y="375" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="16" font-weight="normal" fill="#5F7281" text-anchor="start">global and nonlocal let a function rebind an outer name</text></svg>