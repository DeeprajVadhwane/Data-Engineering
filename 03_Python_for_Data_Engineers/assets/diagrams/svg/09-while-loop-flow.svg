<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="1200" height="520"><defs><marker id="ah0B2026" markerWidth="12" markerHeight="12" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L12,6 L0,12 z" fill="#0B2026"/></marker></defs><rect width="1200" height="520" rx="16" fill="#FAF8F5"/><text x="40" y="54" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="30" font-weight="bold" fill="#0B2026" text-anchor="start">A while loop</text><rect x="40" y="64" width="64" height="5" rx="2.5" fill="#FF5F46"/><text x="40" y="98" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="17" font-weight="normal" fill="#5F7281" text-anchor="start">Test the condition. If True run the body and test again. If False leave</text><rect x="80" y="250" width="170" height="70" rx="12" fill="#DCEBF7" stroke="#2272B4" stroke-width="2"/><text x="165.0" y="290.94" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="18" font-weight="bold" fill="#1B3139" text-anchor="middle">Start</text><line x1="252" y1="285" x2="340" y2="285" stroke="#0B2026" stroke-width="3" stroke-linecap="round" marker-end="url(#ah0B2026)"/><polygon points="480,210 620,285 480,360 340,285" fill="#FFE6E0" stroke="#FF5F46" stroke-width="3"/><text x="480" y="291" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="18" font-weight="bold" fill="#0B2026" text-anchor="middle">condition ?</text><line x1="620" y1="285" x2="740" y2="285" stroke="#0B2026" stroke-width="3" stroke-linecap="round" marker-end="url(#ah0B2026)"/><text x="680" y="272" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="15" font-weight="bold" fill="#1B8A5A" text-anchor="middle">True</text><rect x="745" y="250" width="220" height="70" rx="12" fill="#DDF1E7" stroke="#1B8A5A" stroke-width="2"/><text x="855.0" y="279.4" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="16" font-weight="bold" fill="#1B3139" text-anchor="middle">Run the body</text><text x="855.0" y="301.0" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="16" font-weight="normal" fill="#1B3139" text-anchor="middle">change something</text><line x1="855" y1="322" x2="855" y2="420" stroke="#0B2026" stroke-width="3" stroke-linecap="round"/><line x1="855" y1="420" x2="480" y2="420" stroke="#0B2026" stroke-width="3" stroke-linecap="round"/><line x1="480" y1="420" x2="480" y2="362" stroke="#0B2026" stroke-width="3" stroke-linecap="round" marker-end="url(#ah0B2026)"/><text x="670" y="445" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="15" font-weight="middle" fill="#5F7281" text-anchor="start">back to the test</text><line x1="480" y1="210" x2="480" y2="182" stroke="#0B2026" stroke-width="3" stroke-linecap="round" marker-end="url(#ah0B2026)"/><text x="498" y="188" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="15" font-weight="bold" fill="#D93A25" text-anchor="start">False</text><rect x="380" y="130" width="200" height="50" rx="12" fill="#E8ECEF" stroke="#5F7281" stroke-width="2"/><text x="480.0" y="160.61" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="17" font-weight="bold" fill="#1B3139" text-anchor="middle">Exit the loop</text><rect x="1000" y="250" width="150" height="36" rx="18.0" fill="#D93A25"/><text x="1075.0" y="272.9" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">break: leave now</text><rect x="1000" y="300" width="190" height="36" rx="18.0" fill="#E8A317"/><text x="1095.0" y="322.9" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">continue: next test</text></svg>