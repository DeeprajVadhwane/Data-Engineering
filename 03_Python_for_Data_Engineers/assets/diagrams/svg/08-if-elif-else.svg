<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420"><defs><marker id="ah0B2026" markerWidth="12" markerHeight="12" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L12,6 L0,12 z" fill="#0B2026"/></marker></defs><rect width="1200" height="420" rx="16" fill="#FAF8F5"/><text x="40" y="54" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="30" font-weight="bold" fill="#0B2026" text-anchor="start">if, elif, else</text><rect x="40" y="64" width="64" height="5" rx="2.5" fill="#FF5F46"/><text x="40" y="98" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="17" font-weight="normal" fill="#5F7281" text-anchor="start">Python checks the conditions in order and runs only the first block that is True</text><rect x="60" y="140" width="90" height="44" rx="22.0" fill="#1B8A5A"/><text x="105.0" y="168.65" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="19" font-weight="bold" fill="#FFFFFF" text-anchor="middle">if</text><rect x="170" y="140" width="380" height="44" rx="12" fill="#FFFFFF" stroke="#1B8A5A" stroke-width="2"/><text x="360.0" y="167.61" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="17" font-weight="normal" fill="#1B3139" text-anchor="middle">status == &#x27;completed&#x27;</text><line x1="552" y1="162" x2="640" y2="162" stroke="#0B2026" stroke-width="2.5" stroke-linecap="round" marker-end="url(#ah0B2026)"/><rect x="645" y="140" width="420" height="44" rx="12" fill="#FFFFFF" stroke="#1B8A5A" stroke-width="2"/><text x="855.0" y="167.61" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="17" font-weight="normal" fill="#1B3139" text-anchor="middle">count revenue</text><text x="110" y="202" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="13" font-weight="bold" fill="#5F7281" text-anchor="middle">False</text><rect x="60" y="206" width="90" height="44" rx="22.0" fill="#FF5F46"/><text x="105.0" y="234.65" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="19" font-weight="bold" fill="#FFFFFF" text-anchor="middle">elif</text><rect x="170" y="206" width="380" height="44" rx="12" fill="#FFFFFF" stroke="#FF5F46" stroke-width="2"/><text x="360.0" y="233.61" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="17" font-weight="normal" fill="#1B3139" text-anchor="middle">status == &#x27;cancelled&#x27;</text><line x1="552" y1="228" x2="640" y2="228" stroke="#0B2026" stroke-width="2.5" stroke-linecap="round" marker-end="url(#ah0B2026)"/><rect x="645" y="206" width="420" height="44" rx="12" fill="#FFFFFF" stroke="#FF5F46" stroke-width="2"/><text x="855.0" y="233.61" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="17" font-weight="normal" fill="#1B3139" text-anchor="middle">log and skip</text><text x="110" y="268" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="13" font-weight="bold" fill="#5F7281" text-anchor="middle">False</text><rect x="60" y="272" width="90" height="44" rx="22.0" fill="#E8A317"/><text x="105.0" y="300.65" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="19" font-weight="bold" fill="#FFFFFF" text-anchor="middle">elif</text><rect x="170" y="272" width="380" height="44" rx="12" fill="#FFFFFF" stroke="#E8A317" stroke-width="2"/><text x="360.0" y="299.61" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="17" font-weight="normal" fill="#1B3139" text-anchor="middle">status == &#x27;pending&#x27;</text><line x1="552" y1="294" x2="640" y2="294" stroke="#0B2026" stroke-width="2.5" stroke-linecap="round" marker-end="url(#ah0B2026)"/><rect x="645" y="272" width="420" height="44" rx="12" fill="#FFFFFF" stroke="#E8A317" stroke-width="2"/><text x="855.0" y="299.61" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="17" font-weight="normal" fill="#1B3139" text-anchor="middle">hold for later</text><text x="110" y="334" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="13" font-weight="bold" fill="#5F7281" text-anchor="middle">False</text><rect x="60" y="338" width="90" height="44" rx="22.0" fill="#D93A25"/><text x="105.0" y="366.65" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="19" font-weight="bold" fill="#FFFFFF" text-anchor="middle">else</text><rect x="170" y="338" width="380" height="44" rx="12" fill="#FFFFFF" stroke="#D93A25" stroke-width="2"/><text x="360.0" y="365.61" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="17" font-weight="normal" fill="#1B3139" text-anchor="middle">anything else</text><line x1="552" y1="360" x2="640" y2="360" stroke="#0B2026" stroke-width="2.5" stroke-linecap="round" marker-end="url(#ah0B2026)"/><rect x="645" y="338" width="420" height="44" rx="12" fill="#FFFFFF" stroke="#D93A25" stroke-width="2"/><text x="855.0" y="365.61" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="17" font-weight="normal" fill="#1B3139" text-anchor="middle">reject, reason: unknown status</text><text x="60" y="405" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="16" font-weight="normal" fill="#5F7281" text-anchor="start">Order matters: a later branch is only reached if every earlier condition was False.</text></svg>