y amount</text><text x="750.0" y="334.95" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="15" font-weight="normal" fill="#1B3139" text-anchor="middle">getter and setter</text><text x="750.0" y="355.2" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="15" font-weight="normal" fill="#1B3139" text-anchor="middle">validate before storing</text><text x="880" y="250.0" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="16" font-weight="normal" fill="#1B3139" text-anchor="start">Outside code</text><text x="880" y="271.6" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="16" font-weight="normal" fill="#1B3139" text-anchor="start">uses order.amount</text><text x="880" y="293.2" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="16" font-weight="normal" fill="#1B3139" text-anchor="start">never touches</text><text x="880" y="314.8" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="16" font-weight="normal" fill="#1B3139" text-anchor="start">the internal value</text><text x="880" y="336.4" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="16" font-weight="normal" fill="#1B3139" text-anchor="start">directly</text></svg>