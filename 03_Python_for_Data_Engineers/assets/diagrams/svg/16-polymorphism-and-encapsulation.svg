<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" width="1200" height="480"><defs><marker id="ah0B2026" markerWidth="12" markerHeight="12" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L12,6 L0,12 z" fill="#0B2026"/></marker></defs><rect width="1200" height="480" rx="16" fill="#FAF8F5"/><text x="40" y="54" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="30" font-weight="bold" fill="#0B2026" text-anchor="start">Polymorphism and encapsulation</text><rect x="40" y="64" width="64" height="5" rx="2.5" fill="#FF5F46"/><text x="40" y="98" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="17" font-weight="normal" fill="#5F7281" text-anchor="start">One call, many behaviours. Data guarded by methods</text><rect x="40" y="130" width="540" height="320" rx="14" fill="#DCEBF7" stroke="#2272B4" stroke-width="2"/><path d="M40,170 L40,144 Q40,130 54,130 L566,130 Q580,130 580,144 L580,170 Z" fill="#2272B4"/><text x="310.0" y="156.3" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="18" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Polymorphism</text><rect x="70" y="200" width="200" height="56" rx="12" fill="#FFFFFF" stroke="#2272B4" stroke-width="2"/><text x="170.0" y="233.61" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="17" font-weight="bold" fill="#1B3139" text-anchor="middle">pipeline</text><text x="70" y="285" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="18" font-weight="bold" fill="#2272B4" text-anchor="start">source.read()</text><rect x="360" y="190" width="190" height="50" rx="12" fill="#DDF1E7" stroke="#1B8A5A" stroke-width="2"/><text x="455.0" y="219.95" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="15" font-weight="bold" fill="#1B3139" text-anchor="middle">CsvSource.read()</text><line x1="272" y1="228" x2="358" y2="215" stroke="#0B2026" stroke-width="2" stroke-linecap="round" marker-end="url(#ah