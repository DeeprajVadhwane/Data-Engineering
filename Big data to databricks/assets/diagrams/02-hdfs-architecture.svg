<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" width="900" height="440" role="img" aria-label="HDFS architecture"><title>HDFS architecture</title><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5B6770"/></marker></defs><rect width="900" height="440" fill="#FFFFFF"/><text x="450.0" y="34" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="bold" fill="#0B3C5D" text-anchor="middle">HDFS: one NameNode, many DataNodes</text><rect x="320" y="60" width="260" height="80" rx="10" fill="#FDF1E2" stroke="#F28C28" stroke-width="1.5"/><text x="450.0" y="86.55" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#0B3C5D" text-anchor="middle">NameNode (the librarian)</text><text x="450.0" y="104.55" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#0B3C5D" text-anchor="middle">file names, folders,</text><text x="450.0" y="122.55" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#0B3C5D" text-anchor="middle">which block lives where</text><text x="595" y="105" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#5B6770" text-anchor="start">metadata only, no file data</text><line x1="450" y1="140" x2="135" y2="215" stroke="#5B6770" stroke-width="2" stroke-dasharray="4 3" marker-end="url(#arr)"/><rect x="40" y="215" width="190" height="165" rx="10" fill="#FFFFFF" stroke="#1D70B8" stroke-width="1.5"/><text x="135" y="240" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#0B3C5D" text-anchor="middle">DataNode 1</text><rect x="60" y="258" width="150" height="46" rx="10" fill="#E8F1FA" stroke="#1D70B8" stroke-width="1.5"/><text x="135.0" y="285.55" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#0B3C5D" text-anchor="middle">Block 1 (128 MB)</text><rect x="60" y="316" width="150" height="46" rx="10" fill="#F2F2F2" stroke="#5B6770" stroke-width="1.5" stroke-dasharray="4 3"/><text x="135.0" y="343.55" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#0B3C5D" text-anchor="middle">Block 4' (replica)</text><line x1="450" y1="140" x2="345" y2="215" stroke="#5B6770" stroke-width="2" stroke-dasharray="4 3" marker-end="url(#arr)"/><rect x="250" y="215" width="190" height="165" rx="10" fill="#FFFFFF" stroke="#1D70B8" stroke-width="1.5"/><text x="345" y="240" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#0B3C5D" text-anchor="middle">DataNode 2</text><rect x="270" y="258" width="150" height="46" rx="10" fill="#E8F1FA" stroke="#1D70B8" stroke-width="1.5"/><text x="345.0" y="285.55" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#0B3C5D" text-anchor="middle">Block 2 (128 MB)</text><rect x="270" y="316" width="150" height="46" rx="10" fill="#F2F2F2" stroke="#5B6770" stroke-width="1.5" stroke-dasharray="4 3"/><text x="345.0" y="343.55" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#0B3C5D" text-anchor="middle">Block 1' (replica)</text><line x1="450" y1="140" x2="555" y2="215" stroke="#5B6770" stroke-width="2" stroke-dasharray="4 3" marker-end="url(#arr)"/><rect x="460" y="215" width="190" height="165" rx="10" fill="#FFFFFF" stroke="#1D70B8" stroke-width="1.5"/><text x="555" y="240" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#0B3C5D" text-anchor="middle">DataNode 3</text><rect x="480" y="258" width="150" height="46" rx="10" fill="#E8F1FA" stroke="#1D70B8" stroke-width="1.5"/><text x="555.0" y="285.55" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#0B3C5D" text-anchor="middle">Block 3 (128 MB)</text><rect x="480" y="316" width="150" height="46" rx="10" fill="#F2F2F2" stroke="#5B6770" stroke-width="1.5" stroke-dasharray="4 3"/><text x="555.0" y="343.55" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#0B3C5D" text-anchor="middle">Block 2' (replica)</text><line x1="450" y1="140" x2="765" y2="215" stroke="#5B6770" stroke-width="2" stroke-dasharray="4 3" marker-end="url(#arr)"/><rect x="670" y="215" width="190" height="165" rx="10" fill="#FFFFFF" stroke="#1D70B8" stroke-width="1.5"/><text x="765" y="240" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#0B3C5D" text-anchor="middle">DataNode 4</text><rect x="690" y="258" width="150" height="46" rx="10" fill="#E8F1FA" stroke="#1D70B8" stroke-width="1.5"/><text x="765.0" y="285.55" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#0B3C5D" text-anchor="middle">Block 4 (128 MB)</text><rect x="690" y="316" width="150" height="46" rx="10" fill="#F2F2F2" stroke="#5B6770" stroke-width="1.5" stroke-dasharray="4 3"/><text x="765.0" y="343.55" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#0B3C5D" text-anchor="middle">Block 3' (replica)</text><text x="450" y="410" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#5B6770" text-anchor="middle">A 512 MB file is split into four 128 MB blocks; each block is copied to other DataNodes (replication)</text></svg>