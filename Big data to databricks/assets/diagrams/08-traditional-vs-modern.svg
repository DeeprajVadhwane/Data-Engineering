<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 470" width="980" height="470" role="img" aria-label="Traditional versus modern data architecture"><title>Traditional versus modern data architecture</title><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5B6770"/></marker></defs><rect width="980" height="470" fill="#FFFFFF"/><text x="490.0" y="34" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="bold" fill="#0B3C5D" text-anchor="middle">Traditional approach vs modern approach</text><rect x="20" y="60" width="450" height="380" rx="10" fill="#FFF8F0" stroke="#F28C28" stroke-width="1.5" stroke-dasharray="6 4"/><rect x="510" y="60" width="450" height="380" rx="10" fill="#F0FAF4" stroke="#2E8B57" stroke-width="1.5" stroke-dasharray="6 4"/><text x="245" y="90" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" fill="#F28C28" text-anchor="middle">TRADITIONAL</text><text x="735" y="90" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" fill="#2E8B57" text-anchor="middle">MODERN</text><rect x="50" y="115" width="390" height="58" rx="10" fill="#FFFFFF" stroke="#F28C28" stroke-width="1.5"/><text x="245.0" y="139.55" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#0B3C5D" text-anchor="middle">Data sources</text><text x="245.0" y="157.55" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#0B3C5D" text-anchor="middle">files, databases, applications</text><rect x="540" y="115" width="390" height="58" rx="10" fill="#FFFFFF" stroke="#2E8B57" stroke-width="1.5"/><text x="735.0" y="139.55" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#0B3C5D" text-anchor="middle">Data sources</text><text x="735.0" y="157.55" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#0B3C5D" text-anchor="middle">apps, events, logs, IoT, files</text><line x1="245" y1="175" x2="245" y2="192" stroke="#F28C28" stroke-width="2" marker-end="url(#arr)"/><line x1="735" y1="175" x2="735" y2="192" stroke="#2E8B57" stroke-width="2" marker-end="url(#arr)"/><rect x="50" y="195" width="390" height="58" rx="10" fill="#FFFFFF" stroke="#F28C28" stroke-width="1.5"/><text x="245.0" y="219.55" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#0B3C5D" text-anchor="middle">Nightly ETL jobs</text><text x="245.0" y="237.55" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#0B3C5D" text-anchor="middle">fixed schema, scheduled batches</text><rect x="540" y="195" width="390" height="58" rx="10" fill="#FFFFFF" stroke="#2E8B57" stroke-width="1.5"/><text x="735.0" y="219.55" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#0B3C5D" text-anchor="middle">Cloud object storage + Delta Lake</text><text x="735.0" y="237.55" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#0B3C5D" text-anchor="middle">cheap, elastic, reliable tables</text><line x1="245" y1="255" x2="245" y2="272" stroke="#F28C28" stroke-width="2" marker-end="url(#arr)"/><line x1="735" y1="255" x2="735" y2="272" stroke="#2E8B57" stroke-width="2" marker-end="url(#arr)"/><rect x="50" y="275" width="390" height="58" rx="10" fill="#FFFFFF" stroke="#F28C28" stroke-width="1.5"/><text x="245.0" y="299.55" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#0B3C5D" text-anchor="middle">One server / warehouse</text><text x="245.0" y="317.55" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#0B3C5D" text-anchor="middle">storage and compute tied together</text><rect x="540" y="275" width="390" height="58" rx="10" fill="#FFFFFF" stroke="#2E8B57" stroke-width="1.5"/><text x="735.0" y="299.55" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#0B3C5D" text-anchor="middle">Distributed compute (Spark)</text><text x="735.0" y="317.55" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#0B3C5D" text-anchor="middle">scaled up or down on demand</text><line x1="245" y1="335" x2="245" y2="352" stroke="#F28C28" stroke-width="2" marker-end="url(#arr)"/><line x1="735" y1="335" x2="735" y2="352" stroke="#2E8B57" stroke-width="2" marker-end="url(#arr)"/><rect x="50" y="355" width="390" height="58" rx="10" fill="#FFFFFF" stroke="#F28C28" stroke-width="1.5"/><text x="245.0" y="379.55" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#0B3C5D" text-anchor="middle">Reports</text><text x="245.0" y="397.55" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#0B3C5D" text-anchor="middle">mostly structured, historical</text><rect x="540" y="355" width="390" height="58" rx="10" fill="#FFFFFF" stroke="#2E8B57" stroke-width="1.5"/><text x="735.0" y="379.55" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#0B3C5D" text-anchor="middle">Bronze → Silver → Gold</text><text x="735.0" y="397.55" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#0B3C5D" text-anchor="middle">SQL, BI, ML and AI on one platform</text><text x="245" y="425" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#5B6770" text-anchor="middle">Scale up, plan capacity, manage hardware</text><text x="735" y="425" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#5B6770" text-anchor="middle">Scale out, pay for use, managed platform</text></svg>