<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" width="900" height="420" role="img" aria-label="Vertical versus horizontal scaling"><title>Vertical versus horizontal scaling</title><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5B6770"/></marker></defs><rect width="900" height="420" fill="#FFFFFF"/><text x="450.0" y="34" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="bold" fill="#0B3C5D" text-anchor="middle">Scaling up vs scaling out</text><rect x="30" y="60" width="410" height="330" rx="10" fill="#FFF8F0" stroke="#F28C28" stroke-width="1.5" stroke-dasharray="6 4"/><rect x="460" y="60" width="410" height="330" rx="10" fill="#F0FAF4" stroke="#2E8B57" stroke-width="1.5" stroke-dasharray="6 4"/><text x="235" y="90" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" fill="#F28C28" text-anchor="middle">Vertical scaling (scale up)</text><text x="665" y="90" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" fill="#2E8B57" text-anchor="middle">Horizontal scaling (scale out)</text><rect x="60" y="190" width="100" height="70" rx="10" fill="#FFFFFF" stroke="#F28C28" stroke-width="1.5"/><text x="110.0" y="211.55" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#0B3C5D" text-anchor="middle">1 server</text><text x="110.0" y="229.55" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#0B3C5D" text-anchor="middle">8 cores</text><text x="110.0" y="247.55" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#0B3C5D" text-anchor="middle">32 GB</text><line x1="170" y1="225" x2="235" y2="225" stroke="#F28C28" stroke-width="2" marker-end="url(#arr)"/><rect x="245" y="130" width="170" height="190" rx="10" fill="#FFFFFF" stroke="#F28C28" stroke-width="1.5"/><text x="330.0" y="201.4" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#0B3C5D" text-anchor="middle">1 BIGGER server</text><text x="330.0" y="220.4" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#0B3C5D" text-anchor="middle">64 cores</text><text x="330.0" y="239.4" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#0B3C5D" text-anchor="middle">512 GB RAM</text><text x="330.0" y="258.4" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#0B3C5D" text-anchor="middle">20 TB disk</text><text x="235" y="345" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#5B6770" text-anchor="middle">Costly, has a hard ceiling, single point of failure</text><rect x="480" y="190" width="90" height="70" rx="10" fill="#FFFFFF" stroke="#2E8B57" stroke-width="1.5"/><text x="525.0" y="211.55" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#0B3C5D" text-anchor="middle">1 server</text><text x="525.0" y="229.55" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#0B3C5D" text-anchor="middle">8 cores</text><text x="525.0" y="247.55" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#0B3C5D" text-anchor="middle">32 GB</text><line x1="578" y1="225" x2="625" y2="225" stroke="#2E8B57" stroke-width="2" marker-end="url(#arr)"/><rect x="640" y="125" width="100" height="90" rx="10" fill="#FFFFFF" stroke="#2E8B57" stroke-width="1.5"/><text x="690.0" y="156.55" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#0B3C5D" text-anchor="middle">Server 1</text><text x="690.0" y="174.55" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#0B3C5D" text-anchor="middle">8 cores</text><text x="690.0" y="192.55" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#0B3C5D" text-anchor="middle">32 GB</text><rect x="755" y="125" width="100" height="90" rx="10" fill="#FFFFFF" stroke="#2E8B57" stroke-width="1.5"/><text x="805.0" y="156.55" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#0B3C5D" text-anchor="middle">Server 2</text><text x="805.0" y="174.55" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#0B3C5D" text-anchor="middle">8 cores</text><text x="805.0" y="192.55" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#0B3C5D" text-anchor="middle">32 GB</text><rect x="640" y="235" width="100" height="90" rx="10" fill="#FFFFFF" stroke="#2E8B57" stroke-width="1.5"/><text x="690.0" y="266.55" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#0B3C5D" text-anchor="middle">Server 3</text><text x="690.0" y="284.55" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#0B3C5D" text-anchor="middle">8 cores</text><text x="690.0" y="302.55" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#0B3C5D" text-anchor="middle">32 GB</text><rect x="755" y="235" width="100" height="90" rx="10" fill="#FFFFFF" stroke="#2E8B57" stroke-width="1.5"/><text x="805.0" y="266.55" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#0B3C5D" text-anchor="middle">Server 4</text><text x="805.0" y="284.55" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#0B3C5D" text-anchor="middle">8 cores</text><text x="805.0" y="302.55" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#0B3C5D" text-anchor="middle">32 GB</text><text x="665" y="345" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#5B6770" text-anchor="middle">Cheaper hardware, scales further, survives failures</text></svg>