<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 360" width="980" height="360" role="img" aria-label="Medallion architecture"><title>Medallion architecture</title><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5B6770"/></marker></defs><rect width="980" height="360" fill="#FFFFFF"/><text x="490.0" y="34" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="bold" fill="#0B3C5D" text-anchor="middle">Medallion architecture: Bronze → Silver → Gold</text><rect x="20" y="120" width="150" height="110" rx="10" fill="#F2F2F2" stroke="#5B6770" stroke-width="1.5"/><text x="95.0" y="161.55" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#0B3C5D" text-anchor="middle">Sources</text><text x="95.0" y="179.55" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#0B3C5D" text-anchor="middle">CSV, JSON, APIs,</text><text x="95.0" y="197.55" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#0B3C5D" text-anchor="middle">databases</text><rect x="215" y="105" width="170" height="140" rx="10" fill="#FBEFE3" stroke="#CD7F32" stroke-width="1.5"/><text x="300.0" y="170.4" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#0B3C5D" text-anchor="middle">BRONZE</text><text x="300.0" y="189.4" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#0B3C5D" text-anchor="middle">Raw data as ingested</text><rect x="415" y="105" width="170" height="140" rx="10" fill="#EEF1F4" stroke="#6D7885" stroke-width="1.5"/><text x="500.0" y="170.4" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#0B3C5D" text-anchor="middle">SILVER</text><text x="500.0" y="189.4" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#0B3C5D" text-anchor="middle">Cleaned &amp; validated</text><rect x="615" y="105" width="170" height="140" rx="10" fill="#FCF5DC" stroke="#D4A017" stroke-width="1.5"/><text x="700.0" y="170.4" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#0B3C5D" text-anchor="middle">GOLD</text><text x="700.0" y="189.4" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#0B3C5D" text-anchor="middle">Business-ready tables</text><rect x="815" y="70" width="150" height="55" rx="10" fill="#E8F1FA" stroke="#1D70B8" stroke-width="1.5"/><text x="890.0" y="102.05" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#0B3C5D" text-anchor="middle">Dashboards</text><rect x="815" y="140" width="150" height="55" rx="10" fill="#E8F1FA" stroke="#1D70B8" stroke-width="1.5"/><text x="890.0" y="172.05" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#0B3C5D" text-anchor="middle">SQL analytics</text><rect x="815" y="210" width="150" height="55" rx="10" fill="#E8F1FA" stroke="#1D70B8" stroke-width="1.5"/><text x="890.0" y="242.05" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#0B3C5D" text-anchor="middle">ML / AI</text><line x1="172" y1="175" x2="212" y2="175" stroke="#5B6770" stroke-width="2" marker-end="url(#arr)"/><line x1="387" y1="175" x2="412" y2="175" stroke="#5B6770" stroke-width="2" marker-end="url(#arr)"/><line x1="587" y1="175" x2="612" y2="175" stroke="#5B6770" stroke-width="2" marker-end="url(#arr)"/><line x1="787" y1="175" x2="812" y2="97" stroke="#5B6770" stroke-width="2" marker-end="url(#arr)"/><line x1="787" y1="175" x2="812" y2="167" stroke="#5B6770" stroke-width="2" marker-end="url(#arr)"/><line x1="787" y1="175" x2="812" y2="237" stroke="#5B6770" stroke-width="2" marker-end="url(#arr)"/><text x="300" y="275" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#5B6770" text-anchor="middle">append-only</text><text x="500" y="275" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#5B6770" text-anchor="middle">dedupe, fix nulls,</text><text x="500" y="292" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#5B6770" text-anchor="middle">cast types</text><text x="700" y="275" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#5B6770" text-anchor="middle">aggregate, join</text><text x="490" y="335" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#5B6770" text-anchor="middle">Each layer is a set of Delta tables governed by Unity Catalog.</text></svg>