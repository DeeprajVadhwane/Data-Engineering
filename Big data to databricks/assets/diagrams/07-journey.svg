<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 330" width="1000" height="330" role="img" aria-label="From single machine to Databricks"><title>From single machine to Databricks</title><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5B6770"/></marker></defs><rect width="1000" height="330" fill="#FFFFFF"/><text x="500.0" y="34" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="bold" fill="#0B3C5D" text-anchor="middle">The journey: one machine → Databricks</text><rect x="20" y="110" width="100" height="100" rx="10" fill="#FFFFFF" stroke="#5B6770" stroke-width="2.5"/><text x="70" y="140" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="bold" fill="#5B6770" text-anchor="middle">1</text><text x="70" y="170" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#0B3C5D" text-anchor="middle">Single</text><text x="70" y="188" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#0B3C5D" text-anchor="middle">machine</text><line x1="122" y1="160" x2="128" y2="160" stroke="#5B6770" stroke-width="2" marker-end="url(#arr)"/><rect x="128" y="110" width="100" height="100" rx="10" fill="#FFFFFF" stroke="#F28C28" stroke-width="2.5"/><text x="178" y="140" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="bold" fill="#F28C28" text-anchor="middle">2</text><text x="178" y="170" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#0B3C5D" text-anchor="middle">Vertical</text><text x="178" y="188" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#0B3C5D" text-anchor="middle">scaling</text><line x1="230" y1="160" x2="236" y2="160" stroke="#5B6770" stroke-width="2" marker-end="url(#arr)"/><rect x="236" y="110" width="100" height="100" rx="10" fill="#FFFFFF" stroke="#2E8B57" stroke-width="2.5"/><text x="286" y="140" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="bold" fill="#2E8B57" text-anchor="middle">3</text><text x="286" y="170" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#0B3C5D" text-anchor="middle">Horizontal</text><text x="286" y="188" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#0B3C5D" text-anchor="middle">scaling</text><line x1="338" y1="160" x2="344" y2="160" stroke="#5B6770" stroke-width="2" marker-end="url(#arr)"/><rect x="344" y="110" width="100" height="100" rx="10" fill="#FFFFFF" stroke="#2E8B57" stroke-width="2.5"/><text x="394" y="140" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="bold" fill="#2E8B57" text-anchor="middle">4</text><text x="394" y="170" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#0B3C5D" text-anchor="middle">Distributed</text><text x="394" y="188" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#0B3C5D" text-anchor="middle">computing</text><line x1="446" y1="160" x2="452" y2="160" stroke="#5B6770" stroke-width="2" marker-end="url(#arr)"/><rect x="452" y="110" width="100" height="100" rx="10" fill="#FFFFFF" stroke="#1D70B8" stroke-width="2.5"/><text x="502" y="140" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="bold" fill="#1D70B8" text-anchor="middle">5</text><text x="502" y="170" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#0B3C5D" text-anchor="middle">HDFS</text><line x1="554" y1="160" x2="560" y2="160" stroke="#5B6770" stroke-width="2" marker-end="url(#arr)"/><rect x="560" y="110" width="100" height="100" rx="10" fill="#FFFFFF" stroke="#1D70B8" stroke-width="2.5"/><text x="610" y="140" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="bold" fill="#1D70B8" text-anchor="middle">6</text><text x="610" y="170" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#0B3C5D" text-anchor="middle">MapReduce</text><line x1="662" y1="160" x2="668" y2="160" stroke="#5B6770" stroke-width="2" marker-end="url(#arr)"/><rect x="668" y="110" width="100" height="100" rx="10" fill="#FFFFFF" stroke="#6C4AB6" stroke-width="2.5"/><text x="718" y="140" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="bold" fill="#6C4AB6" text-anchor="middle">7</text><text x="718" y="170" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#0B3C5D" text-anchor="middle">Spark</text><line x1="770" y1="160" x2="776" y2="160" stroke="#5B6770" stroke-width="2" marker-end="url(#arr)"/><rect x="776" y="110" width="100" height="100" rx="10" fill="#FFFFFF" stroke="#6C4AB6" stroke-width="2.5"/><text x="826" y="140" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="bold" fill="#6C4AB6" text-anchor="middle">8</text><text x="826" y="170" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#0B3C5D" text-anchor="middle">PySpark</text><line x1="878" y1="160" x2="884" y2="160" stroke="#5B6770" stroke-width="2" marker-end="url(#arr)"/><rect x="884" y="110" width="100" height="100" rx="10" fill="#FFFFFF" stroke="#C0392B" stroke-width="2.5"/><text x="934" y="140" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="bold" fill="#C0392B" text-anchor="middle">9</text><text x="934" y="170" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#0B3C5D" text-anchor="middle">Databricks</text><text x="500" y="260" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#5B6770" text-anchor="middle">Each step fixes a limitation of the previous one.</text></svg>