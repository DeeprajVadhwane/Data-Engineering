<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 300" width="980" height="300" role="img" aria-label="The five Vs of Big Data"><title>The five Vs of Big Data</title><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5B6770"/></marker></defs><rect width="980" height="300" fill="#FFFFFF"/><text x="490.0" y="34" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="bold" fill="#0B3C5D" text-anchor="middle">The 5 Vs of Big Data</text><rect x="20" y="70" width="175" height="180" rx="10" fill="#FFFFFF" stroke="#1D70B8" stroke-width="2.5"/><rect x="20" y="70" width="175" height="50" rx="10" fill="#1D70B8" stroke="#1D70B8" stroke-width="1.5"/><text x="107" y="103" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Volume</text><text x="107" y="160" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#0B3C5D" text-anchor="middle">How much data</text><text x="107" y="195" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#5B6770" text-anchor="middle">billions of records</text><rect x="210" y="70" width="175" height="180" rx="10" fill="#FFFFFF" stroke="#F28C28" stroke-width="2.5"/><rect x="210" y="70" width="175" height="50" rx="10" fill="#F28C28" stroke="#F28C28" stroke-width="1.5"/><text x="297" y="103" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Velocity</text><text x="297" y="160" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#0B3C5D" text-anchor="middle">How fast it arrives</text><text x="297" y="195" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#5B6770" text-anchor="middle">millisecond decisions</text><rect x="400" y="70" width="175" height="180" rx="10" fill="#FFFFFF" stroke="#2E8B57" stroke-width="2.5"/><rect x="400" y="70" width="175" height="50" rx="10" fill="#2E8B57" stroke="#2E8B57" stroke-width="1.5"/><text x="487" y="103" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Variety</text><text x="487" y="160" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#0B3C5D" text-anchor="middle">Different formats</text><text x="487" y="195" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#5B6770" text-anchor="middle">tables, JSON, images</text><rect x="590" y="70" width="175" height="180" rx="10" fill="#FFFFFF" stroke="#C0392B" stroke-width="2.5"/><rect x="590" y="70" width="175" height="50" rx="10" fill="#C0392B" stroke="#C0392B" stroke-width="1.5"/><text x="677" y="103" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Veracity</text><text x="677" y="160" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#0B3C5D" text-anchor="middle">How trustworthy</text><text x="677" y="195" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#5B6770" text-anchor="middle">duplicates, gaps, errors</text><rect x="780" y="70" width="175" height="180" rx="10" fill="#FFFFFF" stroke="#6C4AB6" stroke-width="2.5"/><rect x="780" y="70" width="175" height="50" rx="10" fill="#6C4AB6" stroke="#6C4AB6" stroke-width="1.5"/><text x="867" y="103" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Value</text><text x="867" y="160" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#0B3C5D" text-anchor="middle">Business benefit</text><text x="867" y="195" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#5B6770" text-anchor="middle">insight, revenue, retention</text></svg>