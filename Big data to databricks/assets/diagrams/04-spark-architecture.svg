ont-size="13" font-weight="normal" fill="#0B3C5D" text-anchor="middle">runs tasks, caches data</text><rect x="630" y="338" width="55" height="40" rx="10" fill="#E8F1FA" stroke="#1D70B8" stroke-width="1.5"/><text x="657.5" y="362.2" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#0B3C5D" text-anchor="middle">Task</text><rect x="697" y="338" width="55" height="40" rx="10" fill="#E8F1FA" stroke="#1D70B8" stroke-width="1.5"/><text x="724.5" y="362.2" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#0B3C5D" text-anchor="middle">Task</text><rect x="764" y="338" width="55" height="40" rx="10" fill="#E8F1FA" stroke="#1D70B8" stroke-width="1.5"/><text x="791.5" y="362.2" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#0B3C5D" text-anchor="middle">Task</text><text x="450" y="435" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#5B6770" text-anchor="middle">Each task processes one partition of the data. Results flow back to the driver or are written to storage.</text></svg>