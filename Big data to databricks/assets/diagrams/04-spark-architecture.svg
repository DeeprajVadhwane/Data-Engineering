<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" width="900" height="470" role="img" aria-label="Spark architecture"><title>Spark architecture</title><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5B6770"/></marker></defs><rect width="900" height="470" fill="#FFFFFF"/><text x="450.0" y="34" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="bold" fill="#0B3C5D" text-anchor="middle">Spark architecture: driver, cluster manager, executors</text><rect x="60" y="70" width="230" height="90" rx="10" fill="#E8F1FA" stroke="#1D70B8" stroke-width="1.5"/><text x="175.0" y="110.4" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#0B3C5D" text-anchor="middle">Your code</text><text x="175.0" y="129.4" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#0B3C5D" text-anchor="middle">PySpark / SQL notebook</text><rect x="335" y="70" width="230" height="90" rx="10" fill="#FDF1E2" stroke="#F28C28" stroke-width="1.5"/><text x="450.0" y="110.4" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#0B3C5D" text-anchor="middle">Driver</text><text x="450.0" y="129.4" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#0B3C5D" text-anchor="middle">plans the job, schedules tasks</text><rect x="610" y="70" width="230" height="90" rx="10" fill="#EFE9FB" stroke="#6C4AB6" stroke-width="1.5"/><text x="725.0" y="110.4" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#0B3C5D" text-anchor="middle">Cluster manager</text><text x="725.0" y="129.4" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#0B3C5D" text-anchor="middle">allocates machines &amp; resources</text><line x1="290" y1="115" x2="332" y2="115" stroke="#5B6770" stroke-width="2" marker-end="url(#arr)"