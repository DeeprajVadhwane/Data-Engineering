<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 400" width="980" height="400" role="img" aria-label="Lakehouse architecture"><title>Lakehouse architecture</title><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5B6770"/></marker></defs><rect width="980" height="400" fill="#FFFFFF"/><text x="490.0" y="34" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="bold" fill="#0B3C5D" text-anchor="middle">Data lake + data warehouse = lakehouse</text><rect x="30" y="90" width="230" height="130" rx="10" fill="#FFF8F0" stroke="#F28C28" stroke-width="1.5"/><text x="145.0" y="141.55" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#0B3C5D" text-anchor="middle">Data lake</text><text x="145.0" y="159.55" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#0B3C5D" text-anchor="middle">any format, cheap storage,</text><text x="145.0" y="177.55" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#0B3C5D" text-anchor="middle">weak reliability</text><rect x="30" y="240" width="230" height="100" rx="10" fill="#EFE9FB" stroke="#6C4AB6" stroke-width="1.5"/><text x="145.0" y="276.55" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#0B3C5D" text-anchor="middle">Data warehouse</text><text x="145.0" y="294.55" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#0B3C5D" text-anchor="middle">structured, fast SQL,</text><text x="145.0" y="312.55" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#0B3C5D" text-anchor="middle">rigid and costly</text><line x1="262" y1="155" x2="332" y2="190" stroke="#5B6770" stroke-width="2" marker-end="url(#arr)"/><line x1="262" y1="290" x2="332" y2="230" stroke="#5B6770" stroke-width="2" marker-end="url(#arr)"/><rect x="335" y="75" width="615" height="280" rx="10" fill="#F0FAF4" stroke="#2E8B57" stroke-width="1.5" stroke-dasharray="6 4"/><text x="642" y="102" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#2E8B57" text-anchor="middle">LAKEHOUSE</text><rect x="360" y="120" width="565" height="52" rx="10" fill="#FFFFFF" stroke="#1D70B8" stroke-width="1.5"/><text x="642.5" y="141.55" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#0B3C5D" text-anchor="middle">Consumers</text><text x="642.5" y="159.55" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#0B3C5D" text-anchor="middle">Databricks SQL · dashboards · machine learning · AI</text><rect x="360" y="182" width="565" height="44" rx="10" fill="#FFFFFF" stroke="#1D70B8" stroke-width="1.5"/><text x="642.5" y="199.55" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#0B3C5D" text-anchor="middle">Governance (Unity Catalog)</text><text x="642.5" y="217.55" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#0B3C5D" text-anchor="middle">access control · lineage · discovery</text><rect x="360" y="236" width="565" height="44" rx="10" fill="#FFFFFF" stroke="#1D70B8" stroke-width="1.5"/><text x="642.5" y="253.55" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#0B3C5D" text-anchor="middle">Delta Lake</text><text x="642.5" y="271.55" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#0B3C5D" text-anchor="middle">ACID transactions · schema control · time travel</text><rect x="360" y="290" width="565" height="44" rx="10" fill="#FFFFFF" stroke="#1D70B8" stroke-width="1.5"/><text x="642.5" y="307.55" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#0B3C5D" text-anchor="middle">Cloud object storage</text><text x="642.5" y="325.55" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#0B3C5D" text-anchor="middle">Amazon S3 · Azure Data Lake Storage · Google Cloud Storage</text></svg>