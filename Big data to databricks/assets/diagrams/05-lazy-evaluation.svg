<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 330" width="980" height="330" role="img" aria-label="Lazy evaluation flow"><title>Lazy evaluation flow</title><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5B6770"/></marker></defs><rect width="980" height="330" fill="#FFFFFF"/><text x="490.0" y="34" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="bold" fill="#0B3C5D" text-anchor="middle">Lazy evaluation: nothing runs until an action</text><rect x="20" y="110" width="140" height="80" rx="10" fill="#E8F1FA" stroke="#1D70B8" stroke-width="1.5"/><text x="90.0" y="145.55" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#0B3C5D" text-anchor="middle">read()</text><text x="90.0" y="163.55" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#0B3C5D" text-anchor="middle">transformation</text><line x1="162" y1="150" x2="178" y2="150" stroke="#5B6770" stroke-width="2" marker-end="url(#arr)"/><rect x="180" y="110" width="140" height="80" rx="10" fill="#E8F1FA" stroke="#1D70B8" stroke-width="1.5"/><text x="250.0" y="145.55" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#0B3C5D" text-anchor="middle">filter()</text><text x="250.0" y="163.55" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#0B3C5D" text-anchor="middle">transformation</text><line x1="322" y1="150" x2="338" y2="150" stroke="#5B6770" stroke-width="2" marker-end="url(#arr)"/><rect x="340" y="110" width="140" height="80" rx="10" fill="#E8F1FA" stroke="#1D70B8" stroke-width="1.5"/><text x="410.0" y="145.55" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#0B3C5D" text-anchor="middle">select()</text><text x="410.0" y="163.55" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#0B3C5D" text-anchor="middle">transformation</text><line x1="482" y1="150" x2="498" y2="150" stroke="#5B6770" stroke-width="2" marker-end="url(#arr)"/><rect x="500" y="110" width="140" height="80" rx="10" fill="#EFE9FB" stroke="#6C4AB6" stroke-width="1.5"/><text x="570.0" y="145.55" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#0B3C5D" text-anchor="middle">Logical plan</text><text x="570.0" y="163.55" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#0B3C5D" text-anchor="middle">recorded, not run</text><line x1="642" y1="150" x2="658" y2="150" stroke="#5B6770" stroke-width="2" marker-end="url(#arr)"/><rect x="660" y="110" width="140" height="80" rx="10" fill="#FDE8E6" stroke="#C0392B" stroke-width="1.5"/><text x="730.0" y="145.55" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#0B3C5D" text-anchor="middle">count() / display()</text><text x="730.0" y="163.55" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#0B3C5D" text-anchor="middle">ACTION</text><line x1="802" y1="150" x2="818" y2="150" stroke="#5B6770" stroke-width="2" marker-end="url(#arr)"/><rect x="820" y="110" width="140" height="80" rx="10" fill="#E6F5EC" stroke="#2E8B57" stroke-width="1.5"/><text x="890.0" y="145.55" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#0B3C5D" text-anchor="middle">Optimise + run</text><text x="890.0" y="163.55" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#0B3C5D" text-anchor="middle">tasks on executors</text><text x="250" y="235" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#1D70B8" text-anchor="middle">Build the plan (instant)</text><text x="810" y="235" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#2E8B57" text-anchor="middle">Execute the plan (real work)</text><text x="490" y="285" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#5B6770" text-anchor="middle">Because Spark sees the whole plan first, it can reorder and combine steps efficiently.</text></svg>