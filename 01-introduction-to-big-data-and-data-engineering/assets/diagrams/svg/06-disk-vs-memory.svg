<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" width="1200" height="620"><defs><marker id="ahFF5F46" markerWidth="12" markerHeight="12" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L12,6 L0,12 z" fill="#FF5F46"/></marker><marker id="ah2272B4" markerWidth="12" markerHeight="12" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L12,6 L0,12 z" fill="#2272B4"/></marker></defs><rect width="1200" height="620" rx="16" fill="#FAF8F5"/><text x="40" y="54" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="30" font-weight="bold" fill="#0B2026" text-anchor="start">Why Spark Is Faster Than Hadoop MapReduce</text><rect x="40" y="64" width="64" height="5" rx="2.5" fill="#FF5F46"/><text x="40" y="98" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="17" font-weight="normal" fill="#5F7281" text-anchor="start">Hadoop writes to disk after every step. Spark keeps data in memory between steps.</text><text x="40" y="150" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="21" font-weight="bold" fill="#2272B4" text-anchor="start">Hadoop MapReduce  (disk-based)</text><rect x="40" y="170" width="130" height="56" rx="10" fill="#DCEBF7" stroke="#2272B4" stroke-width="2"/><text x="105" y="205" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="18" font-weight="bold" fill="#0B2026" text-anchor="middle">Read</text><line x1="174" y1="198" x2="326" y2="198" stroke="#2272B4" stroke-width="3" stroke-linecap="round" marker-end="url(#ah2272B4)"/><rect x="222" y="232" width="40" height="40" rx="8" fill="#FFFFFF" stroke="#0B2026" stroke-width="2"/><circle cx="242.0" cy="252.0" r="12.0" fill="#E8ECEF" stroke="#0B2026" stroke-width="1.5"/><circle cx="242.0" cy="252.0" r="2.8000000000000003" fill="#0B2026"/><line x1="242.0" y1="252.0" x2="254.0" y2="240.8" stroke="#0B2026" stroke-width="2" stroke-linecap="round"/><text x="242" y="292" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="13" font-weight="bold" fill="#2272B4" text-anchor="middle">write to disk</text><rect x="330" y="170" width="130" height="56" rx="10" fill="#DCEBF7" stroke="#2272B4" stroke-width="2"/><text x="395" y="205" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="18" font-weight="bold" fill="#0B2026" text-anchor="middle">Map</text><line x1="464" y1="198" x2="616" y2="198" stroke="#2272B4" stroke-width="3" stroke-linecap="round" marker-end="url(#ah2272B4)"/><rect x="512" y="232" width="40" height="40" rx="8" fill="#FFFFFF" stroke="#0B2026" stroke-width="2"/><circle cx="532.0" cy="252.0" r="12.0" fill="#E8ECEF" stroke="#0B2026" stroke-width="1.5"/><circle cx="532.0" cy="252.0" r="2.8000000000000003" fill="#0B2026"/><line x1="532.0" y1="252.0" x2="544.0" y2="240.8" stroke="#0B2026" stroke-width="2" stroke-linecap="round"/><text x="532" y="292" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="13" font-weight="bold" fill="#2272B4" text-anchor="middle">write to disk</text><rect x="620" y="170" width="130" height="56" rx="10" fill="#DCEBF7" stroke="#2272B4" stroke-width="2"/><text x="685" y="205" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="18" font-weight="bold" fill="#0B2026" text-anchor="middle">Reduce</text><line x1="754" y1="198" x2="906" y2="198" stroke="#2272B4" stroke-width="3" stroke-linecap="round" marker-end="url(#ah2272B4)"/><rect x="802" y="232" width="40" height="40" rx="8" fill="#FFFFFF" stroke="#0B2026" stroke-width="2"/><circle cx="822.0" cy="252.0" r="12.0" fill="#E8ECEF" stroke="#0B2026" stroke-width="1.5"/><circle cx="822.0" cy="252.0" r="2.8000000000000003" fill="#0B2026"/><line x1="822.0" y1="252.0" x2="834.0" y2="240.8" stroke="#0B2026" stroke-width="2" stroke-linecap="round"/><text x="822" y="292" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="13" font-weight="bold" fill="#2272B4" text-anchor="middle">write to disk</text><rect x="910" y="170" width="130" height="56" rx="10" fill="#DCEBF7" stroke="#2272B4" stroke-width="2"/><text x="975" y="205" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="18" font-weight="bold" fill="#0B2026" text-anchor="middle">Next job</text><text x="1160" y="205" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="28" font-weight="bold" fill="#D93A25" text-anchor="end">SLOW</text><text x="40" y="350" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="21" font-weight="bold" fill="#FF5F46" text-anchor="start">Spark  (in-memory)</text><rect x="40" y="370" width="130" height="56" rx="10" fill="#FFE6E0" stroke="#FF5F46" stroke-width="2"/><text x="105" y="405" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="18" font-weight="bold" fill="#0B2026" text-anchor="middle">Read</text><line x1="174" y1="398" x2="326" y2="398" stroke="#FF5F46" stroke-width="3" stroke-linecap="round" marker-end="url(#ahFF5F46)"/><rect x="216" y="436" width="56" height="26" rx="3" fill="#8ED16F" stroke="#0B2026" stroke-width="1.5"/><rect x="222" y="441" width="9" height="11" rx="2" fill="#0B2026"/><rect x="235" y="441" width="9" height="11" rx="2" fill="#0B2026"/><rect x="248" y="441" width="9" height="11" rx="2" fill="#0B2026"/><rect x="261" y="441" width="9" height="11" rx="2" fill="#0B2026"/><rect x="220.0" y="457" width="3" height="5" rx="0" fill="#E8A317"/><rect x="225.2" y="457" width="3" height="5" rx="0" fill="#E8A317"/><rect x="230.4" y="457" width="3" height="5" rx="0" fill="#E8A317"/><rect x="235.6" y="457" width="3" height="5" rx="0" fill="#E8A317"/><rect x="240.8" y="457" width="3" height="5" rx="0" fill="#E8A317"/><rect x="246.0" y="457" width="3" height="5" rx="0" fill="#E8A317"/><rect x="251.2" y="457" width="3" height="5" rx="0" fill="#E8A317"/><rect x="256.4" y="457" width="3" height="5" rx="0" fill="#E8A317"/><rect x="261.6" y="457" width="3" height="5" rx="0" fill="#E8A317"/><rect x="266.8" y="457" width="3" he