 font-size="18" font-weight="bold" fill="#0B2026" text-anchor="middle">Step 2</text><line x1="754" y1="398" x2="906" y2="398" stroke="#FF5F46" stroke-width="3" stroke-linecap="round" marker-end="url(#ahFF5F46)"/><rect x="796" y="436" width="56" height="26" rx="3" fill="#8ED16F" stroke="#0B2026" stroke-width="1.5"/><rect x="802" y="441" width="9" height="11" rx="2" fill="#0B2026"/><rect x="815" y="441" width="9" height="11" rx="2" fill="#0B2026"/><rect x="828" y="441" width="9" height="11" rx="2" fill="#0B2026"/><rect x="841" y="441" width="9" height="11" rx="2" fill="#0B2026"/><rect x="800.0" y="457" width="3" height="5" rx="0" fill="#E8A317"/><rect x="805.2" y="457" width="3" height="5" rx="0" fill="#E8A317"/><rect x="810.4" y="457" width="3" height="5" rx="0" fill="#E8A317"/><rect x="815.6" y="457" width="3" height="5" rx="0" fill="#E8A317"/><rect x="820.8" y="457" width="3" height="5" rx="0" fill="#E8A317"/><rect x="826.0" y="457" width="3" height="5" rx="0" fill="#E8A317"/><rect x="831.2" y="457" width="3" height="5" rx="0" fill="#E8A317"/><rect x="836.4" y="457" width="3" height="5" rx="0" fill="#E8A317"/><rect x="841.6" y="457" width="3" height="5" rx="0" fill="#E8A317"/><rect x="846.8" y="457" width="3" height="5" rx="0" fill="#E8A317"/><text x="824" y="484" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="13" font-weight="bold" fill="#FF5F46" text-anchor="middle">stays in RAM</text><rect x="910" y="370" width="130" height="56" rx="10" fill="#FFE6E0" stroke="#FF5F46" stroke-width="2"/><text x="975" y="405" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="18" font-weight="bold" fill="#0B2026" text-anchor="middle">Result</text><text x="1160" y="405" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="28" font-weight="bold" fill="#1B8A5A" text-anchor="end">FAST</text><rect x="40" y="520" width="1120" height="70" rx="14" fill="#0B2026"/><text x="70" y="550" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="22" font-weight="bold" fill="#FFFFFF" text-anchor="start">Disk is slow.  Memory is fast.</text><text x="70" y="576" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="15" font-weight="normal" fill="#C8D6E0" text-anchor="start">Multi-step jobs: Spark can be up to ~100x faster for in-memory workloads. Streaming is near real-time (micro-batches).</text></svg>