nt-size="12" font-weight="bold" fill="#1B8A5A" text-anchor="start">DATA PRODUCED</text><text x="966" y="340" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="16" font-weight="bold" fill="#0B2026" text-anchor="start">Sensor readings,</text><text x="966" y="361" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="16" font-weight="bold" fill="#0B2026" text-anchor="start">device logs</text><text x="966" y="420" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="12" font-weight="bold" fill="#1B8A5A" text-anchor="start">THE CHALLENGE</text><text x="966" y="444" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="16" font-weight="normal" fill="#0B2026" text-anchor="start">Continuous data under</text><text x="966" y="465" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="16" font-weight="normal" fill="#0B2026" text-anchor="start">strict privacy rules</text><text x="600" y="600" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="19" font-weight="bold" fill="#0B2026" text-anchor="middle">Different industries, same problem: more data, arriving faster, in more shapes.</text></svg>