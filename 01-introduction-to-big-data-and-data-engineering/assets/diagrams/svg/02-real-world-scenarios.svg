"start">GPS pings, ride</text><text x="285" y="361" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="16" font-weight="bold" fill="#0B2026" text-anchor="start">requests, payments</text><text x="285" y="420" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="12" font-weight="bold" fill="#FF5F46" text-anchor="start">THE CHALLENGE</text><text x="285" y="444" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="16" font-weight="normal" fill="#0B2026" text-anchor="start">Match riders to</text><text x="285" y="465" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="16" font-weight="normal" fill="#0B2026" text-anchor="start">drivers in seconds</text><rect x="494" y="140" width="212" height="420" rx="14" fill="#FFFFFF" stroke="#D93A25" stroke-width="2"/><path d="M494,180 L494,154 Q494,140 508,140 L692,140 Q706,140 706,154 L706,180 Z" fill="#D93A25"/><text x="600.0" y="165.95" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="17" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Banking</text><ellipse cx="600.0" cy="256.2" rx="28.0" ry="9.8" fill="#DCEBF7" stroke="#0B2026" stroke-width="2"/><rect x="572" y="205.8" width="56" height="50.4" fill="#DCEBF7"/><line x1="572" y1="205.8" x2="572" y2="256.2" stroke="#0B2026" stroke-width="2" stroke-linecap="round"/><line x1="628" y1="205.8" x2="628" y2="256.2" stroke="#0B2026" stroke-width="2" stroke-linecap="round"/><ellipse cx="600.0" cy="205.8" rx="28.0" ry="9.8" fill="#DCEBF7" stroke="#0B2026" stroke-width="2"/><path d="M572,227.5 A28.0,9.8 0 0 0 628,227.5" fill="none" stroke="#0B2026" stroke-width="1.5" stroke-linejoin="round"/><text x="512" y="316" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="12" font-weight="bold" fill="#D93A25" text-anchor="start">DATA PRODUCED</text><text x="512" y="340" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="16" font-weight="bold" fill="#0B2026" text-anchor="start">Card swipes,</text><text x="512" y="361" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="16" font-weight="bold" fill="#0B2026" text-anchor="start">transfers, logins</text><text x="512" y="420" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="12" font-weight="bold" fill="#D93A25" text-anchor="start">THE CHALLENGE</text><text x="512" y="444" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="16" font-weight="normal" fill="#0B2026" text-anchor="start">Spot fraud in</text><text x="512" y="465" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="16" font-weight="normal" fill="#0B2026" text-anchor="start">milliseconds; audit</text><text x="512" y="486" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="16" font-weight="normal" fill="#0B2026" text-anchor="start">everything</text><rect x="721" y="140" width="212" height="420" rx="14" fill="#FFFFFF" stroke="#6C4FBF" stroke-width="2"/><path d="M721,180 L721,154 Q721,140 735,140 L919,140 Q933,140 933,154 L933,180 Z" fill="#6C4FBF"/><text x="827.0" y="165.95" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="17" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Streaming media</text><rect x="793" y="208" width="68" height="54" rx="6" fill="#DCEBF7" stroke="#0B2026" stroke-width="2.5"/><circle cx="844.0" cy="224.2" r="5.94" fill="#E8A317"/><path d="M797,258 L816.8,226.9 L833.8,245.8 L844.0,237.7 L857,258 Z" fill="#1B8A5A" stroke-linejoin="round"/><text x="739" y="316" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="12" font-weight="bold" fill="#6C4FBF" text-anchor="start">DATA PRODUCED</text><text x="739" y="340" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="16" font-weight="bold" fill="#0B2026" text-anchor="start">Plays, pauses,</text><text x="739" y="361" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="16" font-weight="bold" fill="#0B2026" te