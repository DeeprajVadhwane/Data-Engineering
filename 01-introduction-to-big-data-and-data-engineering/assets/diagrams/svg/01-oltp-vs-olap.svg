<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" width="1200" height="660"><defs></defs><rect width="1200" height="660" rx="16" fill="#FAF8F5"/><text x="40" y="54" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="30" font-weight="bold" fill="#0B2026" text-anchor="start">Two Kinds of Database Work: OLTP vs OLAP</text><rect x="40" y="64" width="64" height="5" rx="2.5" fill="#FF5F46"/><text x="40" y="98" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="17" font-weight="normal" fill="#5F7281" text-anchor="start">Excel and MySQL were designed for the left side. Big data analytics lives on the right.</text><rect x="40" y="120" width="540" height="410" rx="14" fill="#FFFFFF" stroke="#2272B4" stroke-width="2"/><path d="M40,160 L40,134 Q40,120 54,120 L566,120 Q580,120 580,134 L580,160 Z" fill="#2272B4"/><text x="310.0" y="146.3" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="18" font-weight="bold" fill="#FFFFFF" text-anchor="middle">OLTP: Run the business</text><text x="64" y="200" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="14" font-weight="bold" fill="#5F7281" text-anchor="start">Purpose</text><text x="210" y="200" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="17" font-weight="bold" fill="#0B2026" text-anchor="start">Record transactions</text><line x1="64" y1="214" x2="556" y2="214" stroke="#E8ECEF" stroke-width="1" stroke-linecap="round"/><text x="64" y="238" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="14" font-weight="bold" fill="#5F7281" text-anchor="start">Typical query</text><text x="210" y="238" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="17" font-weight="bold" fill="#0B2026" text-anchor="start">INSERT order #1001</text><line x1="64" y1="252" x2="556" y2="252" stroke="#E8ECEF" stroke-width="1" stroke-linecap="round"/><text x="64" y="276" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="14" font-weight="bold" fill="#5F7281" text-anchor="start">Rows touched</text><text x="210" y="276" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="17" font-weight="bold" fill="#0B2026" text-anchor="start">A handful</text><line x1="64" y1="290" x2="556" y2="290" stroke="#E8ECEF" stroke-width="1" stroke-linecap="round"/><text x="64" y="314" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="14" font-weight="bold" fill="#5F7281" text-anchor="start">Speed goal</text><text x="210" y="314" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="17" font-weight="bold" fill="#0B2026" text-anchor="start">Milliseconds</text><line x1="64" y1="328" x2="556" y2="328" stroke="#E8ECEF" stroke-width="1" stroke-linecap="round"/><text x="64" y="352" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="14" font-weight="bold" fill="#5F7281" text-anchor="start">Storage layout</text><text x="210" y="352" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="17" font-weight="bold" fill="#0B2026" text-anchor="start">Row-oriented</text><line x1="64" y1="366" x2="556" y2="366" stroke="#E8ECEF" stroke-width="1" stroke-linecap="round"/><text x="64" y="390" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="14" font-weight="bold" fill="#5F7281" text-anchor="start">Examples</text><text x="210" y="390" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="17" font-weight="bold" fill="#0B2026" text-anchor="start">MySQL, PostgreSQL</text><rect x="64" y="440" width="150" height="70" rx="4" fill="#FFFFFF" stroke="#0B2026" stroke-width="2"/><rect x="64" y="457.5" width="150" height="17.5" rx="0" fill="#FF5F46" opacity="0.45"/><line x1="64" y1="457.5" x2="214" y2="457.5" stroke="#9AA8B4" stroke-width="1.5" stroke-linecap="round"/><line x1="64" y1="475.0" x2="214" y2="475.0" stroke="#9AA8B4" stroke-width="1.5" stroke-linecap="round"/><line x1="64" y1="492.5" x2="214" y2="492.5" stroke="#9AA8B4" stroke-width="1.5" stroke-linecap="round"/><line x1="101.5" y1="440" x2="101.5" y2="510" stroke="#9AA8B4" stroke-width="1.5" stroke-linecap="round"/><line x1="139.0" y1="440" x2="139.0" y2="510" stroke="#9AA8B4" stroke-width="1.5" stroke-linecap="round"/><line x1="176.5" y1="440" x2="176.5" y2="510" stroke="#9AA8B4" stroke-width="1.5" stroke-linecap="round"/><rect x="64" y="440" width="150" height="70" rx="4" fill="none" stroke="#0B2026" stroke-width="2"/><text x="235" y="480" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="15" font-weight="bold" fill="#2272B4" text-anchor="start">reads or writes one whole row</text><rect x="620" y="120" width="540" height="410" rx="14" fill="#FFFFFF" stroke="#FF5F46" stroke-width="2"/><path d="M620,160 L620,134 Q620,120 634,120 L1146,120 Q1160,120 1160,134 L1160,160 Z" fill="#FF5F46"/><text x="890.0" y="146.3" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="18" font-weight="bold" fill="#FFFFFF" text-anchor="middle">OLAP: Understand the business</text><text x="644" y="200" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="14" font-weight="bold" fill="#5F7281" text-anchor="start">Purpose</text><text x="790" y="200" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="17" font-weight="bold" fill="#0B2026" text-anchor="start">Analyse history</text><line x1="644" y1="214" x2="1136" y2="214" stroke="#E8ECEF" stroke-width="1" stroke-linecap="round"/><text x="644" y="238" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="14" font-weight="bold" fill="#5F7281" text-anchor="start">Typical query</text><text x="790" y="238" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="17" font-weight="bold" fill="#0B2026" text-anchor="start">Revenue by region, 2 yrs</text><line x1="644" y1="252" x2="1136" y2="252" stroke="#E8ECEF" stroke-width="1" stroke-linecap="round"/><text x="644" y="276" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="14" font-weight="bold" fill="#5F7281" text-anchor="start">Rows touched</text><text x="790" y="276" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="17" font-weight="bold" fill="#0B2026" text-anchor="start">Millions to billions</text><line x1="644" y1="290" x2="1136" y2="290" stroke="#E8ECEF" stroke-width="1" stroke-linecap="round"/><text x="644" y="314" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="14" font-weight="bold" fill="#5F7281" text-anchor="start">Speed goal</text><text x="790" y="314" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="17" font-weight="bold" fill="#0B2026" text-anchor="start">Seconds to minutes</text><line x1="644" y1="328" x2="1136" y2="328" stroke="#E8ECEF" stroke-width="1" stroke-linecap="round"/><text x="644" y="352" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="14" font-weight="bold" fill="#5F7281" text-anchor="start">Storage layout</text><text x="790" y="352" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="17" font-weight="bold" fill="#0B2026" text-anchor="start">Column-oriented</text><line x1="644" y1="366" x2="1136" y2="366" stroke="#E8ECEF" stroke-width="1" stroke-linecap="round"/><text x="644" y="390" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="14" font-weight="bold" fill="#5F7281" text-anchor="start">Examples</text><text x="790" y="390" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="17" font-weight="bold" fill="#0B2026" text-anchor="start">Warehouses, Spark</text><rect x="644" y="440" width="150" height="70" rx="4" fill="#FFFFFF" stroke="#0B2026" stroke-width="2"/><rect x="719.0" y="440" width="37.5" height="70" rx="0" fill="#FF5F46" opacity="0.45"/><line x1="644" y1="457.5" x2="794" y2="457.5" stroke="#9AA8B4" stroke-width="1.5" stroke-linecap="round"/><line x1="644" y1="475.0" x2="794" y2="475.0" stroke="#9AA8B4" stroke-width="1.5" stroke-linecap="round"/><line x1="644" y1="492.5" x2="794" y2="492.5" stroke="#9AA8B4" stroke-width="1.5" stroke-linecap="round"/><line x1="681.5" y1="440" x2="681.5" y2="510" stroke="#9AA8B4" stroke-width="1.5" stroke-linecap="round"/><line x1="719.0" y1="440" x2="719.0" y2="510" stroke="#9AA8B4" stroke-width="1.5" stroke-linecap="round"/><line x1="756.5" y1="440" x2="756.5" y2="510" stroke="#9AA8B4" stroke-width="1.5" stroke-linecap="round"/><rect x="644" y="440" width="150" height="70" rx="4" fill="none" stroke="#0B2026" stroke-width="2"/><text x="815" y="480" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="15" font-weight="bold" fill="#FF5F46" text-anchor="start">reads only the columns it needs</text><rect x="40" y="555" width="1120" height="70" rx="14" fill="#0B2026"/><text x="600" y="598" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="21" font-weight="bold" fill="#FFFFFF" text-anchor="middle">100 GB a day of history to analyse is an OLAP problem at scale.</text></svg>