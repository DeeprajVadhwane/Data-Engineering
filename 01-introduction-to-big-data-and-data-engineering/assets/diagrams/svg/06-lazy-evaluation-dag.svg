<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700"><defs><marker id="ah0B2026" markerWidth="12" markerHeight="12" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L12,6 L0,12 z" fill="#0B2026"/></marker><marker id="ahD93A25" markerWidth="12" markerHeight="12" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L12,6 L0,12 z" fill="#D93A25"/></marker></defs><rect width="1200" height="700" rx="16" fill="#FAF8F5"/><text x="40" y="54" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="30" font-weight="bold" fill="#0B2026" text-anchor="start">Lazy Evaluation and the DAG</text><rect x="40" y="64" width="64" height="5" rx="2.5" fill="#FF5F46"/><text x="40" y="98" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="17" font-weight="normal" fill="#5F7281" text-anchor="start">Spark records your steps as a plan. Only an action makes it run.</text><rect x="40" y="120" width="560" height="330" rx="14" fill="#0B2026"/><text x="60" y="166" font-family="'DejaVu Sans Mono', 'Courier New', monospace" font-size="15" font-weight="bold" xml:space="preserve" fill="#FFFFFF"><tspan fill="#FFFFFF">df </tspan><tspan fill="#FFFFFF">= spark.read.parquet(</tspan><tspan fill="#7CD6A5">"sales"</tspan><tspan fill="#FFFFFF">)</tspan></text><rect x="60" y="176" width="150" height="24" rx="12.0" fill="#2272B4"/><text x="135.0" y="192.55" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="13" font-weight="bold" fill="#FFFFFF" text-anchor="middle">transformation</text><text x="60" y="232" font-family="'DejaVu Sans Mono', 'Courier New', monospace" font-size="15" font-weight="bold" xml:space="preserve" fill="#FFFFFF"><tspan fill="#FFFFFF">big </tspan><tspan fill="#FFFFFF">= df.filter(df.amount > 100)</tspan></text><rect x="60" y="242" width="150" height="24" rx="12.0" fill="#2272B4"/><text x="135.0" y="258.55" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="13" font-weight="bold" fill="#FFFFFF" text-anchor="middle">transformation</text><text x="60" y="298" font-family="'DejaVu Sans Mono', 'Courier New', monospace" font-size="15" font-weight="bold" xml:space="preserve" fill="#FFFFFF"><tspan fill="#FFFFFF">out </tspan><tspan fill="#FFFFFF">= big.groupBy(</tspan><tspan fill="#7CD6A5">"region"</tspan><tspan fill="#FFFFFF">).sum(</tspan><tspan fill="#7CD6A5">"amount"</tspan><tspan fill="#FFFFFF">)</tspan></text><rect x="60" y="308" width="150" height="24" rx="12.0" fill="#2272B4"/><text x="135.0" y="324.55" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="13" font-weight="bold" fill="#FFFFFF" text-anchor="middle">transformation</text><text x="60" y="364" font-family="'DejaVu Sans Mono', 'Courier New', monospace" font-size="15" font-weight="bold" xml:space="preserve" fill="#FFFFFF"><tspan fill="#FFB4A6">out.show()</tspan></text><rect x="60" y="374" width="140" height="24" rx="12.0" fill="#FF5F46"/><text x="130.0" y="390.55" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="13" font-weight="bold" fill="#FFFFFF" text-anchor="middle">ACTION</text><text x="60" y="434" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="14" font-weight="normal" fill="#9FB4C2" text-anchor="start">Lines 1-3: nothing runs. Line 4: everything runs.</text><rect x="650" y="120" width="510" height="330" rx="14" fill="#FFFFFF" stroke="#E8ECEF" stroke-width="2"/><text x="905" y="150" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="17" font-weight="bold" fill="#0B2026" text-anchor="middle">The plan Spark builds (a DAG)</text><rect x="670" y="168" width="190" height="220" rx="12" fill="#DCEBF7" stroke="#2272B4" stroke-width="2" stroke-dasharray="8 5"/><text x="765" y="188" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="14" font-weight="bold" fill="#2272B4" text-anchor="middle">Stage 1</text><rect x="950" y="168" width="190" height="220" rx="12" fill="#FFE6E0" stroke="#FF5F46" stroke-width="2" stroke-dasharray="8 5"/><text x="1045" y="188" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="14" font-weight="bold" fill="#FF5F46" text-anchor="middle">Stage 2</text><rect x="700" y="210" width="130" height="52" rx="10" fill="#2272B4"/><text x="765" y="243" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="17" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Read</text><rect x="700" y="290" width="130" height="52" rx="10" fill="#2272B4"/><text x="765" y="323" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="17" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Filter</text><line x1="765" y1="264" x2="765" y2="288" stroke="#0B2026" stroke-width="3" stroke-linecap="round" marker-end="url(#ah0B2026)"/><rect x="980" y="210" width="130" height="52" rx="10" fill="#2272B4"/><text x="1045" y="243" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">GroupBy+Sum</text><rect x="980" y="290" width="130" height="52" rx="10" fill="#FF5F46"/><text x="1045" y="323" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="17" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Show</text><line x1="1045" y1="264" x2="1045" y2="288" stroke="#0B2026" stroke-width="3" stroke-linecap="round" marker-end="url(#ah0B2026)"/><line x1="832" y1="340" x2="976" y2="238" stroke="#D93A25" stroke-width="3" stroke-linecap="round" marker-end="url(#ahD93A25)"/><text x="906" y="300" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="13" font-weight="bold" fill="#D93A25" text-anchor="middle">SHUFFLE</text><text x="906" y="318" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="12" font-weight="normal" fill="#D93A25" text-anchor="middle">(data moves)</text><rect x="40" y="480" width="1120" height="190" rx="14" fill="#FFF3D6"/><text x="70" y="520" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="19" font-weight="bold" fill="#0B2026" text-anchor="start">Why lazy is smart</text><path d="M72,556 L77.6,562.4 L88,549.6" fill="none" stroke="#1B8A5A" stroke-width="5" stroke-linejoin="round"/><text x="100" y="562" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="16" font-weight="normal" fill="#0B2026" text-anchor="start">Spark sees the WHOLE plan before running, so it can optimise it (reorder, skip, combine steps).</text><path d="M72,592 L77.6,598.4 L88,585.6" fill="none" stroke="#1B8A5A" stroke-width="5" stroke-linejoin="round"/><text x="100" y="598" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="16" font-weight="normal" fill="#0B2026" text-anchor="start">A shuffle splits the plan into stages. Stages are made of tasks, one task per partition.</text><path d="M72,628 L77.6,634.4 L88,621.6" fill="none" stroke="#1B8A5A" stroke-width="5" stroke-linejoin="round"/><text x="100" y="634" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="16" font-weight="normal" fill="#0B2026" text-anchor="start">If a machine fails, Spark replays the recorded steps (the lineage) to rebuild lost data.</text></svg>