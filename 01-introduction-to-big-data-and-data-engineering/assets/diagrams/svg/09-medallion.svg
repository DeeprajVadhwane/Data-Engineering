<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="1200" height="560"><defs><marker id="ah0B2026" markerWidth="12" markerHeight="12" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L12,6 L0,12 z" fill="#0B2026"/></marker></defs><rect width="1200" height="560" rx="16" fill="#FAF8F5"/><text x="40" y="54" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="30" font-weight="bold" fill="#0B2026" text-anchor="start">Medallion Architecture: Bronze → Silver → Gold</text><rect x="40" y="64" width="64" height="5" rx="2.5" fill="#FF5F46"/><text x="40" y="98" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="17" font-weight="normal" fill="#5F7281" text-anchor="start">The standard way to organise data in a lakehouse. Quality improves at every step.</text><rect x="40" y="200" width="150" height="170" rx="14" fill="#FFFFFF" stroke="#5F7281" stroke-width="2"/><text x="115" y="236" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="19" font-weight="bold" fill="#0B2026" text-anchor="middle">Sources</text><text x="115" y="270" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="15" font-weight="normal" fill="#5F7281" text-anchor="middle">files</text><text x="115" y="294" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="15" font-weight="normal" fill="#5F7281" text-anchor="middle">databases</text><text x="115" y="318" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="15" font-weight="normal" fill="#5F7281" text-anchor="middle">apps</text><text x="115" y="342" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="15" font-weight="normal" fill="#5F7281" text-anchor="middle">streams</text><rect x="250" y="150" width="250" height="270" rx="16" fill="#F6E7D5" stroke="#B9772F" stroke-width="3"/><rect x="250" y="150" width="250" height="50" rx="16" fill="#B9772F"/><rect x="250" y="180" width="250" height="20" rx="0" fill="#B9772F"/><text x="375" y="184" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="22" font-weight="bold" fill="#FFFFFF" text-anchor="middle">BRONZE</text><text x="375" y="240" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="15" font-weight="bold" fill="#0B2026" text-anchor="middle">Raw data, exactly as received</text><text x="375" y="285" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="15" font-weight="normal" fill="#0B2026" text-anchor="middle">Never modify it</text><text x="375" y="309" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="15" font-weight="normal" fill="#0B2026" text-anchor="middle">Add load time and source</text><ellipse cx="375.0" cy="386.76" rx="25.0" ry="9.24" fill="#FFFFFF" stroke="#B9772F" stroke-width="2"/><rect x="350" y="339.24" width="50" height="47.519999999999996" fill="#FFFFFF"/><line x1="350" y1="339.24" x2="350" y2="386.76" stroke="#B9772F" stroke-width="2" stroke-linecap="round"/><line x1="400" y1="339.24" x2="400" y2="386.76" stroke="#B9772F" stroke-width="2" stroke-linecap="round"/><ellipse cx="375.0" cy="339.24" rx="25.0" ry="9.24" fill="#FFFFFF" stroke="#B9772F" stroke-width="2"/><path d="M350,359.7 A25.0,9.24 0 0 0 400,359.7" fill="none" stroke="#B9772F" stroke-width="1.5" stroke-linejoin="round"/><line x1="194" y1="285" x2="246" y2="285" stroke="#0B2026" stroke-width="3" stroke-linecap="round" marker-end="url(#ah0B2026)"/><rect x="540" y="150" width="250" height="270" rx="16" fill="#E9EDF0" stroke="#7C8A96" stroke-width="3"/><rect x="540" y="150" width="250" height="50" rx="16" fill="#7C8A96"/><rect x="540" y="180" width="250" height="20" rx="0" fill="#7C8A96"/><text x="665" y="184" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="22" font-weight="bold" fill="#FFFFFF" text-anchor="middle">SILVER</text><text x="665" y="240" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="15" font-weight="bold" fill="#0B2026" text-anchor="middle">Cleaned and validated</text><text x="665" y="285" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="15" font-weight="normal" fill="#0B2026" text-anchor="middle">Remove duplicates</text><text x="665" y="309" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="15" font-weight="normal" fill="#0B2026" text-anchor="middle">Fix types, join, check quality</text><ellipse cx="665.0" cy="386.76" rx="25.0" ry="9.24" fill="#FFFFFF" stroke="#7C8A96" stroke-width="2"/><rect x="640" y="339.24" width="50" height="47.519999999999996" fill="#FFFFFF"/><line x1="640" y1="339.24" x2="640" y2="386.76" stroke="#7C8A96" stroke-width="2" stroke-linecap="round"/><line x1="690" y1="339.24" x2="690" y2="386.76" stroke="#7C8A96" stroke-width="2" stroke-linecap="round"/><ellipse cx="665.0" cy="339.24" rx="25.0" ry="9.24" fill="#FFFFFF" stroke="#7C8A96" stroke-width="2"/><path d="M640,359.7 A25.0,9.24 0 0 0 690,359.7" fill="none" stroke="#7C8A96" stroke-width="1.5" stroke-linejoin="round"/><line x1="502" y1="285" x2="536" y2="285" stroke="#0B2026" stroke-width="3" stroke-linecap="round" marker-end="url(#ah0B2026)"/><rect x="830" y="150" width="250" height="270" rx="16" fill="#FFF3D6" stroke="#E8A317" stroke-width="3"/><rect x="830" y="150" width="250" height="50" rx="16" fill="#E8A317"/><rect x="830" y="180" width="250" height="20" rx="0" fill="#E8A317"/><text x="955" y="184" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="22" font-weight="bold" fill="#FFFFFF" text-anchor="middle">GOLD</text><text x="955" y="240" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="15" font-weight="bold" fill="#0B2026" text-anchor="middle">Business-ready aggregates</text><text x="955" y="285" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="15" font-weight="normal" fill="#0B2026" text-anchor="middle">Small, fast tables</text><text x="955" y="309" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="15" font-weight="normal" fill="#0B2026" text-anchor="middle">Built for dashboards and ML</text><ellipse cx="955.0" cy="386.76" rx="25.0" ry="9.24" fill="#FFFFFF" stroke="#E8A317" stroke-width="2"/><rect x="930" y="339.24" width="50" height="47.519999999999996" fill="#FFFFFF"/><line x1="930" y1="339.24" x2="930" y2="386.76" stroke="#E8A317" stroke-width="2" stroke-linecap="round"/><line x1="980" y1="339.24" x2="980" y2="386.76" stroke="#E8A317" stroke-width="2" stroke-linecap="round"/><ellipse cx="955.0" cy="339.24" rx="25.0" ry="9.24" fill="#FFFFFF" stroke="#E8A317" stroke-width="2"/><path d="M930,359.7 A25.0,9.24 0 0 0 980,359.7" fill="none" stroke="#E8A317" stroke-width="1.5" stroke-linejoin="round"/><line x1="792" y1="285" x2="826" y2="285" stroke="#0B2026" stroke-width="3" stroke-linecap="round" marker-end="url(#ah0B2026)"/><text x="600" y="470" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="17" font-weight="bold" fill="#0B2026" text-anchor="middle">Each layer is a set of Delta tables.   Re-running a job must not create duplicates (idempotent).</text><rect x="40" y="495" width="1120" height="44" rx="12" fill="#0B2026"/><text x="600" y="524" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="19" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Bronze = trust nothing   ·   Silver = trust it   ·   Gold = use it</text></svg>