<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="1200" height="520"><defs></defs><rect width="1200" height="520" rx="16" fill="#FAF8F5"/><text x="40" y="54" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="30" font-weight="bold" fill="#0B2026" text-anchor="start">The Power of Reading in Parallel</text><rect x="40" y="64" width="64" height="5" rx="2.5" fill="#FF5F46"/><text x="40" y="98" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="17" font-weight="normal" fill="#5F7281" text-anchor="start">How long does it take just to READ 100 GB once?</text><text x="40" y="160" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="20" font-weight="bold" fill="#D93A25" text-anchor="start">1 machine</text><rect x="40" y="176" width="1120" height="60" rx="12" fill="#D93A25"/><text x="1140" y="214" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="21" font-weight="bold" fill="#FFFFFF" text-anchor="end">≈ 683 seconds  (about 11 minutes)</text><text x="40" y="290" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="20" font-weight="bold" fill="#1B8A5A" text-anchor="start">100 machines, each reading 1 GB</text><rect x="40" y="306" width="11.200000000000001" height="60" rx="4" fill="#1B8A5A"/><text x="76" y="344" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="21" font-weight="bold" fill="#1B8A5A" text-anchor="start">≈ 7 seconds</text><rect x="40" y="395" width="1120" height="90" rx="12" fill="#FFF3D6"/><text x="60" y="425" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="15" font-weight="normal" fill="#0B2026" text-anchor="start">Assumptions: 150 MB/s sequential read per disk, 1 GB = 1,024 MB, perfectly even split, no overhead.</text><text x="60" y="449" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="15" font-weight="normal" fill="#0B2026" text-anchor="start">Real clusters add coordination costs and are slower than this ideal, but the lesson holds:</text><text x="60" y="473" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="15" font-weight="bold" fill="#0B2026" text-anchor="start">dividing the data divides the time. That is why we scale OUT.</text></svg>