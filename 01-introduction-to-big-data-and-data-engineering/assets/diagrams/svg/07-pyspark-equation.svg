<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" width="1000" height="300"><defs></defs><rect width="1000" height="300" rx="16" fill="#FAF8F5"/><text x="40" y="54" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="30" font-weight="bold" fill="#0B2026" text-anchor="start">Apache Spark + Python = PySpark</text><rect x="40" y="64" width="64" height="5" rx="2.5" fill="#FF5F46"/><rect x="60" y="110" width="250" height="120" rx="16" fill="#FFE6E0" stroke="#FF5F46" stroke-width="3"/><text x="185" y="160" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="26" font-weight="bold" fill="#FF5F46" text-anchor="middle">Apache Spark</text><text x="185" y="192" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="17" font-weight="normal" fill="#5F7281" text-anchor="middle">the fast engine</text><text x="350" y="187" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="48" font-weight="bold" fill="#0B2026" text-anchor="middle">+</text><rect x="390" y="110" width="220" height="120" rx="16" fill="#DCEBF7" stroke="#2272B4" stroke-width="3"/><text x="500" y="160" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="26" font-weight="bold" fill="#2272B4" text-anchor="middle">Python</text><text x="500" y="192" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="17" font-weight="normal" fill="#5F7281" text-anchor="middle">the friendly language</text><text x="650" y="187" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="48" font-weight="bold" fill="#0B2026" text-anchor="middle">=</text><rect x="690" y="110" width="250" height="120" rx="16" fill="#0B2026"/><text x="815" y="160" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="28" font-weight="bold" fill="#FFFFFF" text-anchor="middle">PySpark</text><text x="815" y="192" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="16" font-weight="normal" fill="#C8D6E0" text-anchor="middle">Spark, driven by Python</text><text x="500" y="270" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="17" font-weight="normal" fill="#5F7281" text-anchor="middle">Spark itself is written in Scala. PySpark lets analysts and engineers use Python.</text></svg>