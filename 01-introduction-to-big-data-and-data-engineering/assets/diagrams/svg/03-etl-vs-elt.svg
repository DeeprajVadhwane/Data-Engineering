<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700"><defs><marker id="ahFF5F46" markerWidth="12" markerHeight="12" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L12,6 L0,12 z" fill="#FF5F46"/></marker><marker id="ah2272B4" markerWidth="12" markerHeight="12" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L12,6 L0,12 z" fill="#2272B4"/></marker></defs><rect width="1200" height="700" rx="16" fill="#FAF8F5"/><text x="40" y="54" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="30" font-weight="bold" fill="#0B2026" text-anchor="start">ETL vs ELT</text><rect x="40" y="64" width="64" height="5" rx="2.5" fill="#FF5F46"/><text x="40" y="98" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="17" font-weight="normal" fill="#5F7281" text-anchor="start">The same three steps, in a different order.</text><text x="40" y="158" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="21" font-weight="bold" fill="#2272B4" text-anchor="start">ETL: Extract → Transform → Load</text><rect x="40" y="170" width="190" height="100" rx="14" fill="#FFFFFF" stroke="#2272B4" stroke-width="3"/><text x="135" y="224" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="17" font-weight="bold" fill="#0B2026" text-anchor="middle">Sources</text><line x1="232" y1="220" x2="273" y2="220" stroke="#2272B4" stroke-width="3" stroke-linecap="round" marker-end="url(#ah2272B4)"/><rect x="275" y="170" width="190" height="100" rx="14" fill="#FFFFFF" stroke="#2272B4" stroke-width="3"/><text x="370" y="224" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="17" font-weight="bold" fill="#0B2026" text-anchor="middle">Extract</text><line x1="467" y1="220" x2="508" y2="220" stroke="#2272B4" stroke-width="3" stroke-linecap="round" marker-end="url(#ah2272B4)"/><rect x="510" y="170" width="190" height="100" rx="14" fill="#2272B4" stroke="#2272B4" stroke-width="3"/><text x="605" y="214" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="17" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Transform</text><text x="605" y="236" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="17" font-weight="bold" fill="#FFFFFF" text-anchor="middle">(separate server)</text><line x1="702" y1="220" x2="743" y2="220" stroke="#2272B4" stroke-width="3" stroke-linecap="round" marker-end="url(#ah2272B4)"/><rect x="745" y="170" width="190" height="100" rx="14" fill="#FFFFFF" stroke="#2272B4" stroke-width="3"/><text x="840" y="224" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="17" font-weight="bold" fill="#0B2026" text-anchor="middle">Load</text><line x1="937" y1="220" x2="978" y2="220" stroke="#2272B4" stroke-width="3" stroke-linecap="round" marker-end="url(#ah2272B4)"/><rect x="980" y="170" width="190" height="100" rx="14" fill="#FFFFFF" stroke="#2272B4" stroke-width="3"/><text x="1075" y="224" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="17" font-weight="bold" fill="#0B2026" text-anchor="middle">Data warehouse</text><text x="40" y="378" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="21" font-weight="bold" fill="#FF5F46" text-anchor="start">ELT: Extract → Load → Transform</text><rect x="40" y="390" width="190" height="100" rx="14" fill="#FFFFFF" stroke="#FF5F46" stroke-width="3"/><text x="135" y="444" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="17" font-weight="bold" fill="#0B2026" text-anchor="middle">Sources</text><line x1="232" y1="440" x2="273" y2="440" stroke="#FF5F46" stroke-width="3" stroke-linecap="round" marker-end="url(#ahFF5F46)"/><rect x="275" y="390" width="190" height="100" rx="14" fill="#FFFFFF" stroke="#FF5F46" stroke-width="3"/><text x="370" y="444" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="17" font-weight="bold" fill="#0B2026" text-anchor="middle">Extract</text><line x1="467" y1="440" x2="508" y2="440" stroke="#FF5F46" stroke-width="3" stroke-linecap="round" marker-end="url(#ahFF5F46)"/><rect x="510" y="390" width="190" height="100" rx="14" fill="#FFFFFF" stroke="#FF5F46" stroke-width="3"/><text x="605" y="434" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="17" font-weight="bold" fill="#0B2026" text-anchor="middle">Load</text><text x="605" y="456" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="17" font-weight="bold" fill="#0B2026" text-anchor="middle">(raw, as-is)</text><line x1="702" y1="440" x2="743" y2="440" stroke="#FF5F46" stroke-width="3" stroke-linecap="round" marker-end="url(#ahFF5F46)"/><rect x="745" y="390" width="190" height="100" rx="14" fill="#FFFFFF" stroke="#FF5F46" stroke-width="3"/><text x="840" y="434" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="17" font-weight="bold" fill="#0B2026" text-anchor="middle">Raw data in</text><text x="840" y="456" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="17" font-weight="bold" fill="#0B2026" text-anchor="middle">lake / warehouse</text><line x1="937" y1="440" x2="978" y2="440" stroke="#FF5F46" stroke-width="3" stroke-linecap="round" marker-end="url(#ahFF5F46)"/><rect x="980" y="390" width="190" height="100" rx="14" fill="#FF5F46" stroke="#FF5F46" stroke-width="3"/><text x="1075" y="434" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="17" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Transform</text><text x="1075" y="456" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="17" font-weight="bold" fill="#FFFFFF" text-anchor="middle">(inside, at scale)</text><text x="40" y="310" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="17" font-weight="bold" fill="#2272B4" text-anchor="start">Data is reshaped BEFORE it is stored.</text><text x="40" y="530" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="17" font-weight="bold" fill="#FF5F46" text-anchor="start">Data is stored first, reshaped AFTER, using the platform&#x27;s own compute.</text><rect x="40" y="566" width="1120" height="112" rx="14" fill="#FFF3D6"/><text x="70" y="602" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="18" font-weight="bold" fill="#0B2026" text-anchor="start">Why ELT became popular in the cloud</text><text x="70" y="630" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="16" font-weight="normal" fill="#0B2026" text-anchor="start">Cheap storage + scalable compute + the raw data is kept, so you can re-run or change the logic later.</text><text x="70" y="654" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="16" font-weight="normal" fill="#5F7281" text-anchor="start">ETL is still common where data must be cleaned or masked before it lands, or for small, stable systems.</text></svg>