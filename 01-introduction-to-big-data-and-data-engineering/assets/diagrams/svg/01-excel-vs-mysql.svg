<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760"><defs></defs><rect width="1200" height="760" rx="16" fill="#FAF8F5"/><text x="40" y="54" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="30" font-weight="bold" fill="#0B2026" text-anchor="start">Why Excel and MySQL Are Not Enough</text><rect x="40" y="64" width="64" height="5" rx="2.5" fill="#FF5F46"/><text x="40" y="98" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="17" font-weight="normal" fill="#5F7281" text-anchor="start">Test each option against 100 GB per day.</text><rect x="40" y="120" width="540" height="380" rx="14" fill="#FFFFFF" stroke="#1B8A5A" stroke-width="2"/><path d="M40,160 L40,134 Q40,120 54,120 L566,120 Q580,120 580,134 L580,160 Z" fill="#1B8A5A"/><text x="310.0" y="146.3" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="18" font-weight="bold" fill="#FFFFFF" text-anchor="middle">1 · Excel</text><rect x="70" y="180" width="80" height="100" rx="6" fill="#FFFFFF" stroke="#0B2026" stroke-width="2.5"/><circle cx="78" cy="194" r="4" fill="#9AA8B4" stroke="#0B2026" stroke-width="1.5"/><circle cx="78" cy="210" r="4" fill="#9AA8B4" stroke="#0B2026" stroke-width="1.5"/><circle cx="78" cy="226" r="4" fill="#9AA8B4" stroke="#0B2026" stroke-width="1.5"/><circle cx="78" cy="242" r="4" fill="#9AA8B4" stroke="#0B2026" stroke-width="1.5"/><circle cx="78" cy="258" r="4" fill="#9AA8B4" stroke="#0B2026" stroke-width="1.5"/><line x1="94" y1="200" x2="140" y2="200" stroke="#9AA8B4" stroke-width="2" stroke-linecap="round"/><line x1="94" y1="214" x2="140" y2="214" stroke="#9AA8B4" stroke-width="2" stroke-linecap="round"/><line x1="94" y1="228" x2="140" y2="228" stroke="#9AA8B4" stroke-width="2" stroke-linecap="round"/><line x1="94" y1="242" x2="140" y2="242" stroke="#9AA8B4" stroke-width="2" stroke-linecap="round"/><line x1="94" y1="256" x2="140" y2="256" stroke="#9AA8B4" stroke-width="2" stroke-linecap="round"/><text x="170" y="205" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="22" font-weight="bold" fill="#1B8A5A" text-anchor="start">Like a NOTEBOOK</text><text x="170" y="232" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="18" font-weight="normal" fill="#5F7281" text-anchor="start">good for small data</text><line x1="71" y1="313" x2="89" y2="331" stroke="#D93A25" stroke-width="5" stroke-linecap="round"/><line x1="71" y1="331" x2="89" y2="313" stroke="#D93A25" stroke-width="5" stroke-linecap="round"/><text x="104" y="328" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="17" font-weight="normal" fill="#1B3139" text-anchor="start">Stores only ~1 million rows per sheet</text><line x1="71" y1="353" x2="89" y2="371" stroke="#D93A25" stroke-width="5" stroke-linecap="round"/><line x1="71" y1="371" x2="89" y2="353" stroke="#D93A25" stroke-width="5" stroke-linecap="round"/><text x="104" y="368" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="17" font-weight="normal" fill="#1B3139" text-anchor="start">Crashes on large data (all in one PC&#x27;s memory)</text><line x1="71" y1="393" x2="89" y2="411" stroke="#D93A25" stroke-width="5" stroke-linecap="round"/><line x1="71" y1="411" x2="89" y2="393" stroke="#D93A25" stroke-width="5" stroke-linecap="round"/><text x="104" y="408" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="17" font-weight="normal" fill="#1B3139" text-anchor="start">Manual handling: copy, paste, drag formulas</text><rect x="70" y="452" width="230" height="32" rx="16.0" fill="#D93A25"/><text x="185.0" y="473.25" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="15" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Not for 100 GB/day</text><rect x="620" y="120" width="540" height="380" rx="14" fill="#FFFFFF" stroke="#2272B4" stroke-width="2"/><path d="M620,160 L620,134 Q620,120 634,120 L1146,120 Q1160,120 1160,134 L1160,160 Z" fill="#2272B4"/><text x="890.0" y="146.3" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="18" font-weight="bold" fill="#FFFFFF" text-anchor="middle">2 · MySQL</text><path d="M650,205.0 L705.0,178 L760,205.0 Z" fill="#2272B4" stroke="#0B2026" stroke-width="2.5" stroke-linejoin="round"/><rect x="654" y="205.0" width="102" height="62.99999999999999" rx="2" fill="#FFFFFF" stroke="#0B2026" stroke-width="2.5"/><rect x="677.5" y="223.0" width="55.0" height="45.0" rx="2" fill="#DCEBF7" stroke="#0B2026" stroke-width="2"/><line x1="677.5" y1="234.25" x2="732.5" y2="234.25" stroke="#0B2026" stroke-width="1.5" stroke-linecap="round"/><line x1="677.5" y1="245.5" x2="732.5" y2="245.5" stroke="#0B2026" stroke-width="1.5" stroke-linecap="round"/><line x1="677.5" y1="256.75" x2="732.5" y2="256.75" stroke="#0B2026" stroke-width="1.5" stroke-linecap="round"/><text x="782" y="205" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="22" font-weight="bold" fill="#2272B4" text-anchor="start">Like a WAREHOUSE</text><text x="782" y="232" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="16" font-weight="normal" fill="#5F7281" text-anchor="start">good storage, limited capacity &amp; speed</text><path d="M651,322 L657.3,329.2 L669,314.8" fill="none" stroke="#1B8A5A" stroke-width="5" stroke-linejoin="round"/><text x="684" y="328" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="17" font-weight="normal" fill="#1B3139" text-anchor="start">Structured tables + SQL, better than Excel</text><line x1="651" y1="353" x2="669" y2="371" stroke="#D93A25" stroke-width="5" stroke-linecap="round"/><line x1="651" y1="371" x2="669" y2="353" stroke="#D93A25" stroke-width="5" stroke-linecap="round"/><text x="684" y="368" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="17" font-weight="normal" fill="#1B3139" text-anchor="start">Scaling is difficult (manual setup)</text><line x1="651" y1="393" x2="669" y2="411" stroke="#D93A25" stroke-width="5" stroke-linecap="round"/><line x1="651" y1="411" x2="669" y2="393" stroke="#D93A25" stroke-width="5" stroke-linecap="round"/><text x="684" y="408" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="17" font-weight="normal" fill="#1B3139" text-anchor="start">Performance drops with massive data</text><rect x="650" y="452" width="230" height="32" rx="16.0" fill="#D93A25"/><text x="765.0" y="473.25" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="15" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Not for 100 GB/day</text><text x="40" y="545" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="19" font-weight="bold" fill="#0B2026" text-anchor="start">How big is the gap? One day of data vs Excel&#x27;s row limit</text><rect x="40" y="565" width="1120" height="36" rx="8" fill="#FF5F46"/><text x="1140" y="590" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="17" font-weight="bold" fill="#FFFFFF" text-anchor="end">One day of data ≈ 1,000,000,000 rows</text><rect x="40" y="620" width="14" height="36" rx="4" fill="#1B8A5A"/><text x="66" y="645" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="17" font-weight="bold" fill="#1B8A5A" text-anchor="start">Excel limit: 1,048,576 rows (about 1/1000 of one day)</text><rect x="40" y="685" width="1120" height="52" rx="12" fill="#0B2026"/><text x="600" y="719" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="20" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Excel is too small. MySQL is too limited. We need something built for big data.</text></svg>