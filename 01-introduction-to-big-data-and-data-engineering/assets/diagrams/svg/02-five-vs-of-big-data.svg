<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" width="1200" height="660"><defs></defs><rect width="1200" height="660" rx="16" fill="#FAF8F5"/><text x="40" y="54" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="30" font-weight="bold" fill="#0B2026" text-anchor="start">The 5 Vs of Big Data</text><rect x="40" y="64" width="64" height="5" rx="2.5" fill="#FF5F46"/><text x="40" y="98" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="17" font-weight="normal" fill="#5F7281" text-anchor="start">Data is &#x27;big&#x27; when it is hard to handle on one machine because of one or more of these.</text><rect x="40" y="130" width="212" height="400" rx="16" fill="#FFFFFF" stroke="#2272B4" stroke-width="3"/><rect x="40" y="130" width="212" height="96" rx="16" fill="#2272B4"/><rect x="40" y="180" width="212" height="46" rx="0" fill="#2272B4"/><text x="146" y="200" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="56" font-weight="bold" fill="#FFFFFF" text-anchor="middle">V</text><text x="146" y="258" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="24" font-weight="bold" fill="#2272B4" text-anchor="middle">Volume</text><text x="146" y="284" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="15" font-weight="normal" fill="#5F7281" text-anchor="middle" font-style="italic">How much?</text><ellipse cx="146.0" cy="367.04" rx="28.0" ry="8.96" fill="#DCEBF7" stroke="#0B2026" stroke-width="2"/><rect x="118" y="320.96" width="56" height="46.08" fill="#DCEBF7"/><line x1="118" y1="320.96" x2="118" y2="367.04" stroke="#0B2026" stroke-width="2" stroke-linecap="round"/><line x1="174" y1="320.96" x2="174" y2="367.04" stroke="#0B2026" stroke-width="2" stroke-linecap="round"/><ellipse cx="146.0" cy="320.96" rx="28.0" ry="8.96" fill="#DCEBF7" stroke="#0B2026" stroke-width="2"/><path d="M118,340.8 A28.0,8.96 0 0 0 174,340.8" fill="none" stroke="#0B2026" stroke-width="1.5" stroke-linejoin="round"/><ellipse cx="154.0" cy="375.04" rx="28.0" ry="8.96" fill="#DCEBF7" stroke="#0B2026" stroke-width="2"/><rect x="126" y="328.96" width="56" height="46.08" fill="#DCEBF7"/><line x1="126" y1="328.96" x2="126" y2="375.04" stroke="#0B2026" stroke-width="2" stroke-linecap="round"/><line x1="182" y1="328.96" x2="182" y2="375.04" stroke="#0B2026" stroke-width="2" stroke-linecap="round"/><ellipse cx="154.0" cy="328.96" rx="28.0" ry="8.96" fill="#DCEBF7" stroke="#0B2026" stroke-width="2"/><path d="M126,348.8 A28.0,8.96 0 0 0 182,348.8" fill="none" stroke="#0B2026" stroke-width="1.5" stroke-linejoin="round"/><ellipse cx="162.0" cy="383.04" rx="28.0" ry="8.96" fill="#DCEBF7" stroke="#0B2026" stroke-width="2"/><rect x="134" y="336.96" width="56" height="46.08" fill="#DCEBF7"/><line x1="134" y1="336.96" x2="134" y2="383.04" stroke="#0B2026" stroke-width="2" stroke-linecap="round"/><line x1="190" y1="336.96" x2="190" y2="383.04" stroke="#0B2026" stroke-width="2" stroke-linecap="round"/><ellipse cx="162.0" cy="336.96" rx="28.0" ry="8.96" fill="#DCEBF7" stroke="#0B2026" stroke-width="2"/><path d="M134,356.8 A28.0,8.96 0 0 0 190,356.8" fill="none" stroke="#0B2026" stroke-width="1.5" stroke-linejoin="round"/><text x="146" y="430" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="16" font-weight="normal" fill="#0B2026" text-anchor="middle">100 GB a day,</text><text x="146" y="452" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="16" font-weight="normal" fill="#0B2026" text-anchor="middle">terabytes a year</text><rect x="267" y="130" width="212" height="400" rx="16" fill="#FFFFFF" stroke="#FF5F46" stroke-width="3"/><rect x="267" y="130" width="212" height="96" rx="16" fill="#FF5F46"/><rect x="267" y="180" width="212" height="46" rx="0" fill="#FF5F46"/><text x="373" y="200" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="56" font-weight="bold" fill="#FFFFFF" text-anchor="middle">V</text><text x="373" y="258" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="24" font-weight="bold" fill="#FF5F46" text-anchor="middle">Velocity</text><text x="373" y="284" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="15" font-weight="normal" fill="#5F7281" text-anchor="middle" font-style="italic">How fast?</text><path d="M329,372 A44,44 0 0 1 417,372" fill="none" stroke="#E8ECEF" stroke-width="9" stroke-linejoin="round"/><path d="M329,372 A44,44 0 0 1 395.0,333.72" fill="none" stroke="#FF5F46" stroke-width="9" stroke-linejoin="round"/><line x1="373" y1="372" x2="395.0" y2="344.72" stroke="#0B2026" stroke-width="4" stroke-linecap="round"/><circle cx="373" cy="372" r="6" fill="#0B2026"/><text x="373" y="430" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="16" font-weight="normal" fill="#0B2026" text-anchor="middle">Card swipes, ride</text><text x="373" y="452" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="16" font-weight="normal" fill="#0B2026" text-anchor="middle">requests and clicks</text><text x="373" y="474" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="16" font-weight="normal" fill="#0B2026" text-anchor="middle">arrive every second</text><rect x="494" y="130" width="212" height="400" rx="16" fill="#FFFFFF" stroke="#1B8A5A" stroke-width="3"/><rect x="494" y="130" width="212" height="96" rx="16" fill="#1B8A5A"/><rect x="494" y="180" width="212" height="46" rx="0" fill="#1B8A5A"/><text x="600" y="200" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="56" font-weight="bold" fill="#FFFFFF" text-anchor="middle">V</text><text x="600" y="258" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="24" font-weight="bold" fill="#1B8A5A" text-anchor="middle">Variety</text><text x="600" y="284" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="15" font-weight="normal" fill="#5F7281" text-anchor="middle" font-style="italic">What forms?</text><rect x="524" y="322" width="44" height="44" rx="4" fill="#FFFFFF" stroke="#0B2026" stroke-width="2"/><line x1="524" y1="336.6666666666667" x2="568" y2="336.6666666666667" stroke="#9AA8B4" stroke-width="1.5" stroke-linecap="round"/><line x1="524" y1="351.3333333333333" x2="568" y2="351.3333333333333" stroke="#9AA8B4" stroke-width="1.5" stroke-linecap="round"/><line x1="538.6666666666666" y1="322" x2="538.6666666666666" y2="366" stroke="#9AA8B4" stroke-width="1.5" stroke-linecap="round"/><line x1="553.3333333333334" y1="322" x2="553.3333333333334" y2="366" stroke="#9AA8B4" stroke-width="1.5" stroke-linecap="round"/><rect x="524" y="322" width="44" height="44" rx="4" fill="none" stroke="#0B2026" stroke-width="2"/><path d="M586,318 L608,318 L622,332 L622,368 L586,368 Z" fill="#FFFFFF" stroke="#0B2026" stroke-width="2.5" stroke-linejoin="round"/><path d="M608,318 L608,332 L622,332" fill="none" stroke="#0B2026" stroke-width="2" stroke-linejoin="round"/><line x1="595" y1="344" x2="613" y2="344" stroke="#2272B4" stroke-width="3" stroke-linecap="round"/><line x1="595" y1="353" x2="613" y2="353" stroke="#2272B4" stroke-width="3" stroke-linecap="round"/><line x1="595" y1="362" x2="613" y2="362" stroke="#2272B4" stroke-width="3" stroke-linecap="round"/><line x1="595" y1="371" x2="613" y2="371" stroke="#2272B4" stroke-width="3" stroke-linecap="round"/><rect x="624" y="326" width="52" height="40" rx="6" fill="#DCEBF7" stroke="#0B2026" stroke-width="2.5"/><circle cx="663.0" cy="338.0" r="4.4" fill="#E8A317"/><path d="M628,362 L642.2,340.0 L655.2,354.0 L663.0,348.0 L672,362 Z" fill="#1B8A5A" stroke-linejoin="round"/><text x="600" y="430" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="16" font-weight="normal" fill="#0B2026" text-anchor="middle">Tables, JSON, logs,</text><text x="600" y="452" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="16" font-weight="normal" fill="#0B2026" text-anchor="middle">images, video, text</text><rect x="721" y="130" width="212" height="400" rx="16" fill="#FFFFFF" stroke="#D93A25" stroke-width="3"/><rect x="721" y="130" width="212" height="96" rx="16" fill="#D93A25"/><rect x="721" y="180" width="212" height="46" rx="0" fill="#D93A25"/><text x="827" y="200" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="56" font-weight="bold" fill="#FFFFFF" text-anchor="middle">V</text><text x="827" y="258" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="24" font-weight="bold" fill="#D93A25" text-anchor="middle">Veracity</text><text x="827" y="284" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="15" font-weight="normal" fill="#5F7281" text-anchor="middle" font-style="italic">How trustworthy?</text><path d="M777,346 L786.8,357.2 L805,334.8" fill="none" stroke="#1B8A5A" stroke-width="5" stroke-linejoin="round"/><line x1="850" y1="333" x2="876" y2="359" stroke="#D93A25" stroke-width="5" stroke-linecap="round"/><line x1="850" y1="359" x2="876" y2="333" stroke="#D93A25" stroke-width="5" stroke-linecap="round"/><rect x="815" y="326" width="24" height="40" rx="0" fill="none"/><text x="827" y="430" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="16" font-weight="normal" fill="#0B2026" text-anchor="middle">Duplicates, missing</text><text x="827" y="452" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="16" font-weight="normal" fill="#0B2026" text-anchor="middle">values, typos, bad</text><text x="827" y="474" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="16" font-weight="normal" fill="#0B2026" text-anchor="middle">sensors</text><rect x="948" y="130" width="212" height="400" rx="16" fill="#FFFFFF" stroke="#6C4FBF" stroke-width="3"/><rect x="948" y="130" width="212" height="96" rx="16" fill="#6C4FBF"/><rect x="948" y="180" width="212" height="46" rx="0" fill="#6C4FBF"/><text x="1054" y="200" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="56" font-weight="bold" fill="#FFFFFF" text-anchor="middle">V</text><text x="1054" y="258" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="24" font-weight="bold" fill="#6C4FBF" text-anchor="middle">Value</text><text x="1054" y="284" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="15" font-weight="normal" fill="#5F7281" text-anchor="middle" font-style="italic">Why bother?</text><circle cx="1054" cy="346" r="34" fill="#FFF3D6" stroke="#E8A317" stroke-width="4"/><text x="1054" y="360" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="40" font-weight="bold" fill="#E8A317" text-anchor="middle">$</text><text x="1054" y="430" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="16" font-weight="normal" fill="#0B2026" text-anchor="middle">Insights that change</text><text x="1054" y="452" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="16" font-weight="normal" fill="#0B2026" text-anchor="middle">decisions and revenue</text><rect x="40" y="555" width="1120" height="70" rx="14" fill="#FFF3D6"/><text x="600" y="586" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="17" font-weight="bold" fill="#0B2026" text-anchor="middle">Volume, Velocity and Variety (the &#x27;3 Vs&#x27;) were described by analyst Doug Laney in 2001.</text><text x="600" y="610" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="16" font-weight="normal" fill="#5F7281" text-anchor="middle">Veracity and Value were added later as the field matured.</text></svg>