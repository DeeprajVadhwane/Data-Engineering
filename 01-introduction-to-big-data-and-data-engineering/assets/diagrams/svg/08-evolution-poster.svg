ound" marker-end="url(#ah0B2026)"/><rect x="944" y="150" width="206" height="400" rx="14" fill="#FFFFFF" stroke="#D93A25" stroke-width="2"/><path d="M944,190 L944,164 Q944,150 958,150 L1136,150 Q1150,150 1150,164 L1150,190 Z" fill="#D93A25"/><text x="1047.0" y="176.3" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="18" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Databricks</text><g fill="#FFE6E0" stroke="#0B2026" stroke-width="2"><ellipse cx="1023.0" cy="273.4" rx="30.0" ry="22.400000000000002"/><ellipse cx="1049.4" cy="258.0" rx="31.200000000000003" ry="26.6"/><ellipse cx="1073.4" cy="273.4" rx="31.200000000000003" ry="22.400000000000002"/></g><rect x="1023.0" y="268.5" width="50.4" height="28.0" fill="#FFE6E0"/><ellipse cx="1047.0" cy="268.5" rx="36.0" ry="10.5" fill="#FFE6E0"/><text x="1047" y="345" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="14" font-weight="bold" fill="#5F7281" text-anchor="middle">Solves it with</text><text x="1047" y="372" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="16" font-weight="bold" fill="#0B2026" text-anchor="middle">Managed Spark +</text><text x="1047" y="394" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="16" font-weight="bold" fill="#0B2026" text-anchor="middle">governance + notebooks</text><rect x="958" y="440" width="178" height="90" rx="10" fill="#D93A25"/><text x="1047" y="468" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="13" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Today:</text><text x="1047" y="492" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="16" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Spark made easy,</text><text x="1047" y="512" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="16" font-weight="bold" fill="#FFFFFF" text-anchor="middle">unified &amp; governed</text><rect x="40" y="585" width="1120" height="80" rx="14" fill="#0B2026"/><text x="600" y="632" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="24" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Databricks is not magic. It is Spark, made easy, unified and governed.</text></svg>