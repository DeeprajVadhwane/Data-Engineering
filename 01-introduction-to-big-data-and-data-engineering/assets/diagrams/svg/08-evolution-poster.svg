<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700"><defs><marker id="ah0B2026" markerWidth="12" markerHeight="12" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L12,6 L0,12 z" fill="#0B2026"/></marker></defs><rect width="1200" height="700" rx="16" fill="#FAF8F5"/><text x="40" y="54" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="30" font-weight="bold" fill="#0B2026" text-anchor="start">The Big Picture: Each Tool Fixes the Last One&#x27;s Limit</text><rect x="40" y="64" width="64" height="5" rx="2.5" fill="#FF5F46"/><text x="40" y="98" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="17" font-weight="normal" fill="#5F7281" text-anchor="start">Excel → MySQL → Hadoop → Spark → Databricks</text><rect x="40" y="150" width="206" height="400" rx="14" fill="#FFFFFF" stroke="#1B8A5A" stroke-width="2"/><path d="M40,190 L40,164 Q40,150 54,150 L232,150 Q246,150 246,164 L246,190 Z" fill="#1B8A5A"/><text x="143.0" y="176.3" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="18" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Excel</text><rect x="108" y="215" width="70" height="90" rx="6" fill="#FFFFFF" stroke="#0B2026" stroke-width="2.5"/><circle cx="116" cy="229" r="4" fill="#9AA8B4" stroke="#0B2026" stroke-width="1.5"/><circle cx="116" cy="245" r="4" fill="#9AA8B4" stroke="#0B2026" stroke-width="1.5"/><circle cx="116" cy="261" r="4" fill="#9AA8B4" stroke="#0B2026" stroke-width="1.5"/><circle cx="116" cy="277" r="4" fill="#9AA8B4" stroke="#0B2026" stroke-width="1.5"/><circle cx="116" cy="293" r="4" fill="#9AA8B4" stroke="#0B2026" stroke-width="1.5"/><line x1="132" y1="235" x2="168" y2="235" stroke="#9AA8B4" stroke-width="2" stroke-linecap="round"/><line x1="132" y1="249" x2="168" y2="249" stroke="#9AA8B4" stroke-width="2" stroke-linecap="round"/><line x1="132" y1="263" x2="168" y2="263" stroke="#9AA8B4" stroke-width="2" stroke-linecap="round"/><line x1="132" y1="277" x2="168" y2="277" stroke="#9AA8B4" stroke-width="2" stroke-linecap="round"/><line x1="132" y1="291" x2="168" y2="291" stroke="#9AA8B4" stroke-width="2" stroke-linecap="round"/><text x="143" y="345" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="14" font-weight="bold" fill="#5F7281" text-anchor="middle">Limit</text><text x="143" y="372" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="16" font-weight="bold" fill="#0B2026" text-anchor="middle">About 1 million rows,</text><text x="143" y="394" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="16" font-weight="bold" fill="#0B2026" text-anchor="middle">crashes, manual</text><rect x="54" y="440" width="178" height="90" rx="10" fill="#E8ECEF"/><text x="143" y="468" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="13" font-weight="bold" fill="#5F7281" text-anchor="middle">Fix:</text><text x="143" y="492" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="16" font-weight="bold" fill="#0B2026" text-anchor="middle">Tables + SQL</text><line x1="248" y1="350" x2="264" y2="350" stroke="#0B2026" stroke-width="3" stroke-linecap="round" marker-end="url(#ah0B2026)"/><rect x="266" y="150" width="206" height="400" rx="14" fill="#FFFFFF" stroke="#2272B4" stroke-width="2"/><path d="M266,190 L266,164 Q266,150 280,150 L458,150 Q472,150 472,164 L472,190 Z" fill="#2272B4"/><text x="369.0" y="176.3" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="18" font-weight="bold" fill="#FFFFFF" text-anchor="middle">MySQL</text><path d="M319,249.0 L369.0,225 L419,249.0 Z" fill="#2272B4" stroke="#0B2026" stroke-width="2.5" stroke-linejoin="round"/><rect x="323" y="249.0" width="92" height="56.0" rx="2" fill="#FFFFFF" stroke="#0B2026" stroke-width="2.5"/><rect x="344.0" y="265.0" width="50.0" height="40.0" rx="2" fill="#DCEBF7" stroke="#0B2026" stroke-width="2"/><line x1="344.0" y1="275.0" x2="394.0" y2="275.0" stroke="#0B2026" stroke-width="1.5" stroke-linecap="round"/><line x1="344.0" y1="285.0" x2="394.0" y2="285.0" stroke="#0B2026" stroke-width="1.5" stroke-linecap="round"/><line x1="344.0" y1="295.0" x2="394.0" y2="295.0" stroke="#0B2026" stroke-width="1.5" stroke-linecap="round"/><text x="369" y="345" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="14" font-weight="bold" fill="#5F7281" text-anchor="middle">Limit</text><text x="369" y="372" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="16" font-weight="bold" fill="#0B2026" text-anchor="middle">Hard to scale,</text><text x="369" y="394" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="16" font-weight="bold" fill="#0B2026" text-anchor="middle">slow at 100 GB/day</text><rect x="280" y="440" width="178" height="90" rx="10" fill="#E8ECEF"/><text x="369" y="468" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="13" font-weight="bold" fill="#5F7281" text-anchor="middle">Fix:</text><text x="369" y="492" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="16" font-weight="bold" fill="#0B2026" text-anchor="middle">Many machines</text><text x="369" y="512" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="16" font-weight="bold" fill="#0B2026" text-anchor="middle">(Hadoop)</text><line x1="474" y1="350" x2="490" y2="350" stroke="#0B2026" stroke-width="3" stroke-linecap="round" marker-end="url(#ah0B2026)"/><rect x="492" y="150" width="206" height="400" rx="14" fill="#FFFFFF" stroke="#E8A317" stroke-width="2"/><path d="M492,190 L492,164 Q492,150 506,150 L684,150 Q698,150 698,164 L698,190 Z" fill="#E8A317"/><text x="595.0" y="176.3" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="18" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Hadoop</text><rect x="567" y="235" width="56" height="56" rx="8" fill="#FFFFFF" stroke="#0B2026" stroke-width="2"/><circle cx="595.0" cy="263.0" r="16.8" fill="#E8ECEF" stroke="#0B2026" stroke-width="1.5"/><circle cx="595.0" cy="263.0" r="3.9200000000000004" fill="#0B2026"/><line x1="595.0" y1="263.0" x2="611.8" y2="247.32" stroke="#0B2026" stroke-width="2" stroke-linecap="round"/><text x="595" y="345" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="14" font-weight="bold" fill="#5F7281" text-anchor="middle">Limit</text><text x="595" y="372" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="16" font-weight="bold" fill="#0B2026" text-anchor="middle">Disk-based:</text><text x="595" y="394" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="16" font-weight="bold" fill="#0B2026" text-anchor="middle">slow multi-step jobs</text><rect x="506" y="440" width="178" height="90" rx="10" fill="#E8ECEF"/><text x="595" y="468" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="13" font-weight="bold" fill="#5F7281" text-anchor="middle">Fix:</text><text x="595" y="492" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="16" font-weight="bold" fill="#0B2026" text-anchor="middle">In-memory</text><text x="595" y="512" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="16" font-weight="bold" fill="#0B2026" text-anchor="middle">(Spark)</text><line x1="700" y1="350" x2="716" y2="350" stroke="#0B2026" stroke-width="3" stroke-linecap="round" marker-end="url(#ah0B2026)"/><rect x="718" y="150" width="206" height="400" rx="14" fill="#FFFFFF" stroke="#FF5F46" stroke-width="2"/><path d="M718,190 L718,164 Q718,150 732,150 L910,150 Q924,150 924,164 L924,190 Z" fill="#FF5F46"/><text x="821.0" y="176.3" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="18" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Spark</text><rect x="785" y="248" width="72" height="34" rx="3" fill="#8ED16F" stroke="#0B2026" stroke-width="1.5"/><rect x="791" y="253" width="9" height="11" rx="2" fill="#0B2026"/><rect x="804" y="253" width="9" height="11" rx=