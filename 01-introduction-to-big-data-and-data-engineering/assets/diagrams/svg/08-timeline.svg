<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 740" width="1200" height="740"><defs></defs><rect width="1200" height="740" rx="16" fill="#FAF8F5"/><text x="40" y="54" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="30" font-weight="bold" fill="#0B2026" text-anchor="start">A Timeline of Big Data Processing</text><rect x="40" y="64" width="64" height="5" rx="2.5" fill="#FF5F46"/><text x="40" y="98" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="17" font-weight="normal" fill="#5F7281" text-anchor="start">Each milestone solved a problem the previous one could not.</text><line x1="60" y1="380" x2="1140" y2="380" stroke="#0B2026" stroke-width="6" stroke-linecap="round"/><circle cx="122" cy="380" r="13" fill="#2272B4" stroke="#0B2026" stroke-width="3"/><line x1="122" y1="380" x2="122" y2="300" stroke="#2272B4" stroke-width="3" stroke-linecap="round"/><rect x="30" y="150" width="184" height="150" rx="12" fill="#FFFFFF" stroke="#2272B4" stroke-width="3"/><text x="122" y="180" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="20" font-weight="bold" fill="#2272B4" text-anchor="middle">1970</text><text x="122" y="204" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="15" font-weight="bold" fill="#0B2026" text-anchor="middle">Relational model</text><text x="122" y="228" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="12" font-weight="normal" fill="#5F7281" text-anchor="middle">Codd proposes tables</text><text x="122" y="245" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="12" font-weight="normal" fill="#5F7281" text-anchor="middle">and SQL-style</text><text x="122" y="262" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="12" font-weight="normal" fill="#5F7281" text-anchor="middle">relations</text><circle cx="230" cy="380" r="13" fill="#1B8A5A" stroke="#0B2026" stroke-width="3"/><line x1="230" y1="380" x2="230" y2="440" stroke="#1B8A5A" stroke-width="3" stroke-linecap="round"/><rect x="138" y="440" width="184" height="150" rx="12" fill="#FFFFFF" stroke="#1B8A5A" stroke-width="3"/><text x="230" y="470" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="20" font-weight="bold" fill="#1B8A5A" text-anchor="middle">1985</text><text x="230" y="494" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="15" font-weight="bold" fill="#0B2026" text-anchor="middle">Excel</text><text x="230" y="518" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="12" font-weight="normal" fill="#5F7281" text-anchor="middle">Spreadsheets reach</text><text x="230" y="535" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="12" font-weight="normal" fill="#5F7281" text-anchor="middle">every desk</text><circle cx="338" cy="380" r="13" fill="#2272B4" stroke="#0B2026" stroke-width="3"/><line x1="338" y1="380" x2="338" y2="300" stroke="#2272B4" stroke-width="3" stroke-linecap="round"/><rect x="246" y="150" width="184" height="150" rx="12" fill="#FFFFFF" stroke="#2272B4" stroke-width="3"/><text x="338" y="180" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="20" font-weight="bold" fill="#2272B4" text-anchor="middle">1995</text><text x="338" y="204" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="15" font-weight="bold" fill="#0B2026" text-anchor="middle">MySQL</text><text x="338" y="228" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="12" font-weight="normal" fill="#5F7281" text-anchor="middle">Open-source SQL</text><text x="338" y="245" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="12" font-weight="normal" fill="#5F7281" text-anchor="middle">database released</text><circle cx="446" cy="380" r="13" fill="#E8A317" stroke="#0B2026" stroke-width="3"/><line x1="446" y1="380" x2="446" y2="440" stroke="#E8A317" stroke-width="3" stroke-linecap="round"/><rect x="354" y="440" width="184" height="150" rx="12" fill="#FFFFFF" stroke="#E8A317" stroke-width="3"/><text x="446" y="470" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="20" font-weight="bold" fill="#E8A317" text-anchor="middle">2003-04</text><text x="446" y="494" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="15" font-weight="bold" fill="#0B2026" text-anchor="middle">Google papers</text><text x="446" y="518" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="12" font-weight="normal" fill="#5F7281" text-anchor="middle">GFS and MapReduce</text><text x="446" y="535" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="12" font-weight="normal" fill="#5F7281" text-anchor="middle">describe distributed</text><text x="446" y="552" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="12" font-weight="normal" fill="#5F7281" text-anchor="middle">storage and processing</text><circle cx="554" cy="380" r="13" fill="#E8A317" stroke="#0B2026" stroke-width="3"/><line x1="554" y1="380" x2="554" y2="300" stroke="#E8A317" stroke-width="3" stroke-linecap="round"/><rect x="462" y="150" width="184" height="150" rx="12" fill="#FFFFFF" stroke="#E8A317" stroke-width="3"/><text x="554" y="180" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="20" font-weight="bold" fill="#E8A317" text-anchor="middle">2006</text><text x="554" y="204" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="15" font-weight="bold" fill="#0B2026" text-anchor="middle">Hadoop</text><text x="554" y="228" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="12" font-weight="normal" fill="#5F7281" text-anchor="middle">Open-source HDFS +</text><text x="554" y="245" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="12" font-weight="normal" fill="#5F7281" text-anchor="middle">MapReduce</text><circle cx="662" cy="380" r="13" fill="#FF5F46" stroke="#0B2026" stroke-width="3"/><line x1="662" y1="380" x2="662" y2="440" stroke="#FF5F46" stroke-width="3" stroke-linecap="round"/><rect x="570" y="440" width="184" height="150" rx="12" fill="#FFFFFF" stroke="#FF5F46" stroke-width="3"/><text x="662" y="470" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="20" font-weight="bold" fill="#FF5F46" text-anchor="middle">2010</text><text x="662" y="494" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="15" font-weight="bold" fill="#0B2026" text-anchor="middle">Spark open-sourced</text><text x="662" y="518" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="12" font-weight="normal" fill="#5F7281" text-anchor="middle">Born at UC Berkeley&#x27;s</text><text x="662" y="535" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="12" font-weight="normal" fill="#5F7281" text-anchor="middle">AMPLab in 2009</text><circle cx="770" cy="380" r="13" fill="#FF5F46" stroke="#0B2026" stroke-width="3"/><line x1="770" y1="380" x2="770" y2="300" stroke="#FF5F46" stroke-width="3" stroke-linecap="round"/><rect x="678" y="150" width="184" height="150" rx="12" fill="#FFFFFF" stroke="#FF5F46" stroke-width="3"/><text x="770" y="180" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="20" font-weight="bold" fill="#FF5F46" text-anchor="middle">2013</text><text x="770" y="204" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="15" font-weight="bold" fill="#0B2026" text-anchor="middle">YARN &amp; Databricks</text><text x="770" y="228" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="12" font-weight="normal" fill="#5F7281" text-anchor="middle">Hadoop 2 adds YARN;</text><text x="770" y="245" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="12" font-weight="normal" fill="#5F7281" text-anchor="middle">Databricks is founded</text><circle cx="878" cy="380" r="13" fill="#FF5F46" stroke="#0B2026" stroke-width="3"/><line x1="878" y1="380" x2="878" y2="440" stroke="#FF5F46" stroke-width="3" stroke-linecap="round"/><rect x="786" y="440" width="184" height="150" rx="12" fill="#FFFFFF" stroke="#FF5F46" stroke-width="3"/><text x="878" y="470" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="20" font-weight="bold" fill="#FF5F46" text-anchor="middle">2014</text><text x="878" y="494" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="15" font-weight="bold" fill="#0B2026" text-anchor="middle">Spark 1.0</text><text x="878" y="518" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="12" font-weight="normal" fill="#5F7281" text-anchor="middle">Becomes a top-level</text><text x="878" y="535" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="12" font-weight="normal" fill="#5F7281" text-anchor="middle">Apache project</text><circle cx="986" cy="380" r="13" fill="#D93A25" stroke="#0B2026" stroke-width="3"/><line x1="986" y1="380" x2="986" y2="300" stroke="#D93A25" stroke-width="3" stroke-linecap="round"/><rect x="894" y="150" width="184" height="150" rx="12" fill="#FFFFFF" stroke="#D93A25" stroke-width="3"/><text x="986" y="180" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="20" font-weight="bold" fill="#D93A25" text-anchor="middle">2019</text><text x="986" y="204" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="15" font-weight="bold" fill="#0B2026" text-anchor="middle">Delta Lake</text><text x="986" y="228" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="12" font-weight="normal" fill="#5F7281" text-anchor="middle">Open-sourced: reliable</text><text x="986" y="245" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="12" font-weight="normal" fill="#5F7281" text-anchor="middle">tables on data lakes</text><circle cx="1094" cy="380" r="13" fill="#D93A25" stroke="#0B2026" stroke-width="3"/><line x1="1094" y1="380" x2="1094" y2="440" stroke="#D93A25" stroke-width="3" stroke-linecap="round"/><rect x="1002" y="440" width="184" height="150" rx="12" fill="#FFFFFF" stroke="#D93A25" stroke-width="3"/><text x="1094" y="470" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="20" font-weight="bold" fill="#D93A25" text-anchor="middle">2021</text><text x="1094" y="494" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="15" font-weight="bold" fill="#0B2026" text-anchor="middle">Lakehouse paper</text><text x="1094" y="518" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="12" font-weight="normal" fill="#5F7281" text-anchor="middle">The lakehouse</text><text x="1094" y="535" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="12" font-weight="normal" fill="#5F7281" text-anchor="middle">architecture is</text><text x="1094" y="552" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="12" font-weight="normal" fill="#5F7281" text-anchor="middle">formalised</text><rect x="60" y="690" width="16" height="16" rx="4" fill="#2272B4"/><text x="84" y="704" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="15" font-weight="bold" fill="#0B2026" text-anchor="start">Single machine &amp; databases</text><rect x="350" y="690" width="16" height="16" rx="4" fill="#E8A317"/><text x="374" y="704" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="15" font-weight="bold" fill="#0B2026" text-anchor="start">Hadoop era</text><rect x="640" y="690" width="16" height="16" rx="4" fill="#FF5F46"/><text x="664" y="704" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="15" font-weight="bold" fill="#0B2026" text-anchor="start">Spark era</text><rect x="930" y="690" width="16" height="16" rx="4" fill="#D93A25"/><text x="954" y="704" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="15" font-weight="bold" fill="#0B2026" text-anchor="start">Lakehouse era</text></svg>